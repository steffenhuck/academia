 auto:{good:1,fx:{E:5,mom:4},say:"A colleague mentions it, unprompted, in the lift, in a tone you cannot place. The lift arrives before you can."}},
{id:"K2",ti:"Ten Thousand",b:[3,4],ex:{base:.8},ga:{cites:10000},once:1,
 sc:"Ten thousand citations. There is no ceremony. There is a number on a web page that was 9,998 yesterday.",
 auto:{good:1,fx:{E:6,mom:8,P:4},say:"You screenshot it. You do not send the screenshot to anyone. You keep it."}},
{id:"K3",ti:"The Namesake",b:[1,4],ex:{base:.6},ga:{papers:2},once:1,
 sc:"A scholarly search engine has merged your profile with a chemist of the same name at a university in Ohio. Your citation count has doubled overnight. The chemist works on polymers and is, by the numbers, more influential than you.",
 ch:[
 {t:"Fix it. Email the search engine.",fx:{E:-2,K:1},say:"It takes eleven weeks and three forms. Your count halves. The chemist never knew. You have corrected a thing nobody would have checked, for the sake of a number you have told everyone you do not care about."},
 {t:"Leave it. Polymers are interesting.",fx:{E:3,cites:120,flag:"POLYMERS"},say:"For four years your citation count includes a well-regarded body of work on polymer degradation. A dean cites the number in a slide. You do not correct the dean."}]},
{id:"K4",ti:"The Wrong Way",b:[2,4],ex:{base:.7},ga:{papers:3},once:1,
 sc:"Your 2034 paper has been cited forty-one times this year. You look. Thirty-eight of the forty-one cite it as the example of what not to do.",
 auto:{bad:1,fx:{cites:41,E:-5,mom:-2},say:"Forty-one citations. The number goes up. The number does not have a column for why."}},
{id:"K5",ti:"Three",b:[3,4],ex:{base:.7},ga:{papers:4},once:1,
 sc:"The paper you think is your best has three citations, five years on. One is yours. One is a survey that lists it. One is a graduate student in Chile, {chile}, who, from the text, actually read it.",
 ch:[
 {t:"Promote it. Talks, threads, a new title.",fx:{P:5,mom:4,N:3,B:4,cites:20,flag:"PROMOTED_ORPHAN"},say:"Fourteen more citations in two years, none of them from people who read it as carefully as the student in Chile. You have learned that attention is a technology and that you can operate it, and something in you wishes you had not."},
 {t:"Write to the student in Chile.",fx:{N:3,E:-2,flag:"WROTE_TO_CHILE"},say:"He replies in nine minutes. You correspond for eleven years. He places at Ostrander and cites the paper in everything, correctly, and it never has more than thirty citations, and it is still your best."},
 {t:"Let it lie. Good papers wait.",fx:{E:-1},say:"It waits. In 2049, someone at Harwich rediscovers it and it has a small second life, which you watch from a distance, like weather in a city you used to live in."}]},
{id:"K6",ti:"The Survey",b:[2,4],ex:{base:.7},ga:{papers:3},once:1,
 sc:"The new survey of your subfield is ninety pages long, cites two hundred and eleven papers, and does not cite you. You have checked twice. You have checked a third time in a different browser.",
 ch:[
 {t:"Write to the author. Politely.",fx:{N:2,E:-3,cites:8},say:"A gracious reply, a promise to add it in the published version, and a citation in a footnote that begins “see also.” You have been seen, also."},
 {t:"Say nothing. Cite the survey.",fx:{E:-4,B:2},say:"You cite it, correctly, in your next paper. The next survey, in six years, is by the author's student, and the omission is inherited, the way these things are."}]},
{id:"K7",ti:"The Footnote",b:[2,4],ex:{base:.6},ga:{papers:2},once:1,
 sc:"A famous paper has cited you, in footnote 22, for a claim you did not make. The claim is wrong. The famous paper's argument depends on it slightly. You are now, in the literature, the person who said the wrong thing.",
 ch:[
 {t:"Write to the famous author.",roll:{stat:"N",pivot:50,
   win:{fx:{N:5,R:2,E:2},say:"“Good catch — fixing.” The published version cites you correctly for a different claim, one you did make, which is now the thing you are known for, which is a small improvement on the wrong one."},
   lose:{fx:{E:-3,N:-2},say:"No reply. The footnote stands. For a decade, papers cite the famous paper's footnote 22, and the chain of error has your name at the bottom, holding it up."}}},
 {t:"Let it stand. Citations are citations.",fx:{cites:15,E:-2,flag:"WRONG_CITE_KEPT"},say:"Fifteen citations for a claim you did not make. You have been credited with an error. The count does not distinguish."}]},
{id:"K8",ti:"The Slide",b:[3,4],ex:{base:.7,office:.4},ga:{papers:3},once:1,
 sc:"The dean's annual slide has a table. The table has names and citation counts. Yours is on it, next to a colleague's, and the colleague's number is larger, and the slide is on a screen in a room with sixty people in it.",
 ch:[
 {t:"Say something afterwards. To the dean.",fx:{K:2,N:-2,E:-2},say:"The dean is surprised anyone minds. Next year the slide has no names. Everyone knows why, and whose."},
 {t:"Say nothing. Work more.",fx:{R:2,wip:10,B:4,E:-3},say:"The colleague's number stays larger. The colleague is a nice person who works on a topic more people work on. This is what the number measures, and you know it, and you work more."}]},
{id:"K9",ti:"The Ring",b:[3,4],ex:{base:1.1,highP:.8},ga:{flag:"CARTEL"},once:1,
 sc:"A data journalist has mapped citation rings. There is a graph. The graph has a cluster, and the cluster has four nodes, and one of the nodes is you, and the graph is in a newspaper with a headline that uses the word “cartel,” which is, you reflect, the word you used yourselves, at dinner, as a joke.",
 auto:{bad:1,fx:{P:-8,N:-6,E:-6,mom:-8},say:"Nothing is retracted. Nothing was wrong, exactly. Your count is what it was. It is now a count with an asterisk that only appears in other people's minds."}},
{id:"K10",ti:"The Audit",b:[3,4],ex:{base:1},ga:{flag:"ASKED_SELF_CITE"},once:1,
 sc:"The journal is auditing coerced citation. They have the reports. They have the paragraphs that were added after the reports. They have a spreadsheet, and a column, and a letter, and the letter is addressed to you.",
 ch:[
 {t:"Reply honestly. It was once.",fx:{N:-3,E:-6,K:2,flag:"ADMITTED_ONCE"},say:"It was once. The journal's letter back says “noted.” You are not named. You are on a list that is not published and is, you suspect, consulted."},
 {t:"Reply that the literature was relevant.",fx:{E:2,N:-5,foe:{why:"the audit",poisons:"referee"}},say:"It was relevant. The editor who wrote the letter has a good memory and a long tenure and does not send you papers to referee again, which you notice in about a year."}]},
{id:"K11",ti:"The Page",b:[3,4],ex:{base:.6,highP:.7},ga:{papers:5},once:1,
 sc:"Someone has made you a Wikipedia page. It is short. It is wrong about your first job, your middle name and, in a sentence that has been there for three months, your main contribution.",
 ch:[
 {t:"Edit it yourself.",fx:{P:3,E:4,flag:"EDITED_OWN_PAGE"},say:"You fix the middle name and the job and, after some thought, the contribution. A volunteer reverts the contribution within the hour with the note “unsourced.” You are the source. This is not, it emerges, admissible."},
 {t:"Leave it. It's Wikipedia.",fx:{E:-1},say:"Your middle name is wrong on the internet for the rest of your life. Students cite it. One of them puts it on your festschrift."}]},
{id:"K12",ti:"The Dead-Cite",b:[3,4],ex:{base:.5},ga:{cites:2000},once:1,
 sc:"You have been told, by a graduate student who did the exercise for a methods class, that 61% of the papers citing your most-cited paper cite only the abstract, and 22% cite it for a finding that is in a different paper of yours, and one cites it for a finding that is in no paper of anyone's.",
 auto:{fx:{E:-3},say:"You thank the student. You do not ask which one."}},

/* ---------- the PhD, filled ---------- */
{id:"P12",ti:"The Comprehensive",b:[0,0],ex:{base:1},once:1,
 sc:"The comprehensive exam. Six hours, four questions, one of which is on a topic the department stopped teaching two years ago and one professor still examines.",
 ch:[
 {t:"Answer what you know. Skip the fourth.",roll:{stat:"R",pivot:20,
   win:{fx:{R:3,E:3},say:"Pass. The professor with the fourth question writes “disappointing” on it and passes you anyway, which is what he does, which everyone knew but you."},
   lose:{fx:{E:-8,B:6,R:-1},say:"Retake in August. The summer you had planned to write becomes a summer you spend learning a thing the field abandoned, for a man who has not."}}},
 {t:"Attempt the fourth. Bluff.",roll:{stat:"E",pivot:45,
   win:{fx:{R:2,E:6,N:2},say:"The bluff is good enough. He writes “interesting” on it, which from him is a medal, and mentions you to the placement director, who did not know your name."},
   lose:{fx:{E:-10,B:6},say:"He writes three pages in reply to your one. You pass. The three pages are in your file, and are read by the placement director, and are, in their way, a letter."}}}]},
{id:"P13",ti:"The Sections",b:[0,0],ex:{base:.9,lowS:1},
 sc:"Two extra TA sections are available. They pay $4k each and take a day a week each. The dissertation takes the other days.",
 ch:[
 {t:"Take both. Money is money.",fx:{S:6,B:8,R:-2,K:2},say:"You grade until midnight. The stipend becomes, for a year, a living. The dissertation becomes, for a year, a rumour."},
 {t:"Take one.",fx:{S:3,B:3,K:1},say:"A compromise, which is the technical term for being slightly tired and slightly poor."},
 {t:"Take none. Write.",fx:{R:4,wip:15,S:-1},say:"You eat rice. The chapter gets written. You will tell this story later as if it were a choice, and it was, and it was also rice."}]},
{id:"P14",ti:"The Summer",b:[0,0],ex:{base:.9},once:1,
 sc:"A bank has offered a summer internship. Ten weeks, real money, a desk with a view, and a line on the CV that half the faculty will read as a confession.",
 ch:[
 {t:"Take it.",fx:{S:8,N:4,K:3,R:-2,flag:"BANK_SUMMER"},say:"You learn what a trading floor sounds like and what a bonus is. In October your advisor asks, lightly, whether you are “still with us,” and you are, and the question stays."},
 {t:"Stay. Research summer.",fx:{R:4,wip:20,S:-2},say:"Ten weeks in an empty building with the good whiteboard to yourself. The chapter gets a result. The result gets a job talk. Nobody asks whether you are still with them, because there is nowhere else you could have been."}]},
{id:"P15",ti:"The One Who Left",b:[0,1],ex:{base:.8},once:1,
 sc:"Someone in your cohort has left. Not failed — left, for a job at a consultancy, with a salary that was mentioned, once, at drinks, and then not mentioned again by anyone, carefully.",
 ch:[
 {t:"Ask her why.",fx:{N:2,E:-3,B:-2,flag:"ASKED_LEAVER"},say:"She says: “I noticed I was unhappy and that nobody else had.” You think about it on the walk home. You do not leave. You think about it on other walks."},
 {t:"Don't. Work.",fx:{R:2,wip:8,B:2},say:"The cohort closes over the gap. In a year her name comes up and someone says “oh — she's fine,” and she is, and the tone is the tone people use for the dead."}]},
{id:"P16",ti:"The Poster",b:[0,1],ex:{base:.8},once:1,
 sc:"A poster session. Your poster is between one on ant colonies and one on tax incidence, and a man with a lanyard has been reading yours for four minutes without speaking.",
 ch:[
 {t:"Talk to him.",roll:{stat:"N",pivot:25,
   win:{fx:{N:6,R:2,mom:3},say:"He is an editor. He asks a question, then a second, then gives you a card. The card is the first thing anyone in the profession has given you that you did not have to apply for."},
   lose:{fx:{E:-3},say:"He is from the ant colony poster and would like to know where the coffee is."}}},
 {t:"Let him read.",fx:{},say:"He reads for another minute and leaves. You will never know. This is most of a career, compressed."}]},

/* ---------- the clock, last years ---------- */
{id:"A18",ti:"Year Six",b:[2,2],ex:{base:1.2},once:1,
 sc:"{chair} takes you for coffee, which chairs do not do, and says your file is “a little thin on the top end,” which chairs do not say unless they mean it. There is a year. There are three papers in the drawer and one in the head.",
 ch:[
 {t:"Push the three out. Any journal that'll take them.",fx:{R:-2,B:8,mom:2,submit:[{tier:"B",lag:[2,3]},{tier:"C",lag:[2,3]},{tier:"C",lag:[2,3]}],flag:"PUSHED_THREE"},say:"Three submissions in a month, to a B and two Cs. The file will be thicker. Thick is a word committees use with a particular intonation."},
 {t:"Hold. Write the one in your head. Send it to the Quarterly.",fx:{R:5,B:10,E:4,submit:{bias:1.5,lag:[5,7],q:12},flag:"HELD_FOR_ONE"},say:"One paper, one shot, out to the Quarterly in March with the tenure letters. The file does not change this year. The chair does not take you for coffee again. The two documents will be read together."}]},
{id:"A19",ti:"The Letter Writer",b:[2,2],ex:{base:.6},once:1,
 sc:"Your strongest external letter writer has died, in February, before writing. The chair is sympathetic and has a list of alternatives, none of whom have read your work, all of whom are alive.",
 auto:{bad:1,fx:{N:-4,B:6,E:-3},say:"The replacement letter is warm and general and one page long. The committee notices the length. You attend the funeral, which is in another city, and are the only person there from your subfield, and this is noticed too, by nobody who votes."}},
{id:"A20",ti:"The Mid-Tenure Review",b:[2,2],ex:{base:1},once:1,
 sc:"Year three. The mid-tenure review is “informal” and “developmental” and “not a decision,” three phrases that describe a decision. The committee has questions about your “trajectory.”",
 ch:[
 {t:"Give them the trajectory. Slides.",fx:{K:4,N:3,B:4,E:2},say:"Eleven slides, one arrow, going up. The committee likes an arrow. Nothing changes in the file and something changes in the room."},
 {t:"Tell them the truth: the good paper is two years away.",fx:{R:3,N:-2,E:-2,flag:"TOLD_TRAJECTORY"},say:"Honesty, in a developmental review, is developmental. The committee writes “candid” in its notes. In three years one of them remembers the good paper was promised, and checks."}]},

/* ---------- the plateau ---------- */
{id:"N16",ti:"The Younger Version",b:[4,4],ex:{base:.7,lowMom:1},once:1,
 sc:"{star} has just given your talk. Not a talk on your topic — your talk, the one you have given for a decade, with a better figure, a cleaner proof, and a joke in the place where you have always had a pause.",
 ch:[
 {t:"Congratulate them. Ask for the slides.",fx:{N:4,R:2,E:-5,flag:"ASKED_FOR_SLIDES"},say:"The slides arrive with a note that says “learned it all from you,” which is true and does not help. You use the figure. You do not use the joke."},
 {t:"Ask the question that shows you saw the gap.",roll:{stat:"R",pivot:65,
   win:{fx:{E:5,mom:4,N:2},say:"There is a gap. You find it in ninety seconds. The room remembers who taught whom, for a year or so."},
   lose:{fx:{E:-8,N:-3},say:"There is no gap. You have asked the question of a person who has thought about it more recently than you, in front of people who noticed."}}}]},
{id:"N17",ti:"The Inheritance",b:[4,4],ex:{base:.6},once:1,
 sc:"A retiring colleague — the good one, the one whose students place — has asked whether you would take his last three. They are excellent. They are also his, and will be, in every seminar, for years.",
 ch:[
 {t:"Take them.",fx:{N:6,B:8,K:2,R:-2,flag:"INHERITED"},say:"Three excellent students, all of whom describe you, correctly, as their second advisor. They place beautifully. The placements are, in the department's memory, his."},
 {t:"Take one. The one who chose you.",fx:{N:3,B:3,E:2},say:"One student. She becomes yours. The other two go to someone who takes them for the placements, and gets them, and the placements are his too."}]},
{id:"N18",ti:"Fifty",b:[4,4],ex:{base:.6},once:1,
 sc:"You are fifty. There is a cake in the common room with a number on it. Somebody has calculated, on a napkin, at your own party, that you have perhaps five more papers in you that anyone will read.",
 ch:[
 {t:"Make them count. Clear everything else.",fx:{R:5,wip:25,N:-4,B:6,E:3,flag:"FIVE_PAPERS"},say:"You resign from four things. The papers are better. The four things are done by other people, worse, and nobody minds, which is its own small lesson about the four things."},
 {t:"Take the napkin as a joke. Keep going as before.",fx:{B:2},say:"You keep going. There are, it turns out, six. The napkin was wrong by one."}]},
{id:"N19",ti:"The Textbook",b:[3,4],ex:{base:.6,highP:.5},ga:{R:45},once:1,
 sc:"A publisher would like a textbook. Four years, a great deal of money, a book that will be assigned to eleven thousand undergraduates a year who will hate it uniformly, and a name that will, in the profession, quietly become an adjective.",
 ch:[
 {t:"Write it.",fx:{S:30,P:10,N:4,R:-4,tax:8,flag:"TEXTBOOK"},say:"Four years, one point a term. The book is very good and is assigned everywhere. You are, forever, the textbook person. The royalties buy a house. The house has a study with your book in it, spine out, which visitors comment on, and you have learned to laugh first."},
 {t:"Decline. Books are for the retired.",fx:{R:3,wip:15},say:"A colleague at Fenwick writes it. It is fine. It is assigned everywhere. He is the textbook person and owns a house, and you have a paper."}]},

/* ---------- the office: the board, the second term ---------- */
{id:"Q19",ti:"The Second Term",b:[3,4],ex:{base:1,office:1.5},ga:{office:4},once:1,
 sc:"The board would like to renew you. Five more years. There are conditions, which the chair describes as “alignment” and which are, on the second page, a list of things you will no longer decide.",
 ch:[
 {t:"Accept the terms.",fx:{S:40,K:4,N:4,E:-6,B:6,flag:"SECOND_TERM"},say:"Five more years and a smaller office, in the sense that matters. The things you no longer decide are decided by the board chair's nephew, who is called a chief of staff."},
 {t:"Negotiate. Strike page two.",roll:{stat:"K",pivot:75,
   win:{fx:{S:40,K:8,N:6,E:6,flag:"SECOND_TERM"},say:"Page two is struck. The chair says, afterwards, that he had not expected you to read it, which is the most useful thing a chair has ever told you about chairs."},
   lose:{fx:{K:-4,N:-8,E:-8,B:8,mod:"resignOffice",flag:"NOT_RENEWED"},say:"The board finds, on reflection, that it would prefer a fresh start. The fresh start is announced with warm words about your contribution, and the fresh start is the nephew."}}},
 {t:"Decline. One term was the job.",fx:{K:2,N:2,B:-14,E:-2,mod:"resignOffice",flag:"ONE_TERM"},say:"You leave with a portrait and a chair and a great deal of sleep. The next president undoes three things and keeps eleven, and you are surprised, and slightly hurt, by which three."}]},
{id:"Q20",ti:"The Chair Resigns",b:[3,4],ex:{base:.8,office:1.4},ga:{office:4},once:1,
 sc:"The board chair — your ally, the reason you were appointed — has resigned, for reasons involving a company and a newspaper. The vice-chair, who voted against you, is now the chair.",
 auto:{bad:1,fx:{K:-4,N:-8,B:8},say:"Your first meeting with the new chair is cordial. Cordial is the word boards use when the vote has already been scheduled."}},
{id:"Q21",ti:"The Strike",b:[3,4],ex:{base:.9,office:1.5},ga:{office:4},once:1,
 sc:"The faculty have voted to strike. Pay, mostly; also the Gulf, the classics, the coach, and a thing said at a retreat that has been quoted back to you eleven times. The pickets are polite and have signs with your name on them, spelled correctly.",
 ch:[
 {t:"Settle. Six percent and an apology.",fx:{K:4,N:6,S:-8,P:2,E:-6,flag:"SETTLED_STRIKE"},say:"The strike ends in nine days. The board is furious about the apology, which cost nothing, and calm about the six percent, which cost forty million. You have learned what boards count."},
 {t:"Hold. The budget is the budget.",fx:{K:6,N:-12,P:-8,B:12,foe:{why:"the strike",poisons:"search"},flag:"HELD_STRIKE"},say:"Seven weeks. Exams are cancelled. The board is delighted. The faculty are not, for a decade, and a decade is longer than a presidency."},
 {t:"Join the picket for an hour. Say you understand.",roll:{stat:"K",pivot:70,
   win:{fx:{K:5,N:8,P:6,E:4,flag:"PICKETED"},say:"An hour in the cold with a coffee and no coat. The photograph is extraordinary. The strike ends in a fortnight on terms the board would have given anyway, and the photograph is the reason nobody remembers that."},
   lose:{fx:{K:-6,N:-4,P:-6,E:-8},say:"An hour in the cold, and a photograph, and a caption that says “president joins picket against own policy,” and a board chair who sends the caption to you with no comment."}}}]},
{id:"Q22",ti:"Eleven Places",b:[3,4],ex:{base:.9,office:1.4},ga:{office:4},once:1,
 sc:"The university has dropped eleven places in a ranking that everyone agrees is meaningless and nobody has ever ignored. The board has the ranking on its agenda. The ranking has a methodology, and the methodology has a spreadsheet, and the spreadsheet can be gamed.",
 ch:[
 {t:"Game the spreadsheet. Hire a ranking consultant.",fx:{K:5,P:3,S:-3,E:-2,flag:"GAMED_RANKING"},say:"Fourteen places, up, in two years, for a fee. Nothing at the university has changed except a form. The board is delighted. A journalist, eventually, works out the form."},
 {t:"Explain to the board why the ranking is meaningless.",fx:{K:3,N:-6,E:3},say:"You are right, and the board agrees, and the ranking is on the agenda again next year, and the year after, and the board's agreement does not appear in the minutes."},
 {t:"Fix the two things in the methodology that are actually about students.",fx:{K:6,N:2,P:4,B:6,flag:"FIXED_TWO_THINGS"},say:"Four places, up, in three years, and the two things are better, and nobody can tell which caused which, which is exactly as it should be and exactly what the board cannot see."}]},
{id:"Q23",ti:"The Alumnus",b:[3,4],ex:{base:.9,office:1.4},ga:{office:4},once:1,
 sc:"An alumnus who made a great deal of money in something you could not explain would like to give a hundred and twenty million dollars. There is one condition. The condition is a school of something that does not currently exist and has, in the alumnus's description, no faculty, a mission, and his name.",
 ch:[
 {t:"Take it. Build the school.",fx:{S:8,K:6,N:8,P:-4,flag:"BUILT_SCHOOL"},say:"The school is built. It hires well, because it can, and does interesting work that has nothing to do with the mission, and the alumnus attends one event a year and is pleased, and the faculty senate passes a resolution that is noted."},
 {t:"Negotiate the name and the mission. Keep the money.",roll:{stat:"K",pivot:68,
   win:{fx:{S:8,K:9,N:6,P:3,flag:"NEGOTIATED_GIFT"},say:"The school has a mission written by a committee, and a name that includes his and does not stop there. He is, on balance, pleased. The money arrives. You have learned that a hundred and twenty million dollars is negotiable, which nobody had told you."},
   lose:{fx:{N:-6,K:-2,E:-4,S:-2},say:"He gives it to Calderon, with the name and the mission intact. Their school of the thing that did not exist is very fine, and you are invited to its opening, and go."}}},
 {t:"Decline. The university has a mission already.",fx:{K:2,N:-8,P:3,E:2},say:"The board's silence at the next meeting lasts a full minute. It is, you time it, the longest minute of your presidency. Calderon builds the school."}]},

/* ---------- things that happen ---------- */
{id:"X10",ti:"The Small Prize",b:[2,4],ex:{base:.5,highMom:1},ga:{papers:2},once:1,
 sc:"A prize you did not apply for, from a society you had forgotten belonging to, for a paper you had stopped thinking about. There is a cheque. There is a dinner. There is a plaque with a spelling error.",
 auto:{good:1,fx:{mom:8,E:5,N:3,S:2},say:"You keep the plaque. The spelling error becomes, over the years, the thing people who visit your office notice first, and the thing you tell them about, and it is a better story than the paper."}},
{id:"X11",ti:"The Verbal Offer",b:[1,2],ex:{base:.5},once:1,
 sc:"A verbal offer from Ostrander State, over the phone, on a Friday, with the word “formally” in it, followed by a Monday, and a Tuesday, and a Wednesday on which the chair explains, with real regret, about the dean and the line.",
 auto:{bad:1,fx:{E:-6,B:6,N:-2},say:"There was never a line. There was a chair who wanted there to be one, and a phone, and a Friday."}},
{id:"X12",ti:"The Absent Mentor",b:[1,1],ex:{base:.7},once:1,
 sc:"Your postdoc supervisor has been in the building four times this year. Each time he has been warm, brief, and on his way to an airport. The project you were hired for has been mentioned in none of the four.",
 ch:[
 {t:"Write to him. Ask for a meeting. Ask twice.",fx:{N:3,K:2,E:-2,B:2},say:"The meeting happens in an airport lounge, on his way, and is forty minutes long, and is the most useful forty minutes of the year, and you understand that this is how it will always be, and you start booking the lounge."},
 {t:"Do your own thing. He won't notice.",fx:{R:5,wip:20,N:-2,E:3,flag:"OWN_THING"},say:"He does not notice. Two years later your own thing is a paper and it has one name on it and he congratulates you at a conference as if he had planned it, and perhaps he had."}]},
{id:"X13",ti:"The Reorganisation",b:[3,4],ex:{base:.5,office:.4},once:1,
 sc:"The university has been reorganised into “schools,” which are the old faculties with new letterhead and one fewer dean. The economics department now reports to a dean of social and computational sciences who has a PhD in geography.",
 auto:{fx:{K:2,B:3},say:"The geographer is, it turns out, excellent, and has a budget model on a single sheet that you photograph when she leaves the room."}},
{id:"X14",ti:"Emerita",b:[3,4],ex:{base:.5},once:1,
 sc:"The person who taught you to write a referee report has retired. The party is in the common room. She gives a speech about the field that is four minutes long, contains one joke, and is the best account of what the job is that you have ever heard, and nobody records it.",
 auto:{good:1,fx:{E:-2,B:-3,N:2},say:"You write down the joke on the walk home. You get it slightly wrong. You tell it for twenty years, slightly wrong, and it is still the best joke you know."}}

,

/* ---------- batch 6: the referee's own paper, the grant, the presidency's follies, the classroom ---------- */
{id:"Y1",ti:"The Invitation to Referee",b:[1,4],ex:{base:1.1},ga:{anyflag:["BORROWED","STAR_COAUTHOR"]},once:1,
 sc:"An email from the Quarterly: would you referee the attached? You open the attachment. It is your paper — the one with two names on it, of which yours is second — and the editor, matching names to the manuscript, has matched only the first. There is a deadline of six weeks and a form for declaring conflicts of interest, which is optional.",
 ch:[
 {t:"Write a glowing report.",fx:{mom:10,N:4,E:5,cites:40,flag:"GLOWING_SELF"},say:"It takes an afternoon. You know the paper's weaknesses better than anyone alive and you describe none of them. It is accepted in four months, which is a record, and your coauthor says, at dinner, that for once the referees understood the paper, and you agree that it is rare."},
 {t:"Write to the editor, warmly, pointing out the mistake.",fx:{K:3,N:2,E:-1,flag:"HONEST_REF"},say:"Three lines, with a joke in the second. The editor replies in nine minutes with a word that is not quite an apology and is not quite a thank you. The paper goes to somebody else and takes a year longer. The editor, who has a very good memory, files the nine minutes somewhere."},
 {t:"Referee it straight, as if it were anyone's.",fx:{R:4,E:2,B:4,flag:"STRAIGHT_REF"},say:"Eleven problems, four of them real. It gets a revise and resubmit. For a year your coauthor is furious with the anonymous referee in your presence, and you help him draft the response, which is the strangest document you will ever co-write."}]},

{id:"Y2G",ti:"The Very Good Memory",b:[2,4],ex:{base:1},ga:{flag:"GLOWING_SELF"},once:1,
 sc:"A conference bar, years on. Somebody who was on the Quarterly's board at the time says, not to you but audibly, that the most enthusiastic report the journal ever received was on a paper by the referee. The story is told well. Two people at the table look at you. One of them is on your next committee.",
 ch:[
 {t:"Laugh. It is, after all, a good story.",roll:{stat:"N",pivot:60,
   win:{fx:{E:2,N:2},say:"It stays a story. It is told at that bar for years and you are never quite named in it, and the not-naming is a courtesy that you will spend the rest of your career repaying, without anyone saying so."},
   lose:{fx:{N:-12,P:-6,E:-10,mom:-8,foe:{why:"the report you wrote on your own paper, which they were told about",poisons:"committee"},flag:"EXPOSED_REPORT"},say:"The story acquires your name by Thursday. The editor writes to the board, the board writes to nobody, and nothing formal happens, which is worse: for the rest of your career there is a sentence people say about you after you leave the room, and you know the sentence."}}},
 {t:"Leave the bar.",fx:{E:-4,B:4,N:-3},say:"You leave. It is noticed. The story is told once more, to your empty chair, and the chair does not defend itself."}]},

{id:"Y2H",ti:"A Very Good Memory, the Other Way",b:[2,4],ex:{base:1},ga:{flag:"HONEST_REF"},once:1,
 sc:"The editor of the Quarterly, retiring, gives a dinner. You are invited, which is unexpected, and seated near the top, which is more so. In the speech, without naming you, he describes the referee who wrote back in three lines with a joke in the second.",
 auto:{good:1,fx:{N:8,mom:6,K:3},say:"Nobody at the table knows it was you except him. Then a woman on the board leans over and says, “It was you, wasn't it.” It was. Her journal is looking for an associate editor, and the field, for the next decade, is slightly more open to you than it was."}},

{id:"Y3",ti:"Submission 002342",b:[1,4],ex:{base:.8},once:1,
 sc:"A letter from the National Research Council: the proposal is funded, in full, for three years. You take the department out. You tell your mother. On the Thursday a second letter, in a smaller envelope, explains that owing to a clerical error the award was made to submission 002341, and that yours, 002342, was not successful, and that the Council regrets any inconvenience.",
 ch:[
 {t:"Accept the loss.",fx:{E:-5,B:3,R:1},say:"You write back thanking them for the clarification, which is the most dignified sentence you will write that year and also the most expensive. Submission 002341 is on a subject you have never heard of. You look it up. It is good."},
 {t:"Threaten to sue.",roll:{stat:"K",pivot:55,
   win:{fx:{R:6,wip:30,N:-3,S:4,flag:"LITIGIOUS"},say:"A letter from a lawyer who is your cousin, on paper that cost more than the advice. The Council caves in nine days and funds both, from a reserve nobody knew existed. Three years of money. And, from that week on, a sentence attached to your name in the corridors of every funding body in the country."},
   lose:{fx:{N:-7,E:-3,B:5,flag:"LITIGIOUS"},say:"The Council's counsel replies in one paragraph, the second sentence of which is about the terms and conditions you ticked. You do not sue. But the letter exists, and the Council's reviewers are your colleagues, and the word for you, from that week, is a word you will not be told."}}}]},

{id:"Y4",ti:"The Word for You",b:[1,4],ex:{base:.7},ga:{flag:"LITIGIOUS"},
 sc:"In a conversation about salary, the dean mentions, lightly, apropos of nothing, that he has heard you “know some lawyers.” He is smiling. It is not clear what the smile is for.",
 alt:["A search committee chair calls, for the reference-checking stage, and asks, after the usual questions, whether the “thing with the Council” was ever “resolved.” You explain. The explanation is longer than the question.",
      "A junior colleague, being pushed around by the same Council over a smaller grant, asks you, quietly, whether the threat “worked.” Half the department is listening to a conversation that is not happening."],
 ch:[
 {t:"Let the story do its work.",roll:{stat:"coin",
   win:{fx:{S:10,K:3,E:3},say:"It works. The number moves before you have finished the sentence, and the sentence was not about lawyers. You have become someone it is easier to give things to than to argue with, which is a kind of power, and a kind of reputation, and they are the same kind."},
   lose:{fx:{N:-6,P:-3,foe:{why:"the story about the grant council, which they believed in full",poisons:"search"}},say:"It works against you. The conversation ends pleasantly and, some way down the line, a shortlist is drawn up without you on it, by someone who would rather not be sued."}}},
 {t:"Correct it, patiently, again.",fx:{K:2,B:3,E:-2},say:"You explain it, again. The explanation is true, and it is dull, and it does not travel. The story does."}]},

{id:"Y5",ti:"The Statue",b:[3,4],ex:{base:1.2,office:2},ga:{office:4},once:1,
 sc:"Four hundred students on the quad, around the bronze of Josiah Harrowgate, second benefactor, whose plaque says he made his money in “trade.” The trade was in people. The students know this; the trustees know this; the plaque has known it since 1911. The students have a banner and a spokesperson, and the spokesperson has a lawyer's phrasing and a historian's footnotes.",
 ch:[
 {t:"Take it down tonight, with a crane.",fx:{P:8,N:-6,K:-3,S:-6,flag:"STATUE_DOWN"},say:"It is gone by six. The photograph of the empty plinth is on every front page and the alumni magazine runs it, cropped, with a letter from the chair of the board, who was not consulted. The students cheer for a night. Two donors write. One of them writes to a lawyer."},
 {t:"Add a plaque. Convene a committee on the Harrowgate legacy.",fx:{K:5,B:4,P:-2,flag:"STATUE_PLAQUE"},say:"The committee has eleven members, a historian, and a mandate to report. The plaque, in the meantime, says “contested.” The students are not fooled and are also, term by term, graduating, which is the thing the committee understands about time."},
 {t:"Defend it. History is history.",fx:{E:5,N:4,P:-6,flag:"STATUE_KEPT"},say:"You say a sentence about not erasing the past. It is a sentence four hundred students have been waiting for you to say, and they say it back, at volume, for a month. The trustees send a note of support. It is the warmest note you will receive from them, and you will read it, later, with some care."}]},

{id:"Y6A",ti:"The Empty Plinth",b:[3,4],ex:{base:1},ga:{flag:"STATUE_DOWN"},once:1,
 sc:"A television crew on the quad, in front of the plinth, and a national columnist who has never been to the college and has strong views about it. The board meets on Friday. Three alumni, one of them the name on the science building, have asked for “a conversation.”",
 ch:[
 {t:"Give the interview yourself.",roll:{stat:"P",pivot:55,
   win:{fx:{P:10,N:3,K:3},say:"Four minutes. You say one thing that is true and one thing that is quotable, and they are the same thing. The columnist writes a second column, softer. The name on the science building stays on the science building."},
   lose:{fx:{P:-8,K:-5,N:-6,B:6},say:"Four minutes. You say one sentence that is accurate and sounds appalling in a caption. The name on the science building asks for the name to be removed, from the building, and a lawyer explains that this is more complicated than putting it on."}}},
 {t:"Let the board chair speak for the college.",fx:{K:4,P:-4,N:2},say:"He speaks for the college. He speaks for eleven minutes, mostly about process. The crew leaves early. The story dies of boredom, which is what boards are for, and the students, watching, understand exactly what they have been handed."}]},

{id:"Y6B",ti:"The Committee Convenes",b:[3,4],ex:{base:1},ga:{flag:"STATUE_PLAQUE"},once:1,
 sc:"A local station films the first meeting of the Harrowgate Legacy Committee, which has been scheduled, by someone, in a room with the Harrowgate portrait in it.",
 auto:{bad:1,fx:{P:-4,K:2,B:2},say:"The committee reports in fourteen months. The report recommends a further committee, with a broader remit, and a “campus conversation.” The statue is still there. The students who started it have graduated, and one of them is a journalist now, and she has your number."}},

{id:"Y6C",ti:"The Sentence",b:[3,4],ex:{base:1},ga:{flag:"STATUE_KEPT"},once:1,
 sc:"The protest has doubled and acquired a television crew and a tent. Your sentence about not erasing the past is on a banner, in your own font, above a picture of the plaque. A student journalist has found the shipping manifests. They are specific.",
 ch:[
 {t:"Say it again, better, on camera.",roll:{stat:"P",pivot:62,
   win:{fx:{P:6,E:4,N:3},say:"You say it better. You say something about teaching the past rather than removing it, and you announce a course, and the course is real, and it fills. The tent comes down in the rain. The trustees are delighted with you and will remain so for a year."},
   lose:{fx:{P:-10,K:-5,N:-4,B:8,flag:"STATUE_HEADLINE"},say:"You say it again and it is worse. A headline uses four of your words and one of theirs. The tent stays for the term. A donor who has never previously expressed a view on anything expresses one, and it is about you."}}},
 {t:"Take it down after all, quietly, in the summer.",fx:{P:-3,K:-4,E:-6,N:-2},say:"The crane comes in July. Nobody is on the quad to see it and everybody knows. You have managed to be blamed by both sides, in sequence, which is a genuine administrative achievement and is not the one you were aiming for."}]},

{id:"Y7",ti:"The Quad",b:[3,4],ex:{base:1,office:1.6},ga:{office:4},once:1,
 sc:"There is money — a bequest, unrestricted, from a woman who loved the gardens — and there is the quad, which has been a lawn with a path across it since 1911. Presidents redesign the quad. It is the one thing they do that is still there afterwards, and everybody who has ever held the office has understood this, and so has the grounds department.",
 ch:[
 {t:"A maze. Yew. Nine feet high.",fx:{E:6,P:5,K:-2,B:-4,flag:"MAZE"},say:"The hedges take nine years to reach nine feet and the grounds department takes it personally. A student is lost in it, briefly, and writes about it, well. It is the most photographed thing on campus within a decade, and nobody who photographs it knows your name, which is roughly what a legacy is."},
 {t:"A great lawn by a very famous landscape architect.",fx:{K:4,N:5,B:3,P:2},say:"The architect's fee is a number you say aloud only once. The lawn is magnificent and is not to be walked on, and there is a sign. Every prospectus for thirty years has the lawn on the cover, and the students, in the photograph, are standing carefully on the path."},
 {t:"Leave it. Plant one tree.",fx:{K:3,E:-2,B:-3},say:"An oak, near the path. The grounds department is moved, and says so. The bequest goes to scholarships, which nobody photographs. The tree will be taller than the chapel in eighty years, and by then it will simply be the tree, which is the best thing a tree can be."}]},

{id:"Y8",ti:"The Department Library",b:[0,2],ex:{base:.7},once:1,
 sc:"There is a room on the fourth floor with a door nobody uses and, behind it, the department's library, which stopped acquiring in 1974. On the third shelf, between a run of the Economic Journal and a book on rent control, is a first edition of Edgeworth's <em>Mathematical Psychics</em>, 1881, uncut, with a bookplate. Nobody has opened it. Nobody, on the evidence of the dust, has opened the door.",
 ch:[
 {t:"Leave it where it is.",fx:{K:2,E:-1,flag:"EDGEWORTH_LEFT"},say:"You put it back exactly. You think about it on the stairs. You think about it, on and off, for the rest of your career, which is the only thing Edgeworth ever managed to do to anyone."},
 {t:"Take it home. Make sure it gets a better home.",fx:{E:5,R:2,B:-2,flag:"EDGEWORTH_HOME"},say:"It sits on your shelf, at home, where the light is right. You read it, which is more than the department did in fifty years. You have not stolen it; you have rescued it; the two words will change places, quietly, on the day you become somebody."},
 {t:"Tell the librarian. Have it catalogued.",fx:{N:3,K:2,flag:"EDGEWORTH_CAT"},say:"It is catalogued, valued, insured, and moved to Special Collections, where it is stolen within the year by somebody who read the catalogue. The librarian writes you a thank-you note first."}]},

{id:"Y9",ti:"The Monument",b:[3,4],ex:{base:.9,office:1.4},ga:{office:4,noflag:"EDGEWORTH_HOME"},once:1,
 sc:"You propose, at a meeting of the board, a monument to Francis Ysidro Edgeworth: economist, statistician, a man who called a book <em>Mathematical Psychics</em> and meant it. The board asks, with respect, whether he attended the college. He did not. They ask whether he gave to the college. He did not. They ask who he was.",
 ch:[
 {t:"A bronze. Twelve feet. In the quad.",fx:{E:8,P:4,N:-4,K:-3},say:"It is cast. The students assume he is a benefactor and protest him within the year, for reasons nobody can specify, and the plaque, which explains indifference curves, does not help. It is a very good bronze. You visit it, occasionally, at night."},
 {t:"A bench, with the contract curve cut into the back.",fx:{E:3,K:2,P:1,B:-2},say:"The bench is by the path. The curve is exactly right and nobody notices it for a decade, until a graduate student does, and posts a photograph, and for a week the bench is famous among about four hundred people, all of whom you would have liked to meet."},
 {t:"A lecture. Annual. The first one by you.",fx:{P:5,E:4,N:3,B:3},say:"The Edgeworth Lecture. You give the first, on Edgeworth, and it is good. The second is given by a laureate on his own work, with Edgeworth in the title, and by the fifth nobody says the name aloud except the person introducing it."}]},

{id:"Y9H",ti:"The Monument",b:[3,4],ex:{base:.9,office:1.4},ga:{office:4,flag:"EDGEWORTH_HOME"},once:1,
 sc:"You propose, at a meeting of the board, a monument to Francis Ysidro Edgeworth: economist, statistician, a man who called a book <em>Mathematical Psychics</em> and meant it. A first edition of that book is on a shelf in your house, where the light is right, and has been for decades, and you have never quite been able to say how it got there. The board asks who he was.",
 ch:[
 {t:"A bronze. Twelve feet. The plaque to quote the first edition.",fx:{E:9,P:4,N:-4,K:-3,flag:"EDGEWORTH_PLAQUE"},say:"The plaque says “from a copy in the President's own collection.” You wrote that line yourself, and read it, on the day of the unveiling, with a feeling you would not describe to anyone. The students protest the bronze within the year. The book stays where it is."},
 {t:"A bench, with the contract curve cut into the back.",fx:{E:3,K:2,P:1,B:-2},say:"The bench is by the path. You check the curve against the book, at home, the night before the stonemason begins. It is exactly right. The book goes back on the shelf, and the bench goes by the path, and the two things are, as far as anyone will ever know, unconnected."},
 {t:"Give the book back, and propose nothing.",fx:{E:-4,K:4,N:2,B:-3,flag:"EDGEWORTH_RETURNED"},say:"You give it to Special Collections with a letter that uses the word “deposit.” The librarian, who is young, is thrilled, and asks where it has been. You say “safe.” This is true. It is also the last word on the subject, and it is not quite the word you would have chosen."}]},

{id:"Y10",ti:"The Lecture",b:[2,4],ex:{base:.3,tdebt:3.2},ga:{tdebt:8},
 sc:"You have not changed the slides since the year they were made, and the room knows it: someone has put that year's deck beside this year's on a website, with the differences highlighted, and there are none. In week six you teach the wrong lecture for twenty-five minutes before a student, kindly, says so. The evaluations arrive in a thick envelope. The chair has a copy.",
 alt:["Again. This time it is a graduate class, and it is the proof that goes wrong, on the board, for forty minutes, in front of people who can see it going wrong before you can. The evaluations use the word “unprepared” eleven times, and one of them uses it correctly."],
 ch:[
 {t:"Apologise. Rebuild the course over the summer.",fx:{B:8,R:-3,K:3,mod:"teachfix"},say:"A summer. It costs a paper and it is, in the end, a good course, and the students in it will never know what it replaced, and the chair will, and says nothing, which from a chair is a compliment."},
 {t:"Blame the room, the software, and the cohort.",fx:{E:4,P:-4,N:-5,foe:{why:"the email about the cohort, which was forwarded to the cohort",poisons:"vote"}},say:"The email is forwarded within the hour. It reaches the students, then the chair, then a colleague who teaches the same cohort well and is now, for reasons you have supplied, your enemy."},
 {t:"Say nothing. It is a lecture.",fx:{E:2,K:-3,N:-3,flag:"CLASSROOM"},say:"You say nothing. The evaluations go up the chain unaccompanied, which is worse than any explanation, and somewhere in the dean's office a file that did not exist acquires a first page."}]},

{id:"Y11",ti:"The Dean's Letter",b:[2,4],ex:{base:1},ga:{flag:"CLASSROOM"},once:1,
 sc:"A letter, on paper, from {dean}. It uses the phrase “pattern of concern” and the phrase “teaching load” in the same sentence, and it is copied to the chair.",
 auto:{bad:1,fx:{K:-4,N:-4,mom:-5,S:-3},say:"The letter is in the file. The file will be on the table at the next thing that matters, and it will be read aloud by someone who has been waiting to read it aloud. Your teaching load, in the meantime, goes up, which is the department's idea of a joke and also its idea of a remedy."}}

];

/* ============================================================
   STORYLINES — linear, stepped, remembered
   The first step is drawn like any event; later steps are never drawn at
   random, only scheduled. A step whose branch flag was not set is skipped;
   a step whose rank band or stat gate is not yet met waits.
   ============================================================ */
const ARCS=[
 {id:"advisor",    steps:["P1","P11","G6"],           gap:[3,6]},
 {id:"selfref",    steps:["Y1","Y2G","Y2H"],          gap:[10,16]},
 {id:"statue",     steps:["Y5","Y6A","Y6B","Y6C"],    gap:[2,4]},
 {id:"lecture",    steps:["Y10","Y11"],               gap:[2,4]},
 {id:"frobenius",  steps:["P8","A11","G21"],          gap:[6,10]},
 {id:"blunt",      steps:["D5","N16"],                gap:[20,30]},
 {id:"sorokina",   steps:["P10","G10"],               gap:[30,40]},
 {id:"lemma",      steps:["P7","G12"],                gap:[6,10]},
 {id:"replaced",   steps:["P9","G13"],                gap:[6,9]},
 {id:"student",    steps:["A10","S7"],                gap:[16,22]},
 {id:"applicants", steps:["A15","A16","A17"],         gap:[8,11]},
 {id:"hungarian",  steps:["G14","G15","G16"],         gap:[6,10]},
 {id:"idea",       steps:["N11","N12","N13"],         gap:[12,16]},
 {id:"spec",       steps:["P6","N6"],                 gap:[14,22]},
 {id:"cartel",     steps:["A6","K9"],                 gap:[10,16]},
 {id:"referee",    steps:["R1","K10"],                gap:[6,12]},
 {id:"coeditor",   steps:["N7","E1","E2","E3","E4"],  gap:[3,6]},
 {id:"lisbon",     steps:["G17","G18"],               gap:[5,8]},
 {id:"adults",     steps:["G19","G20"],               gap:[6,14]},
 {id:"spreadsheet",steps:["G24","G25"],               gap:[6,8]},
 {id:"hand",       steps:["G26","G27"],               gap:[8,10]},
 {id:"breach",     steps:["C5","C6"],                 gap:[4,7]},
 {id:"mostcited",  steps:["C7","C8"],                 gap:[6,8]},
 {id:"centralbank",steps:["F5","F6"],                 gap:[6,8]},
 {id:"star",       steps:["Q3","Q4"],                 gap:[8,9]},
 {id:"fund",       steps:["Q5","Q6"],                 gap:[8,9]},
 {id:"gulf",       steps:["Q7","Q8"],                 gap:[8,9]},
 {id:"hr",         steps:["Q14","Q15"],               gap:[6,7]},
 {id:"genius",     steps:["Q16","Q17","Q18"],         gap:[8,9]}
];
const ARC_STEP=new Set(); const ARC_START={};
for(const a of ARCS){ ARC_START[a.steps[0]]=ARC_START[a.steps[0]]||[]; ARC_START[a.steps[0]].push(a); for(const id of a.steps.slice(1)) ARC_STEP.add(id); }
/* timing is the arc's job now, so a step's `since` gate becomes a plain flag gate */
for(const e of EVENTS){ if(ARC_STEP.has(e.id)&&e.ga&&e.ga.since){ e.ga.flag=e.ga.since[0]; delete e.ga.since; } }
const byId=id=>EVENTS.find(e=>e.id===id);
function branchDead(e){
 const ga=e.ga||{}; const need=[].concat(ga.flag||[],ga.flags||[]);
 if(need.some(f=>!g.flags[f])) return true;
 if(ga.anyflag&&!ga.anyflag.some(f=>g.flags[f])) return true;
 return false;
}
function stepReady(e){ return g.rank>=e.b[0]&&g.rank<=e.b[1]&&gateOK(e.ga)&&!(e.once&&g.seen[e.id]); }
function startArcs(e){
 for(const a of (ARC_START[e.id]||[])) if(!g.arcs[a.id]&&!g.arcsDone[a.id]) g.arcs[a.id]={step:1,next:g.turn+ri(a.gap[0],a.gap[1])};
}
function dueArcStep(){
 const open=Object.keys(g.arcs).sort(()=>Math.random()-0.5);
 for(const id of open){
  const a=ARCS.find(x=>x.id===id), st=g.arcs[id];
  if(st.next>g.turn) continue;
  while(st.step<a.steps.length){
   const e=byId(a.steps[st.step]);
   if(!e){ st.step++; continue; }
   if(branchDead(e)){ st.step++; continue; }     /* that branch was not taken */
   if(!stepReady(e)) break;                       /* not yet — wait */
   st.step++; st.next=g.turn+ri(a.gap[0],a.gap[1]);
   if(st.step>=a.steps.length){ delete g.arcs[id]; g.arcsDone[id]=1; }
   return e;
  }
  if(st.step>=a.steps.length){ delete g.arcs[id]; g.arcsDone[id]=1; }
 }
 return null;
}

   PAPERS
   ============================================================ */
function makePaper(){
 g.usedTitles=g.usedTitles||{};
 const avail=TITLES.map((x,i)=>i).filter(i=>!g.usedTitles[i]);
 if(avail.length){ const i=pick(avail); g.usedTitles[i]=1; return {ti:TITLES[i][0], f:TITLES[i][1]}; }
 return {ti:pick(T1)+" "+pick(T2)+pick(T3), f:pick(FIELDS)};
}
function journalFor(tier,f){
 if(tier==="A"&&FIELD_JOURNALS[f]&&Math.random()<0.6) return FIELD_JOURNALS[f];
 return pick(JOURNALS[tier].n);
}

const TIER_OFF={"A+":1.6,"A":0.6,"B":-0.4,"C":-1.5};
function accProb(q,tier){
 let z=-1.9+3.0*q/100+0.9*g.N/100+1.1*prestige()+0.5*g.M/100;
 if(g.flags.CARTEL)z+=0.35;
 z-=0.2*foesOf("referee");
 return sig(z-TIER_OFF[tier]);
}
function submitPaper(o){
 o=o||{};
 const q= o.q0!==undefined ? o.q0 : clamp(g.R*0.72+ri(-14,14)+(g.mods.bigpaper?18:0)+(o.q||0), 5, 100);
 let z=-1.9+3.0*q/100+0.9*g.N/100+1.1*prestige()+0.5*g.M/100+(o.bias||0);
 if(g.flags.CARTEL)z+=0.35;
 z-=0.2*foesOf("referee");
 const r=Math.random();
 const tier = o.tier || o.target || (r<sig(z)-0.42 ? "A+" : r<sig(z)+0.06 ? "A" : r<sig(z)+0.52 ? "B" : "C");
 const lag = o.lag ? ri(o.lag[0],o.lag[1]) : tier==="A+"? ri(5,9) : tier==="A"? ri(4,7) : ri(2,5);
 const pp=o.pp||g.nextPaper||makePaper(); g.nextPaper=null; if(o.f) pp.f=o.f;
 g.queue.push({ti:pp.ti, f:pp.f, tier, jn:o.jn||journalFor(tier,pp.f), q, due:g.turn+lag, rounds:o.rounds===undefined?0:o.rounds, bonusCites:o.cites||0,
  pAcc:o.target?accProb(q,tier):undefined, vain:!!o.vain});
 line("info","✉ Submitted: “"+g.queue[g.queue.length-1].ti+"” — out for review.");
 if(g.mods.bigpaper) delete g.mods.bigpaper;
}

function reviewPass(){
 const out=[];
 for(const s of g.queue.slice()){
  if(s.due>g.turn) continue;
  if(s.pAcc!==undefined && Math.random()>s.pAcc){
   /* aimed at a tier, and rejected: down one, out again */
   const was=s.jn, nt={"A+":"A","A":"B","B":"C","C":"C"}[s.tier];
   if(s.tier==="C"){ s.pAcc=undefined; s.due=g.turn+ri(1,2); line("bad","\u2717 Rejected at "+was+". It goes to the next one down the list, which has no list."); continue; }
   s.tier=nt; s.jn=journalFor(nt,s.f); s.pAcc=accProb(s.q,nt); s.due=g.turn+ri(2,4); s.rounds=1;
   g.E=clamp(g.E-2,0,100);
   if(s.vain){ s.vain=false; g.B=clamp(g.B+4,0,100); g.E=clamp(g.E-3,0,100);
    line("bad","\u2717 Rejected at "+was+": \u201c"+s.ti+"\u201d, which was where it belonged. You take it personally. It goes to "+s.jn+"."); }
   else line("bad","\u2717 Rejected at "+was+": \u201c"+s.ti+"\u201d goes out again, to "+s.jn+".");
   continue;
  }
  if(s.rounds<1 && Math.random()<0.45){
   s.rounds++; s.due=g.turn+ri(2,4);
   line("info","↻ R&R at "+s.jn+": three referees, one of whom wants a different paper.");
   continue;
  }
  out.push(publishPaper(s));
 }
 return out;
}
/* a paper leaves the queue and enters the record — now, not next term */
function publishPaper(s){
 g.queue.splice(g.queue.indexOf(s),1);
 const jn=s.jn||pick(JOURNALS[s.tier].n);
 g.papers.unshift({ti:s.ti,f:s.f,jn,tier:s.tier,q:s.q,c:s.bonusCites||0,pub:g.turn,yr:Math.floor(g.turn/2)+1});
 g.fields=g.fields||{}; if(s.f) g.fields[s.f]=(g.fields[s.f]||0)+1;
 g.cites=g.papers.reduce((a,p)=>a+p.c,0);
 if(s.tier==="A+"){ g.M=clamp(g.M+16,0,100); g.E=clamp(g.E+7,0,100); }
 else if(s.tier==="A"){ g.M=clamp(g.M+6,0,100); g.E=clamp(g.E+3,0,100); }
 else if(s.tier==="C"){ g.E=clamp(g.E-2,0,100); }
 return g.papers[0];
}

function citationPass(){
 const matthew = 0.42 + g.N/260 + g.P/320 + g.M/210 + prestige()*0.46 + (g.flags.CARTEL?0.18:0) + (g.flags.EDITOR?0.10:0);
 let gained=0;
 for(const p of g.papers){
  const a=g.turn-p.pub;
  const decay = a<2 ? 0.55 : a<20 ? 1 : Math.max(0.22, 1-(a-20)*0.045);
  const inc = JOURNALS[p.tier].w * (0.32+0.68*p.q/100) * matthew * decay * (0.65+Math.random()*0.7);
  p.c+=inc; gained+=inc;

}

function passivePass(){

 g.K=clamp(g.K-g.K*0.010,0,100);
 g.N=clamp(g.N-g.N*0.013,0,100);

  f.since=f.since||g.turn;
  if(g.turn-f.since>=6 && Math.random()<0.05){
   g.enemies.splice(g.enemies.indexOf(f),1);

 }

 /* salary creep */
 g.S+=0.35+prestige()*0.5+g.office*0.6;
}

function terms(){
 return {
  base:1,
  lowMom:1-g.M/100, highMom:g.M/100,
  highR:g.R/100, highK:g.K/100, highP:g.P/100, highB:g.B/100,
  lowS:clamp((45-g.S)/45,0,1),
  tdebt:clamp(g.tdebt/10,0,1),
  spec:g.flags.SPEC?1:0,
  office:g.office?1:0,
  highE:g.E/100
 };
}
function gateOK(ga){
 if(!ga) return true;
 if(ga.R&&g.R<ga.R) return false;
 if(ga.K&&g.K<ga.K) return false;
 if(ga.N&&g.N<ga.N) return false;
 if(ga.P&&g.P<ga.P) return false;
 if(ga.E&&g.E<ga.E) return false;
 if(ga.flag&&!g.flags[ga.flag]) return false;
 if(ga.flags){ for(const f of ga.flags) if(!g.flags[f]) return false; }
 if(ga.anyflag&&!ga.anyflag.some(f=>g.flags[f])) return false;
 if(ga.noflag&&g.flags[ga.noflag]) return false;
 if(ga.tdebt&&g.tdebt<ga.tdebt) return false;
 if(ga.field&&!(g.fields&&g.fields[ga.field])) return false;
 if(ga.queue&&g.queue.length<ga.queue) return false;
 if(ga.h&&hIndex()<ga.h) return false;
 if(ga.cites&&g.cites<ga.cites) return false;
 if(ga.papers&&g.papers.length<ga.papers) return false;
 if(ga.office&&g.office<ga.office) return false;
 if(ga.tenured&&!g.tenured) return false;
 if(ga.since){ const [f,n]=ga.since; const t=g.flags[f]; if(!t) return false; if(g.turn-(t-1)<n) return false; }
 return true;
}
function drawEvent(){
 const t=terms(), pool=[];
 for(const e of EVENTS){
  if(g.rank<e.b[0]||g.rank>e.b[1]) continue;
  if(e.once&&g.seen[e.id]) continue;
  if(ARC_STEP.has(e.id)) continue;
  if(!gateOK(e.ga)) continue;
  let s=g.jit[e.id]||0;
  for(const k in e.ex) s+=e.ex[k]*(t[k]||0);
  if(e.tr){
   if(g.vow==="BOTH") s+=0.25;
   else if((e.tr==="nobel"&&g.vow==="NOBEL")||(e.tr==="pres"&&g.vow==="PRES")) s+=0.85;
   else s-=1.1;
  }
  if(e.once) s+=0.3;

  s-=1.4*Math.log(1+(g.seen[e.id]||0));
  pool.push([e,Math.exp(s)]);
 }
 const quiet=Math.E*0.9, total=quiet+pool.reduce((a,p)=>a+p[1],0);
 let r=Math.random()*total;
 if(r<quiet) return null;
 r-=quiet;
 for(const[e,w] of pool){ r-=w; if(r<=0) return e; }
 return null;
}

/* ============================================================
   ROLLS  (Ego = mean shift + tail risk)
   ============================================================ */
function rollP(roll){
 if(roll.stat==="coin") return 0.5;
 const base = roll.stat==="R"?g.R : roll.stat==="K"?g.K : roll.stat==="N"?g.N :
              roll.stat==="P"?g.P : roll.stat==="E"?g.E : 50;
 const egoShift = roll.stat==="E" ? 0 : 0.28*(g.E-50);
 return sig((base-(roll.pivot||50)+egoShift)/14);
}
function applyLoss(fx){
 const mult=1+g.E/120;
 const out={};
 for(const k in fx) out[k]=(typeof fx[k]==="number"&&fx[k]<0)? fx[k]*mult : fx[k];
 applyFx(out);
 if(Math.random()<g.E/200) addFoe();
}
function applyFx(fx){
 if(!fx) return;
 for(const k of ["R","K","N","P"]) if(fx[k]){
  const d = fx[k]>0 ? fx[k]*(1-g[k]/105) : fx[k];
  g[k]=clamp(g[k]+d,0,100);
 }
 for(const k of ["E","B"]) if(fx[k]) g[k]=clamp(g[k]+fx[k],0,100);
 if(fx.S) g.S=Math.max(0,g.S+fx.S);
 if(fx.wip) g.wip+=fx.wip;
 if(fx.mom) g.M=clamp(g.M+fx.mom,0,100);
 if(fx.cites&&g.papers.length){ const p=pick(g.papers); p.c+=fx.cites; g.cites=g.papers.reduce((a,q)=>a+q.c,0); }
 if(fx.flag) g.flags[fx.flag]=g.turn+1;   /* stamped, so later events can ask how long ago */
 if(fx.mod){
  if(fx.mod==="resignOffice") g.office=0;
  else if(fx.mod==="nobelDead") g.nobelDead=true;
  else if(fx.mod==="publish"){
   const q=g.queue.slice().sort((a,b)=>a.due-b.due)[0];
   if(q){ q.rounds=9; const p=publishPaper(q); pubCard([p]); }
  }
  else if(["accept","reject","resubmit","delay"].includes(fx.mod)){
   /* these act on the paper that has been under review longest */
   const q=g.queue.slice().sort((a,b)=>a.due-b.due)[0];
   if(q){
    q.pAcc=undefined;   /* the event has decided; no separate rejection roll */
    if(fx.mod==="accept"){ q.due=g.turn+1; q.rounds=9; }
    else if(fx.mod==="reject"){ g.queue.splice(g.queue.indexOf(q),1); g.wip+=45; line("bad","\u2717 \u201c"+q.ti+"\u201d is back in the drawer."); }
    else if(fx.mod==="resubmit"){ const t=["A+","A","B","C"]; q.tier=t[Math.min(3,t.indexOf(q.tier)+1)]; q.jn=journalFor(q.tier,q.f); q.due=g.turn+ri(2,4); q.rounds=9; line("info","\u2192 \u201c"+q.ti+"\u201d goes to "+q.jn+"."); }
    else if(fx.mod==="delay"){ q.due+=ri(2,4); q.rounds=9; }
   }
  }
  else if(fx.mod==="toCranmoor"){ g.postdocEnd=null; startClock("CRANMOOR",6); }
  else g.mods[fx.mod]=1;
 }
 if(fx.tax){ g.taxes=g.taxes||[]; g.taxes.push(g.turn+fx.tax); }
 if(fx.submit){ for(const o of [].concat(fx.submit)) submitPaper(o); }
 if(fx.appoint){ g.office=4; g.uni=fx.appoint; g.won.PRESALT=fx.appoint; g.presSince=g.turn; g.mods.searchcool=g.turn+8; }
 if(fx.clearFoe){ const i=g.enemies.findIndex(f=>f.poisons===fx.clearFoe); if(i>=0){ const f=g.enemies.splice(i,1)[0]; line("good","\u2694 "+f.who+" is no longer a problem."); } }
 if(fx.foe) addFoe(fx.foe);
 if(fx.ending) end(fx.ending);
}

 if(named.length) note = named.map(f=>"<b>"+f.who+"</b> votes no — "+f.why+".").join("<br>");
 const letter = g.vow==="PRES"||g.K>g.R
  ? "The letter says: <em>“a genuine institutional citizen. We will miss the polish in the published record, but this is someone who knows how to run a meeting, and a department is a great many meetings.”</em>"
  : "The letter says: <em>“the service record is thin and the collegiality has been described to us as situational. But one of these papers will still be read in thirty years, and we are not in the business of being wrong about that twice.”</em>";

 card({
  append:true, cls: pass?"gold":"grim", kicker:"THE VOTE", ti: pass?"Tenure":"Denied",
  sc:"Twelve of them, in a room you are not in, for two hours and ten minutes."
    +'<div class="tally">'+votes.map(v=>'<div class="vote '+(v?"yes":"no")+'">'+(v?"✓":"✗")+'</div>').join("")+'</div>'
    +'<div class="votenote">'+yes+" for, "+(seats-yes)+" against."+(note?"<br>"+note:"")+"</div><br>"+letter,
  ch:[{t: pass?"Take the letter home.":"Ask what the timeline is.", fn(){
    if(pass){
     g.tenured=true; g.clock=null; g.rank=3; g.S+=18; g.E=clamp(g.E+10,0,100);
     g.flags.TENURED=1;
     return "You are here until you decide not to be. It is the single largest change in your life and it feels, on the day, like a slightly quieter Tuesday.";
    }
    g.denials++; g.clock=null;
    return denialCascade();
  }}]
 });
}
function denialCascade(){
 if(g.denials===1){
  const dest=pick(LOW.concat(MID.slice(2)));
  const yrs=4;
  g.nobelDead=true;
  g.uni=dest; g.rank=2; g.clockLen=yrs; g.clock=yrs*2;
  g.N=clamp(g.N-12,0,100); g.E=clamp(g.E-14,0,100); g.B=clamp(g.B+16,0,100);
  g.S=Math.max(30, g.S*0.78);
  g.flags.DENIED_ONCE=1;
  return "You have a year to clear the office. Then "+UNIS[dest].n+" calls — they have a line, they need someone with your record, and the clock there is "
   +yrs+" years, not seven, because they have been burned before. The Nobel is now, in the technical sense, unavailable. Nobody says this out loud. Everybody understands it.";
 }
 /* second denial */
 g.presDead=false;
 if(g.K>=42){
  g.rank=3; g.tenured=true; g.office=1; g.uni=pick(MID);
  g.S=Math.max(g.S, 96); g.flags.ADMIN_ESCAPE=1; g.nobelDead=true;
  return "The second vote goes the same way as the first. Then something unexpected: "+UNIS[g.uni].n+" needs an associate dean who understands a budget model, and you have understood a budget model since you were thirty-one. The title is real. The office has a window. Nobody will ever ask you about your papers again, and after about eighteen months you notice that this is a relief.";
 }
 end("TENURE_OUT"); return "";
}

function nobelEligible(){
 return !g.nobelDead && !g.won.NOBEL && g.rank>=4 && aplus()>=3 && g.R>=55 && age()>=52;
}
function octoberPass(){
 if(g.turn%2!==0) return false;            /* Fall only */
 if(!nobelEligible()) return false;
 const p = sig(-8.6 + 2.5*g.M/100 + 2.0*g.N/100 + 1.2*g.P/100 + 1.0*g.R/100
              + 1.7*prestige() + (g.flags.CHAIR?0.8:0) + 0.9*clamp(g.cites/3000,0,1.2)
              - 0.3*foesOf("committee"));
 if(Math.random()<p){ end("NOBEL"); return true; }
 if(Math.random()<p*4.5){
  g.shortlists++;
  card({append:true,cls:"gold",kicker:"OCTOBER",ti:"The list",
   sc:"A journalist calls on the Monday to ask whether you'll be at home next week. That is how you learn you are on the list. On the Thursday the phone rings at 5:40 a.m. and it is your sister, about something else entirely.",
   ch:[{t:"Go to the seminar as normal.",fn(){ g.M=clamp(g.M+9,0,100); g.E=clamp(g.E+5,0,100);
     return "You give the seminar. Everybody in the room knows, and everybody is scrupulously normal, which is worse. Shortlist number "+g.shortlists+".";}}]});
  return true;
 }
 return false;
}

function presSearchReady(){
 return !g.presDead && !g.won.PRES && !!g.target && g.office>=2 && g.K>=58;
}
function presSearch(){
 const sitting=!!g.won.PRESALT;
 const yrs=Math.max(1,Math.floor((g.turn-(g.presSince||g.turn))/2));
 const tp=UNIS[g.target].p;
 const p = sig(-7.0 + 3.1*g.K/100 + 2.5*g.N/100 + 1.0*g.P/100 + 0.7*g.R/100
              + 2.2*prestige() + (sitting?1.6:0)
              - 3.4*Math.max(0,tp-prestige())*(sitting?0.5:1)
              + (g.flags.CANDID?-0.2:0.2) - 0.5*foesOf("search"));
 const sc = sitting
  ? "You are the president of <em>"+uniName()+"</em>. You have done it for "+yrs+" year"+(yrs===1?"":"s")+" and you have been, by every measure the trustees use, good at it.<br><br>The search firm on the phone is <em>"+UNIS[g.target].n+"</em>\u2019s. They stress that the conversation is exploratory. Search firms stress this immediately before it stops being true."
  : "A search firm is involved. There are nineteen people on the committee, of whom four matter, and a confidentiality protocol that leaks within a fortnight. You are flown somewhere and asked, by a student representative, what your vision for the undergraduate experience is.<br><br>The post is the presidency of <em>"+UNIS[g.target].n+"</em>.";
 card({append:true,cls:"gold",kicker:"THE SEARCH",ti: sitting?"The call from the better school":"The committee of nineteen",
  sc:sc,
  ch:[{t: sitting?"Take the exploratory conversation.":"Give them the vision.",fn(){
    if(Math.random()<p){
     g.won.PRES=1; g.office=4; g.uni=g.target; g.S+=60;
     pendingNext=()=>end("PRES");
     return "They call on a Sunday.";
    }
    /* not the one you named \u2014 but a presidency is a rung, not a terminus */
    if(!sitting && Math.random()<0.62){
     const alt=pick(LOW.concat(["FENWICK"]));
     g.won.PRESALT=alt; g.office=4; g.uni=alt; g.S+=70;
     g.presSince=g.turn; g.mods.searchcool=g.turn+8;
     g.K=clamp(g.K+10,0,100); g.B=clamp(g.B+14,0,100);
     return "They appoint an internal candidate. Eleven weeks later a different search firm calls \u2014 about "+UNIS[alt].n+", "+UNIS[alt].note+" \u2014 and you hear yourself saying yes before you have finished deciding. You are a university president. It is not the one you named, and the job is, in every particular except the address, identical.";
    }
    g.N=clamp(g.N-6,0,100); g.E=clamp(g.E-12,0,100); g.B=clamp(g.B+12,0,100);
    g.mods.searchcool=g.turn+(sitting?10:8);
    return sitting
     ? "They appoint a sitting president from a larger system. You read the announcement in your own office, which is a real office, in a building with your name on the letterhead, and it stings precisely as much as it did the first time."
     : "The announcement names someone from a medical school. You read it on your phone in a corridor, and then you go and chair the meeting you were going to chair anyway.";
  }}]});
 return true;
}

function vowMet(){
 if(g.vow==="NOBEL") return !!g.won.NOBEL;
 if(g.vow==="PRES")  return !!g.won.PRES;

}

function end(kind){

 g.ended=kind;
 if(kind==="NOBEL"){ g.won.NOBEL=1; if(g.vow==="BOTH"&&!g.won.PRES){ nobelInterlude(); return; } }
 if(kind==="PRES"&&g.vow==="BOTH"&&!g.won.NOBEL){ g.ended=null; presInterlude(); return; }
 const key = (g.vow==="BOTH"&&g.won.NOBEL&&g.won.PRES)?"BOTH":kind;
 const [t,body]=ENDTEXT[key]();
 const met=vowMet();
 const traits=Object.keys(EPITHETS).filter(f=>g.flags[f]).map(f=>EPITHETS[f]);

 const full=`<div class="final">
  <div class="finalbig">${Math.round(g.cites).toLocaleString()}<small>citations</small></div>

   terminal salary <b>${salaryTxt()}</b> &middot; age ${age()}<br>
   ${g.lostYears?`years lost to collapse <b>${g.lostYears}</b> &middot; `:""}enemies made <b>${g.enemies.length}</b>
  </div></div>`;

 const thin=`<div class="final">
  <div class="finalbig">${salaryTxt()}<small>terminal salary</small></div>
  <div class="finalrow">
   That is the number. The vow was <b>${vowLabel(true)}</b>, and it was not met, so this is the figure the ledger closes on.<br><br>

  </div></div>`;

  cls: met?"gold":"grim", kicker:"THE END", ti:t,
  sc: body + (met?full:thin) + (traits.length?`<div class="remembers">The field remembers: ${traits.join(" · ")}.</div>`:""),
  ch:[{t:"Begin again.",fn(){ setTimeout(boot,60); return ""; }}]
 });

}
