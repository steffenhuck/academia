 {t:"Write it. Copy last time's and update the numbers.",fx:{K:3,B:3},say:"It is skimmed, as intended. The reviewers recommend what they recommended last time. Nothing changes, which was the department's preference all along."}]},

{id:"S7",ti:"The Student at Harwich",b:[3,4],ex:{base:.9},ga:{since:["FIRST_STUDENT",16]},once:1,
 sc:"Your first student has been made a full professor at Harwich College. You are not at Harwich College. She sends a kind email. It contains the phrase “I owe you so much,” which is true, and which nobody at Harwich will ever say to you.",
 ch:[
 {t:"Reply with pride. Mean every word.",fx:{N:6,E:-2,mom:3,flag:"PROUD"},say:"You write four paragraphs. She keeps the email; you learn this at her inaugural lecture, where she reads a line of it aloud. You look at the ceiling again. The ceiling at Harwich is very fine."},
 {t:"Reply briefly. Feel what you feel.",fx:{E:-5,B:3},say:"“Congratulations — well deserved.” Six words. She notices the six words. Some things are not the student's fault and are held against her anyway, quietly, forever."}]},

{id:"N8",ti:"The Handbook Chapter",b:[3,4],ex:{base:.8},once:1,
 sc:"You have been asked to write the chapter on your field for the Handbook. Sixty pages, no original result, cited by everyone who does not want to read the papers. It is the most useful thing you will write and the one you will least want on your CV.",
 ch:[
 {t:"Write it.",fx:{N:6,P:4,mom:5,R:-3,B:6,flag:"HANDBOOK"},say:"It takes a year. It is cited three hundred times, by people who cite nothing else of yours. You become, in the profession's shorthand, “the person who wrote the survey,” which is a rung and a cage."},
 {t:"Decline. Write a paper instead.",fx:{R:5,wip:18},say:"A younger person writes the chapter, and for twenty years their name and not yours is the one that appears when someone types the topic into a search box."}]},

{id:"N9",ti:"The Nap",b:[3,4],ex:{base:.7},once:1,
 sc:"You have fallen asleep in a job talk, briefly, visibly, in the second row. The candidate saw. The candidate is very good. The vote is on Thursday.",
 ch:[
 {t:"Apologise to the candidate afterwards. Vote yes.",fx:{N:4,K:2,E:-3,flag:"APOLOGISED"},say:"She laughs, generously. She is hired. In year three she mentions it at a dinner, kindly, and everyone laughs, and you laugh, and you will hear the story told in four more cities."},
 {t:"Say nothing. Vote yes.",fx:{K:1},say:"She is hired. She never mentions it. The not-mentioning is a small ongoing tax that both of you pay for nine years."},
 {t:"Vote no. She saw.",fx:{E:3,K:-4,N:-4,flag:"VOTED_NO_ASLEEP"},say:"She goes to Calderon and becomes, within a decade, the reason people say Calderon's name. You have voted against a career because it witnessed a nap."}]},

{id:"N10",ti:"The Chair",b:[4,4],ex:{base:.6,highMom:1.8,highR:1.2},ga:{R:60,N:45},once:1,tr:"nobel",
 sc:"A named chair. The name belongs to a dead man who made his money in something the university no longer mentions. It comes with a stipend, a research budget, and a plaque, and it is the last promotion in a life that has no others.",
 ch:[
 {t:"Accept, and give the inaugural lecture.",fx:{mom:12,E:8,N:6,P:5,S:20,flag:"CHAIR"},say:"The lecture is good. The dead man's granddaughter is in the front row and thanks you afterwards for “honouring the family,” and you realise the plaque has two names on it and only one of them is yours."},
 {t:"Accept, and skip the lecture.",fx:{mom:8,E:4,S:20,flag:"CHAIR"},say:"The stipend arrives. The plaque goes up. The dean is mildly hurt about the lecture, and the dead man's family, who had been told there would be one, do not renew the gift when it comes up in 2047."}]},

{id:"S8",ti:"The Corner Offices",b:[3,4],ex:{base:1,office:1.5},ga:{office:1},once:1,
 sc:"The building is being reorganised. The corner offices — there are four — are wanted by eleven people, all of whom have theories about seniority, all different, all documented. You hold the plan.",
 ch:[
 {t:"Allocate by seniority. Publish the rule.",fx:{K:6,N:-3,foe:{why:"the office allocation",poisons:"vote"}},say:"Seven people are unhappy in a way they can defend. One of them will not speak to you for four years, and is on the committee. A rule was applied; that is what rules are for."},
 {t:"Allocate by who will make the most trouble.",fx:{K:8,N:3,E:-2,flag:"REALPOLITIK"},say:"Nobody complains. Everyone knows why. You have learned the actual job, and the actual job is not in any document."},
 {t:"Draw lots in a public meeting.",fx:{K:2,N:5,B:-3},say:"The meeting is a delight. The losers cannot blame you and so blame fate, which does not sit on committees. A junior person gets a corner office and her productivity, for reasons nobody can explain, doubles."}]},

{id:"S9",ti:"The Donor's Nephew",b:[3,4],ex:{base:1,office:1.5},ga:{office:2},once:1,
 sc:"A trustee whose name is on the new building has a nephew applying to the PhD program. The nephew is fine. The nephew is not good. The Dean's office would like to know your “thinking.”",
 ch:[
 {t:"Admit him. It is one place.",fx:{K:6,N:5,S:2,E:-3,flag:"NEPHEW"},say:"He is admitted. He finishes in seven years and works in his uncle's foundation. The building is very fine. Four years later, at a dinner, the trustee remembers, and a chair gets funded that you will sit in."},
 {t:"Reject him. The committee decides.",fx:{K:3,N:-6,B:4,flag:"NO_NEPHEW"},say:"He goes to Bowhead State. The trustee is “disappointed,” a word that in that office means eleven million dollars. The Dean does not forgive you, because the Dean is the one who had to make the phone call."}]},

{id:"S10",ti:"The Cut",b:[3,4],ex:{base:1,office:1.5},ga:{office:2},
 sc:"Six percent, across the board, by Friday. You can protect the department by cutting the postdoc program, or protect the postdocs by cutting the seminar budget, or cut everything a little and be hated a little by everyone.",
 ch:[
 {t:"Cut the postdocs.",fx:{K:5,N:-4,R:-3,foe:{why:"you cut the postdoc line they ran",poisons:"vote"}},say:"Four young people do not come. The seminar continues. The faculty are grateful in the way people are grateful when the cost lands on someone who cannot vote."},
 {t:"Cut the seminar.",fx:{K:5,N:-6,E:2},say:"Nobody visits for a year. The faculty are furious in a way that involves emails. The postdocs, who did not know they were saved, do not thank you, because nobody tells them."},
 {t:"Salami. Everything a little.",fx:{K:3,N:-2,B:5},say:"Everyone is a little worse off and everyone knows it was you. Nobody is much worse off. This is called leadership in the documents and cowardice in the corridor, and it is, on the evidence, what most people would do."}]},

{id:"S11",ti:"The Occupation",b:[3,4],ex:{base:1.3,office:2},ga:{office:4},once:1,
 sc:"Two hundred students have occupied the administration building over something the endowment has invested in. Their demands are long. Their sleeping bags are excellent. Your office is on the third floor of the building they have occupied.",
 ch:[
 {t:"Go down. Talk. No security.",roll:{stat:"K",pivot:65,
   win:{fx:{K:8,P:8,N:4,mom:5,flag:"WENT_DOWN"},say:"Forty minutes on the floor of the lobby. You concede nothing and they leave on Tuesday. A photograph of you sitting on the floor does very well. The board does not like the photograph and does like the outcome."},
   lose:{fx:{K:-4,P:6,N:-5,B:10},say:"They film it. You say one sentence that is accurate and sounds terrible. The sentence outlives the occupation, the semester, and most of your other sentences."}}},
 {t:"Wait them out. Exams are in three weeks.",fx:{K:4,B:6,P:-3},say:"They leave for exams. The board approves. The students remember, and in twelve years three of them are on the alumni council, and they still remember."},
 {t:"Call security.",fx:{K:-6,P:-8,N:-6,B:8,foe:{why:"you called security on the occupation",poisons:"search"}},say:"It is over in an hour and on the news for a month. The board thanks you privately and distances itself publicly. You have discovered the exact width of the gap between those two things."}]},

{id:"G9",ti:"The Scan",b:[2,4],ex:{base:.5,highB:1.6},once:1,
 sc:"The doctor uses the word “concerning” and then the word “probably.” There is a scan in three weeks. In the interval you have a referee report, a grant deadline, and a seminar to give at Pelham.",
 ch:[
 {t:"Cancel everything. Wait properly.",fx:{B:-12,R:-2,N:-2,E:-3,flag:"WAITED"},say:"Three weeks of not working. It is, it turns out, nothing. You return to the report and the grant and the seminar and find that all three were still there and that nobody had died of your absence, which is the most alarming thing the scan revealed."},
 {t:"Work through it. Tell nobody.",fx:{B:10,R:2,E:2},say:"You give the seminar at Pelham the day before the scan. It goes well. It is nothing. You have learned that you can do this, and you will do it again, and one day it will not be nothing."}]},

{id:"G10",ti:"The Reunion",b:[3,4],ex:{base:.6},once:1,
 sc:"Twenty years since the PhD. Nine of the cohort are at the dinner. One is at Harwich. One is at Thromber. Two are in banks and are paying for the wine. One left for a think tank and looks, you notice, eleven years younger than the rest of you.",
 ch:[
 {t:"Ask the think tank one how it happened.",fx:{E:-4,B:-3,flag:"ASKED_HOW"},say:"She says: “I stopped waiting to be chosen.” She says it without malice. You think about it on the train home, and for some weeks after, and then the term starts."},
 {t:"Talk to the Harwich one. Networking is networking.",fx:{N:5,E:2},say:"He is as pleased to see you as he would be to see anyone. You get a seminar invitation out of it, in April, which is something."},
 {t:"Drink with the bankers.",fx:{B:-4,N:2,S:1},say:"They are generous, funny, and know exactly what your salary is. One of them says “you're the one who stayed,” and means it as a compliment, and you take it as one, mostly."}]},

{id:"G11",ti:"The Coauthor Who Stopped",b:[2,4],ex:{base:.9},
 sc:"The paper is eighty percent done and your coauthor has not replied in four months. His last email said “on it.” He is, you learn from a third party, going through a divorce, or a breakdown, or a sabbatical, depending on who you ask.",
 ch:[
 {t:"Finish it alone. Keep his name on.",fx:{R:4,wip:25,B:7,N:3,flag:"CARRIED"},say:"You write his sections. It appears with both names. He thanks you, years later, in a bar, at a length that suggests he knows exactly what it cost. That is the whole return on the investment, and it is, oddly, enough."},
 {t:"Finish it alone. Take his name off.",fx:{R:5,wip:25,E:4,N:-4,foe:{why:"you removed their name from the paper",poisons:"referee"}},say:"He surfaces, eventually, and sees the working paper. The email he sends is short. You were within your rights. Rights are not the currency here."},
 {t:"Wait.",fx:{B:2,R:-1},say:"Four months becomes eleven. The paper, when it appears, is behind two others that say roughly the same thing. Loyalty has a price, and the price is a citation count."}]}

];

/* ============================================================
   PAPERS
   ============================================================ */
function makeTitle(){ return pick(T1)+" "+pick(T2)+pick(T3); }

function submitPaper(){
 const q=clamp(g.R*0.72+ri(-14,14)+(g.mods.bigpaper?18:0), 5, 100);
 let z=-1.9+3.0*q/100+0.9*g.N/100+1.1*prestige()+0.5*g.M/100;
 if(g.flags.CARTEL)z+=0.35;
 z-=0.25*foesOf("referee");
 const r=Math.random(), tier = r<sig(z)-0.42 ? "A+" : r<sig(z)+0.06 ? "A" : r<sig(z)+0.52 ? "B" : "C";
 const lag = tier==="A+"? ri(5,9) : tier==="A"? ri(4,7) : ri(2,5);
 g.queue.push({ti:makeTitle(), tier, jn:pick(JOURNALS[tier].n), q, due:g.turn+lag, rounds:0});
 line("info","✉ Submitted: “"+g.queue[g.queue.length-1].ti+"” — out for review.");
 if(g.mods.bigpaper) delete g.mods.bigpaper;
}

function reviewPass(){
 for(const s of g.queue.slice()){
  if(s.due>g.turn) continue;
  if(s.rounds<1 && Math.random()<0.45){
   s.rounds++; s.due=g.turn+ri(2,4);
   line("info","↻ R&R at "+s.jn+": three referees, one of whom wants a different paper.");
   continue;
  }
  g.queue.splice(g.queue.indexOf(s),1);
  const jn=s.jn||pick(JOURNALS[s.tier].n);
  g.papers.unshift({ti:s.ti,jn,tier:s.tier,q:s.q,c:0,pub:g.turn,yr:Math.floor(g.turn/2)+1});
  const pill=s.tier==="A+"?"gold":"good";
  line(pill,"★ Published in "+jn+": “"+s.ti+"”");
  if(s.tier==="A+"){ g.M=clamp(g.M+16,0,100); g.E=clamp(g.E+7,0,100); }
  else if(s.tier==="A"){ g.M=clamp(g.M+6,0,100); g.E=clamp(g.E+3,0,100); }
  else if(s.tier==="C"){ g.E=clamp(g.E-2,0,100); }
 }
}

function citationPass(){
 const matthew = 0.42 + g.N/260 + g.P/320 + g.M/210 + prestige()*0.46 + (g.flags.CARTEL?0.18:0) + (g.flags.EDITOR?0.10:0);
 let gained=0;
 for(const p of g.papers){
  const a=g.turn-p.pub;
  const decay = a<2 ? 0.55 : a<20 ? 1 : Math.max(0.22, 1-(a-20)*0.045);
  const inc = JOURNALS[p.tier].w * (0.32+0.68*p.q/100) * matthew * decay * (0.65+Math.random()*0.7);
  p.c+=inc; gained+=inc;
 }
 g.cites=g.papers.reduce((a,p)=>a+p.c,0);
 if(gained>=6) line("info","↗ Citations +"+Math.round(gained)+" this term.");
}

/* ============================================================
   TURN RESOLUTION
   ============================================================ */
function applyLevers(){
 const a=g.alloc;
 /* every counter approaches its ceiling rather than marching at a flat rate,
    so a career's worth of investment is what fills one */
 if(a.write){
  const gain=a.write*1.25*(1-g.R/102)*(g.office?0.55:1);
  g.R=clamp(g.R+gain,0,100);
  g.wip+=a.write*(6+g.R/10);
  line("good","\u270e Write: research strength +"+gain.toFixed(1)+(g.office?" (the office takes its cut)":""));
 }
 if(a.net){
  const gain=a.net*2.0*(1-g.N/102);
  g.N=clamp(g.N+gain,0,100);
  line("good","\u260e Network: +"+gain.toFixed(1));
 }
 if(a.pub){
  const gp=a.pub*2.6*(1-g.P/102), gn=a.pub*0.8*(1-g.N/102);
  g.P=clamp(g.P+gp,0,100); g.N=clamp(g.N+gn,0,100);
  line("good","\u25c9 Publicize: public profile +"+gp.toFixed(1)+", network +"+gn.toFixed(1));
 }
 if(a.serv){
  const gain=a.serv*1.8*(1-g.K/102);
  g.K=clamp(g.K+gain,0,100);
  line("good","\u2691 Service: know-how +"+gain.toFixed(1));
 }
 if(a.teach){
  g.tdebt=Math.max(0,g.tdebt-a.teach*2);
  g.K=clamp(g.K+a.teach*0.25,0,100);
  line("info","\u25a4 Teaching: prepared. Know-how +"+(a.teach*0.25).toFixed(2)+". Nothing else moves.");
 } else { g.tdebt+=g.rank>=1?1:0.5; }
 if(a.rest){ g.B=clamp(g.B-a.rest*9,0,100); line("info","\u263e Rest: burnout risk \u2212"+(a.rest*9)); }
 if(g.wip>=100){ g.wip-=100; submitPaper(); }
}
function passivePass(){
 /* burnout accrues */
 let load = 2.6 + g.rank*0.9 + g.office*1.7 + g.queue.length*0.8;
 if(g.vow==="BOTH") load*=1.35;
 if(g.clock!==null) load+=1.6;
 g.B=clamp(g.B+load,0,100);
 /* momentum decays */
 g.M=clamp(g.M*0.955,0,100);
 /* ego drifts down without feeding */
 g.E=clamp(g.E-0.4,0,100);
 /* profile fades */
 if(g.P>12) g.P=clamp(g.P-g.P*0.028,0,100);
 /* nor does anything else hold on its own: the field moves on, the contacts
    retire, the budget model changes under you */
 g.R=clamp(g.R-g.R*0.011,0,100);
 g.K=clamp(g.K-g.K*0.010,0,100);
 g.N=clamp(g.N-g.N*0.013,0,100);
 /* public profile taxes research */
 if(g.P>70){ g.R=clamp(g.R-0.8,0,100); if(Math.random()<0.28) line("bad","⬇ A colleague, to another colleague: “hasn't published in years, but does love a microphone.”"); }
 /* salary creep */
 g.S+=0.35+prestige()*0.5+g.office*0.6;
}

function foeName(){
 return pick(FIRST)+" "+pick(LAST);
}
function addFoe(spec){
 if(g.enemies.length>=9) return;
 const gr=pick(GRUDGE), o=(spec&&typeof spec==="object")?spec:{};
 const f={who:o.who||foeName(),why:o.why||gr[0],poisons:o.poisons||gr[1]};
 g.enemies.push(f);
 line("bad","⚔ "+f.who+" will remember that "+f.why+".");
}

/* ---------- burnout collapse ---------- */
function collapse(){
 g.collapses++;
 if(g.collapses>=3){ end("BURNOUT"); return; }
 const years = g.rank<=1?1:g.rank<=2?2:3;
 g.skip=years*2; g.lostYears+=years;
 card({
  cls:"grim", kicker:"COLLAPSE", ti:"The wall",
  sc:"It does not announce itself. You sit down to write a referee report you have already extended twice, and you simply do not do it, that day or the next or for a long time after. A doctor uses a word. The department covers your teaching with a visible, generous, unbearable patience.<br><br><em>"+years+" year"+(years>1?"s":"")+" go.</em>",
  ch:[
   {t:"Say nothing. Come back quietly.",fn(){
     g.R=clamp(g.R*0.62,0,100); g.K=clamp(g.K*0.62,0,100);
     g.N=clamp(g.N*0.64,0,100); g.P=clamp(g.P*0.58,0,100);
     g.B=14; g.M=clamp(g.M*0.5,0,100);
     if(Math.random()<0.55) addFoe();
     return "You come back. The field has moved about eleven degrees and nobody thinks to tell you which way. Somebody covered your classes for a year and has decided, without ever saying so, that you owe them.";
   }},
   {t:"Go public. Write about it.",fn(){
     g.R=clamp(g.R*0.62,0,100); g.K=clamp(g.K*0.62,0,100);
     const viral=Math.random()<0.12;
     if(viral){
      g.N=clamp(g.N+34,0,100); g.P=clamp(g.P+42,0,100);
      g.M=clamp(g.M+26,0,100); g.E=clamp(g.E+9,0,100); g.B=14;
      g.flags.VIRAL=1; g.mods.opedwindow=g.turn+3;
      return "Four hundred thousand people read it in nine days. It is shared by a sitting central banker. None of this has anything to do with how many people were reading you before, which is the part nobody who studies this ever quite accepts.";
     }
     const off=0.30+0.70*(g.P/100);
     g.N=clamp(g.N*(0.64+0.34*off),0,100);
     g.P=clamp(g.P*(0.58+0.46*off)+6*off,0,100);
     g.E=clamp(g.E+6,0,100); g.B=14; g.M=clamp(g.M*0.6,0,100);
     return g.P>45
       ? "The essay does what essays by known people do: it circulates, it is quoted, and it converts a private catastrophe into a public asset at roughly the exchange rate you were hoping for."
       : "You write it honestly and it is read by about nine hundred people, most of whom already knew. Turning a collapse into content requires an audience, and audiences are the thing you did not have.";
   }}
  ]
 });
}

/* ---------- op-ed follow-up (viral only) ---------- */
const OPED={
 kicker:"THE CIRCUIT", ti:"Eight hundred words on leadership",
 sc:"A mid-tier outlet has been in touch. They would like 800 words on “what burnout taught you about leadership.” They use the phrase “your story” four times in a short email.",
 ch:[
  {t:"Write it earnestly.",fn(){
    g.P=clamp(g.P+12,0,100); g.N=clamp(g.N+7,0,100); g.B=clamp(g.B+8,0,100);
    if(g.E>65){ g.E=clamp(g.E+4,0,100); return "It is sincere and it is good and, at your level of visibility, sincerity reads as positioning. Two people you respect say nothing about it, pointedly."; }
    return "It is sincere and it is good. Three strangers write to say it helped, and one of them is a graduate student who does not drop out that year.";
  }},
  {t:"Phone it in.",fn(){
    g.P=clamp(g.P+9,0,100); g.E=clamp(g.E+5,0,100); g.flags.PHONED_IN=1;
    return "Ninety minutes. Three aphorisms. It performs better than the earnest version would have, and one sentence in it will be read aloud, by someone who dislikes you, in a room where it matters.";
  }},
  {t:"Decline.",fn(){ return "Nothing happens, mechanically or otherwise. You go back to work slightly earlier than you otherwise would have."; }},
  {t:"Let the agent handle it.",gate:{E:70,P:60},fn(){
    g.P=clamp(g.P+18,0,100); g.N=clamp(g.N+11,0,100); g.E=clamp(g.E+8,0,100);
    g.flags.AGENT=1; g.M=clamp(g.M+12,0,100);
    return "There is, it emerges, an agent. There is a rate. There is a person whose job is to decline things on your behalf, which is a form of status you did not know was purchasable. You are now in a different industry that shares a building with the old one.";
  }}
 ]
};

/* ============================================================
   EVENT SELECTION
   ============================================================ */
function terms(){
 return {
  base:1,
  lowMom:1-g.M/100, highMom:g.M/100,
  highR:g.R/100, highK:g.K/100, highP:g.P/100, highB:g.B/100,
  lowS:clamp((45-g.S)/45,0,1),
  tdebt:clamp(g.tdebt/10,0,1),
  spec:g.flags.SPEC?1:0,
  office:g.office?1:0
 };
}
function gateOK(ga){
 if(!ga) return true;
 if(ga.R&&g.R<ga.R) return false;
 if(ga.K&&g.K<ga.K) return false;
 if(ga.N&&g.N<ga.N) return false;
 if(ga.P&&g.P<ga.P) return false;
 if(ga.E&&g.E<ga.E) return false;
 if(ga.flag&&!g.flags[ga.flag]) return false;
 if(ga.office&&g.office<ga.office) return false;
 if(ga.tenured&&!g.tenured) return false;
 if(ga.since){ const [f,n]=ga.since; const t=g.flags[f]; if(!t) return false; if(g.turn-(t-1)<n) return false; }
 return true;
}
function drawEvent(){
 const t=terms(), pool=[];
 for(const e of EVENTS){
  if(g.rank<e.b[0]||g.rank>e.b[1]) continue;
  if(e.once&&g.seen[e.id]) continue;
  if(!gateOK(e.ga)) continue;
  let s=g.jit[e.id]||0;
  for(const k in e.ex) s+=e.ex[k]*(t[k]||0);
  if(e.tr){
   if(g.vow==="BOTH") s+=0.25;
   else if((e.tr==="nobel"&&g.vow==="NOBEL")||(e.tr==="pres"&&g.vow==="PRES")) s+=0.85;
   else s-=1.1;
  }
  if(e.once) s+=1.2;
  s-=1.4*Math.log(1+(g.seen[e.id]||0));
  pool.push([e,Math.exp(s)]);
 }
 const quiet=Math.E*0.9, total=quiet+pool.reduce((a,p)=>a+p[1],0);
 let r=Math.random()*total;
 if(r<quiet) return null;
 r-=quiet;
 for(const[e,w] of pool){ r-=w; if(r<=0) return e; }
 return null;
}
const QUIET=[
 "A term passes. Two papers are submitted somewhere in the building; neither is yours.",
 "Nothing happens, at length. The literature grows by four hundred papers.",
 "A quiet term. Somebody retires and the line is not replaced.",
 "Fourteen weeks. A curriculum committee meets six times and produces a schedule.",
 "The term turns. Your inbox achieves, briefly, a state of grace, and then does not."
];

/* ============================================================
   ROLLS  (Ego = mean shift + tail risk)
   ============================================================ */
function rollP(roll){
 const base = roll.stat==="R"?g.R : roll.stat==="K"?g.K : roll.stat==="N"?g.N :
              roll.stat==="P"?g.P : roll.stat==="E"?g.E : 50;
 const egoShift = roll.stat==="E" ? 0 : 0.28*(g.E-50);
 return sig((base-(roll.pivot||50)+egoShift)/14);
}
function applyLoss(fx){
 const mult=1+g.E/120;
 const out={};
 for(const k in fx) out[k]=(typeof fx[k]==="number"&&fx[k]<0)? fx[k]*mult : fx[k];
 applyFx(out);
 if(Math.random()<g.E/200) addFoe();
}
function applyFx(fx){
 if(!fx) return;
 for(const k of ["R","K","N","P"]) if(fx[k]){
  const d = fx[k]>0 ? fx[k]*(1-g[k]/105) : fx[k];
  g[k]=clamp(g[k]+d,0,100);
 }
 for(const k of ["E","B"]) if(fx[k]) g[k]=clamp(g[k]+fx[k],0,100);
 if(fx.S) g.S=Math.max(0,g.S+fx.S);
 if(fx.wip) g.wip+=fx.wip;
 if(fx.mom) g.M=clamp(g.M+fx.mom,0,100);
 if(fx.flag) g.flags[fx.flag]=g.turn+1;   /* stamped, so later events can ask how long ago */
 if(fx.mod){
  if(fx.mod==="resignOffice") g.office=0;
  else if(fx.mod==="toCranmoor"){ g.postdocEnd=null; startClock("CRANMOOR",6); }
  else g.mods[fx.mod]=1;
 }
 if(fx.tax){ g.taxes=g.taxes||[]; g.taxes.push(g.turn+fx.tax); }
 if(fx.foe) addFoe(fx.foe);
 if(fx.ending) end(fx.ending);
}

/* ============================================================
   TENURE
   ============================================================ */
function startClock(uni,years){
 g.uni=uni; g.rank=2; g.clockLen=years; g.clock=years*2;
 g.S=Math.max(g.S, 62+Math.round(prestige()*46));
}
function tenureVote(){
 const seats=12, votes=[]; let named=[];
 const foes=g.enemies.filter(f=>f.poisons==="vote"||f.poisons==="committee").slice(0,3);
 const teachPen = g.tdebt>14 ? -0.7 : g.tdebt>8 ? -0.35 : 0;
 const base = -1.15 + 2.7*g.R/100 + 1.0*g.K/100 + 1.0*g.N/100
            + 0.9*clamp(g.cites/420,0,1.4) + 1.1*clamp(aplus()/3,0,1.3)
            + (g.P>72?-0.45:0) + teachPen;
 for(let i=0;i<seats;i++){
  if(i<foes.length){ votes.push(false); named.push(foes[i]); continue; }
  votes.push(Math.random()<sig(base));
 }
 const yes=votes.filter(Boolean).length;
 const pass = yes>=7;
 let note="";
 if(named.length) note = named.map(f=>"<b>"+f.who+"</b> votes no — "+f.why+".").join("<br>");
 const letter = g.vow==="PRES"||g.K>g.R
  ? "The letter says: <em>“a genuine institutional citizen. We will miss the polish in the published record, but this is someone who knows how to run a meeting, and a department is a great many meetings.”</em>"
  : "The letter says: <em>“the service record is thin and the collegiality has been described to us as situational. But one of these papers will still be read in thirty years, and we are not in the business of being wrong about that twice.”</em>";

 card({
  cls: pass?"gold":"grim", kicker:"THE VOTE", ti: pass?"Tenure":"Denied",
  sc:"Twelve of them, in a room you are not in, for two hours and ten minutes."
    +'<div class="tally">'+votes.map(v=>'<div class="vote '+(v?"yes":"no")+'">'+(v?"✓":"✗")+'</div>').join("")+'</div>'
    +'<div class="votenote">'+yes+" for, "+(seats-yes)+" against."+(note?"<br>"+note:"")+"</div><br>"+letter,
  ch:[{t: pass?"Take the letter home.":"Ask what the timeline is.", fn(){
    if(pass){
     g.tenured=true; g.clock=null; g.rank=3; g.S+=18; g.E=clamp(g.E+10,0,100);
     g.flags.TENURED=1;
     return "You are here until you decide not to be. It is the single largest change in your life and it feels, on the day, like a slightly quieter Tuesday.";
    }
    g.denials++; g.clock=null;
    return denialCascade();
  }}]
 });
}
function denialCascade(){
 if(g.denials===1){
  const dest=pick(LOW.concat(MID.slice(2)));
  const yrs=4;
  g.nobelDead=true;
  g.uni=dest; g.rank=2; g.clockLen=yrs; g.clock=yrs*2;
  g.N=clamp(g.N-12,0,100); g.E=clamp(g.E-14,0,100); g.B=clamp(g.B+16,0,100);
  g.S=Math.max(30, g.S*0.78);
  g.flags.DENIED_ONCE=1;
  return "You have a year to clear the office. Then "+UNIS[dest].n+" calls — they have a line, they need someone with your record, and the clock there is "
   +yrs+" years, not seven, because they have been burned before. The Nobel is now, in the technical sense, unavailable. Nobody says this out loud. Everybody understands it.";
 }
 /* second denial */
 g.presDead=false;
 if(g.K>=42){
  g.rank=3; g.tenured=true; g.office=1; g.uni=pick(MID);
  g.S=Math.max(g.S, 96); g.flags.ADMIN_ESCAPE=1; g.nobelDead=true;
  return "The second vote goes the same way as the first. Then something unexpected: "+UNIS[g.uni].n+" needs an associate dean who understands a budget model, and you have understood a budget model since you were thirty-one. The title is real. The office has a window. Nobody will ever ask you about your papers again, and after about eighteen months you notice that this is a relief.";
 }
 end("TENURE_OUT"); return "";
}

/* ============================================================
   THE ENDGAME ROLLS
   ============================================================ */
function nobelEligible(){
 return !g.nobelDead && !g.won.NOBEL && g.rank>=4 && aplus()>=4 && g.R>=58 && age()>=52;
}
function octoberPass(){
 if(g.turn%2!==0) return false;            /* Fall only */
 if(!nobelEligible()) return false;
 const p = sig(-10.2 + 2.5*g.M/100 + 2.0*g.N/100 + 1.2*g.P/100 + 1.0*g.R/100
              + 1.7*prestige() + (g.flags.CHAIR?0.8:0) + 0.9*clamp(g.cites/3000,0,1.2)
              - 0.5*foesOf("committee"));
 if(Math.random()<p){ end("NOBEL"); return true; }
 if(Math.random()<p*4.5){
  g.shortlists++;
  card({cls:"gold",kicker:"OCTOBER",ti:"The list",
   sc:"A journalist calls on the Monday to ask whether you'll be at home next week. That is how you learn you are on the list. On the Thursday the phone rings at 5:40 a.m. and it is your sister, about something else entirely.",
   ch:[{t:"Go to the seminar as normal.",fn(){ g.M=clamp(g.M+9,0,100); g.E=clamp(g.E+5,0,100);
     return "You give the seminar. Everybody in the room knows, and everybody is scrupulously normal, which is worse. Shortlist number "+g.shortlists+".";}}]});
  return true;
 }
 return false;
}

function presSearchReady(){
 return !g.presDead && !g.won.PRES && !!g.target && g.office>=2 && g.K>=58;
}
function presSearch(){
 const sitting=!!g.won.PRESALT;
 const yrs=Math.max(1,Math.floor((g.turn-(g.presSince||g.turn))/2));
 const tp=UNIS[g.target].p;
 const p = sig(-7.0 + 3.1*g.K/100 + 2.5*g.N/100 + 1.0*g.P/100 + 0.7*g.R/100
              + 2.2*prestige() + (sitting?1.3:0)
              - 3.4*Math.max(0,tp-prestige())*(sitting?0.5:1)
              + (g.flags.CANDID?-0.2:0.2) - 0.6*foesOf("search"));
 const sc = sitting
  ? "You are the president of <em>"+uniName()+"</em>. You have done it for "+yrs+" year"+(yrs===1?"":"s")+" and you have been, by every measure the trustees use, good at it.<br><br>The search firm on the phone is <em>"+UNIS[g.target].n+"</em>\u2019s. They stress that the conversation is exploratory. Search firms stress this immediately before it stops being true."
  : "A search firm is involved. There are nineteen people on the committee, of whom four matter, and a confidentiality protocol that leaks within a fortnight. You are flown somewhere and asked, by a student representative, what your vision for the undergraduate experience is.<br><br>The post is the presidency of <em>"+UNIS[g.target].n+"</em>.";
 card({cls:"gold",kicker:"THE SEARCH",ti: sitting?"The call from the better school":"The committee of nineteen",
  sc:sc,
  ch:[{t: sitting?"Take the exploratory conversation.":"Give them the vision.",fn(){
    if(Math.random()<p){
     g.won.PRES=1; g.office=4; g.uni=g.target; g.S+=60;
     pendingNext=()=>end("PRES");
     return "They call on a Sunday.";
    }
    /* not the one you named \u2014 but a presidency is a rung, not a terminus */
    if(!sitting && Math.random()<0.62){
     const alt=pick(LOW.concat(["FENWICK"]));
     g.won.PRESALT=alt; g.office=4; g.uni=alt; g.S+=70;
     g.presSince=g.turn; g.mods.searchcool=g.turn+8;
     g.K=clamp(g.K+10,0,100); g.B=clamp(g.B+14,0,100);
     return "They appoint an internal candidate. Eleven weeks later a different search firm calls \u2014 about "+UNIS[alt].n+", "+UNIS[alt].note+" \u2014 and you hear yourself saying yes before you have finished deciding. You are a university president. It is not the one you named, and the job is, in every particular except the address, identical.";
    }
    g.N=clamp(g.N-6,0,100); g.E=clamp(g.E-12,0,100); g.B=clamp(g.B+12,0,100);
    g.mods.searchcool=g.turn+(sitting?10:8);
    return sitting
     ? "They appoint a sitting president from a larger system. You read the announcement in your own office, which is a real office, in a building with your name on the letterhead, and it stings precisely as much as it did the first time."
     : "The announcement names someone from a medical school. You read it on your phone in a corridor, and then you go and chair the meeting you were going to chair anyway.";
  }}]});
 return true;
}

function vowMet(){

 $("termslot").innerHTML=`<div class="termbar"><span class="tt">${termName()}</span><span class="ta">age ${age()} \u00b7 ${title()}</span></div>`;
 const ac=$("agechip");
 if(ac){ ac.classList.remove("tick"); void ac.offsetWidth; ac.classList.add("tick"); }
}
function quietCard(){
 const el=document.createElement("div");
 el.className="card quiet";
 el.innerHTML=`<div class="kicker"><span>A QUIET TERM</span><span>${termName()} \u00b7 age ${age()}</span></div>
  <div class="scene">${pick(QUIET)}</div>`;
 $("cardslot").innerHTML="";
 $("cardslot").appendChild(el);
}
function tile(lbl,val,pct,color,alarm){
 return `<div class="tile${alarm?" alarm":""}">
  <div class="lbl">${lbl}</div>
  <div class="v">${val}</div>
  <div class="track"><b style="width:${clamp(pct,0,100)}%;background:${color}"></b></div>
 </div>`;
}
function needle(){
 const v=g.Mshown;
 const ang=-90+180*(v/100);
 const zone = v<33?"cold": v<67?"warm":"hot";
 const col = v<33?"var(--sky)": v<67?"var(--chalk)":"var(--gold)";
 return `<div class="tile gauge">
  <div class="lbl">Momentum</div>
  <div class="needlebox"><svg viewBox="0 0 100 46" role="img" aria-label="Momentum: running ${zone}">
   <path d="M8 40 A42 42 0 0 1 92 40" fill="none" stroke="#2C2937" stroke-width="7" stroke-linecap="round"/>
   <path d="M8 40 A42 42 0 0 1 36 4.5" fill="none" stroke="var(--sky)" stroke-width="7" stroke-linecap="round" opacity=".5"/>
   <path d="M64 4.5 A42 42 0 0 1 92 40" fill="none" stroke="var(--gold)" stroke-width="7" stroke-linecap="round" opacity=".5"/>
   <g class="needle" style="transform:rotate(${ang}deg)">
    <line x1="50" y1="40" x2="50" y2="12" stroke="${col}" stroke-width="3" stroke-linecap="round"/>
   </g>
   <circle cx="50" cy="40" r="4" fill="${col}"/>
  </svg></div>
  <div class="lbl" style="text-align:center;color:${col}">running ${zone}</div>
 </div>`;
}

function render(){
 /* masthead */
 $("vowchip").textContent = g.vow? vowLabel(false) : "no vow yet";
 $("agechip").textContent = "age "+age()+" · "+termName();
 const tc=$("tenurechip");
 if(g.clock!==null){
  tc.hidden=false;
  const yrsLeft=Math.ceil(g.clock/2);
  tc.textContent="tenure clock — year "+(g.clockLen-yrsLeft+1)+" of "+g.clockLen;
  tc.className="clockchip"+(yrsLeft<=2?" hot":"");
 } else tc.hidden=true;

 /* ladder */
 $("ladder").innerHTML=RANKS.map((r,i)=>
  `<i class="${i<g.rank?"done":i===g.rank?"now":""}" title="${r}"></i>`).join("");
 $("rank").innerHTML="<b>"+title()+"</b>";
 $("place").textContent=g.uni? uniShort()+" · "+UNIS[g.uni].note : "";

 /* board */
 $("board").innerHTML =
  tile("Research",   g.R.toFixed(0), g.R, "var(--gold)")+
  tile("Know-how",   g.K.toFixed(0), g.K, "var(--mint)")+
  tile("Network",    g.N.toFixed(0), g.N, "var(--sky)")+
  tile("Profile",    g.P.toFixed(0), g.P, "var(--plum)")+
  tile("Salary",     salaryTxt(),    clamp(g.S/3,0,100), "var(--mint)")+
  tile("Ego",        g.E.toFixed(0), g.E, "var(--plum)")+
  tile("Burnout",    g.B.toFixed(0), g.B, g.B>70?"var(--rose)":"var(--gold)", g.B>70)+
  needle();

 /* enemies */
 $("foes").innerHTML=g.enemies.map(f=>
  `<span class="foe" title="${f.why}">${f.who} · ${f.poisons}</span>`).join("");

 /* cv */
 const q=g.queue.length;
 $("cv").innerHTML=`
  <div class="cvhead">
   <div class="cvbig">${Math.round(g.cites).toLocaleString()}<small>citations</small></div>
   <div class="cvsub">h-index <b>${hIndex()}</b><br>${g.papers.length} published &middot; <b>${aplus()}</b> in the top four</div>
  </div>
  <div class="papers">${g.papers.slice(0,6).map(p=>
   `<div class="prow"><span class="tierpill t-${p.tier==="A+"?"Aplus":p.tier}">${p.tier}</span>
    <span class="ti">${p.ti}</span><span class="jn">${p.jn}</span><span class="ct">${Math.round(p.c)}</span></div>`).join("")}</div>
  <div class="wip">${q? q+" under review &middot; ":""}next paper ${Math.min(99,Math.round(g.wip))}% written</div>`;

 /* desk */
 $("desk").hidden = awaiting || !!g.ended || !g.vow;
 $("left").textContent = budget()-spent();
 $("levers").innerHTML=LEVERS.map(([k,n])=>{
  const v=g.alloc[k];
  return `<div class="lever${v?" lit":""}">
   <div class="ln">${n}</div>
   <div class="dots${v?"":" none"}">${v?"●".repeat(v):"·"}</div>
   <div class="pm">
    <button data-l="${k}" data-d="-1" ${v<=0?"disabled":""} aria-label="less ${n}">−</button>
    <button data-l="${k}" data-d="1" ${budget()-spent()<=0?"disabled":""} aria-label="more ${n}">+</button>
   </div></div>`;
 }).join("");
 const h=LEVERS.find(l=>g.alloc[l[0]]>0);
 const base = h? h[2] : "Six places to put a term. There are only "+budget()+" points, and there have only ever been.";
 $("hint").textContent = (taxed()? "The editorial desk takes "+(taxed()>1?taxed()+" points":"a point")+" this term. ":"")+base;
 $("go").disabled=awaiting||!!g.ended;
}

/* ---------- the card ---------- */
function card(o){
 awaiting=true;
 const el=document.createElement("div");
 el.className="card "+(o.cls||"");
 el.innerHTML=`
  <div class="kicker"><span>${o.kicker||"THE TERM"}</span><span>${termName()} · age ${age()}</span></div>
  <h2>${o.ti}</h2>
  <div class="scene">${o.sc}</div>
  <div class="choices">${o.ch.map((c,i)=>{
    const ok=gateOK(c.gate);
    const sub = ok ? (c.why||"") : lockWhy(c.gate);
    return `<button data-c="${i}"${ok?"":" disabled"}${c.roll?' class="risky"':""}>${c.t}${
      sub?`<span class="why">${sub}</span>`:""}</button>`;
  }).join("")}</div>
  <div class="outcome" hidden></div>`;
 $("cardslot").innerHTML="";
 $("cardslot").appendChild(el);

 el.querySelectorAll("button[data-c]").forEach(b=>b.onclick=()=>{
  const c=o.ch[+b.dataset.c];
  el.querySelectorAll("button").forEach(x=>x.disabled=true);
  b.style.borderColor="var(--gold)";
  const snap={R:g.R,K:g.K,N:g.N,P:g.P,S:g.S,E:g.E,B:g.B};
  let msg=c.say||"", bad=false;

  if(c.fn){ msg=c.fn()||msg; }
  else if(c.roll){
   const p=rollP(c.roll);
   if(Math.random()<p){ applyFx(c.roll.win.fx); msg=c.roll.win.say; }
   else { applyLoss(c.roll.lose.fx); msg=c.roll.lose.say; bad=true; }
  } else applyFx(c.fx);

  const out=el.querySelector(".outcome");
  if(msg){
   out.hidden=false;
   out.className="outcome"+(bad?" bad":"");
   out.innerHTML=msg+deltaStrip(snap);
  }
  if(pendingNext){
   const go=pendingNext; pendingNext=null;
   out.hidden=false;
   const nb=document.createElement("button");
   nb.className="go"; nb.textContent=o.nextLabel||"Continue";
   nb.onclick=()=>{ awaiting=false; go(); };
   out.appendChild(nb);
  } else {
   awaiting=false;
  }
  render();
 });
 render();
}
function deltaStrip(s){
 const nm={R:"research",K:"know-how",N:"network",P:"profile",E:"ego",B:"burnout"};
 const parts=[];
 for(const k in nm){
  const d=g[k]-s[k];
  if(Math.abs(d)>=1) parts.push(`<span class="${d>0?(k==="B"?"dn":"up"):(k==="B"?"up":"dn")}">${nm[k]} ${d>0?"+":"−"}${Math.abs(d).toFixed(0)}</span>`);
 }
 const ds=g.S-s.S;
 if(Math.abs(ds)>=1) parts.push(`<span class="${ds>0?"up":"dn"}">salary ${ds>0?"+":"−"}$${Math.abs(ds).toFixed(0)}k</span>`);
 return parts.length?`<div class="deltas">${parts.join("")}</div>`:"";
}
function lockWhy(ga){
 if(!ga) return "";
 if(ga.E&&ga.P) return "needs a certain amount of ego, and an audience";
 if(ga.K) return "needs institutional know-how "+ga.K+"+";
 if(ga.N) return "needs a network you don't have yet";
 if(ga.R) return "needs a research record you don't have yet";
 return "not yet";
}

/* ============================================================
   THE TURN
   ============================================================ */
function runTerm(){
 if(awaiting||g.ended) return;
 $("log").innerHTML="";
 $("cardslot").innerHTML="";

 if(g.skip>0){
  g.skip--; g.turn++;
  termBanner();
  g.Mshown=g.M;
  line("bad","— A term you were not present for."+(g.clock!==null?" The tenure clock is stopped.":""));
  if(g.turn>=80){ end("TIME"); return; }
  render(); return;
 }

 g.turn++;
 termBanner();
 const oldM=g.M;

 applyLevers();
 passivePass();
 reviewPass();
 citationPass();

 /* promotion: assistant -> associate is the vote; associate -> full is a threshold */
 if(g.rank===3 && g.tenured && g.R+g.K>=110 && Math.random()<0.3){
  g.rank=4; g.S+=22; g.E=clamp(g.E+6,0,100);
  line("gold","▲ Promoted to Professor. The letter takes four months and the raise takes eighteen.");
 }
 /* administrative ladder */
 if(g.office>=1 && g.office<3 && g.K>=45+g.office*14 && Math.random()<0.22){
  g.office++; g.S+=26; g.B=clamp(g.B+8,0,100);
  line("gold","▲ "+OFFICES[g.office]+". A larger office and a calendar that belongs to someone else.");
 }
 if(g.mods.office1 && g.office===0){ g.office=1; delete g.mods.office1; }
 if(g.mods.move){ delete g.mods.move; g.uni="BELLWEATHER"; line("info","→ You move to "+uniName()+"."); }
 if(g.mods.teachfix){ delete g.mods.teachfix; g.tdebt=0; }

 g.alloc={write:0,net:0,pub:0,serv:0,teach:0,rest:0};
 g.Mshown=oldM;   /* the needle lags one beat */

 /* stage transitions */
 if(g.rank===1 && g.postdocEnd && g.turn>=g.postdocEnd){
  const dest = g.R>=42 ? pick(TOP.concat(MID)) : pick(MID.concat(LOW));
  startClock(dest, UNIS[dest].p>=0.8?7:6);
  line("gold","▲ Assistant Professor at "+uniName()+". The clock starts: "+g.clockLen+" years.");
 }

 /* hard stops */
 if(g.B>=100){ render(); collapse(); return; }
 if(g.turn>=80){ render(); end(timeUpKind()); return; }
 if(g.clock!==null){
  g.clock--;
  if(g.clock<=0){ render(); tenureVote(); return; }
 }

 if(g.rank===0 && g.turn>=6){ render(); placeStep(); return; }

 /* op-ed window after a viral collapse */
 if(g.mods.opedwindow && g.turn>=g.mods.opedwindow){
  delete g.mods.opedwindow; render(); card(OPED); return;
 }
 /* endgame rolls */
 if(octoberPass()){ render(); return; }
 if(presSearchReady() && !(g.mods.searchcool>g.turn) && Math.random()<0.40){ render(); presSearch(); return; }

 const e=drawEvent();
 if(e){
  g.seen[e.id]=(g.seen[e.id]||0)+1;
  const n=g.seen[e.id];
  const sc=(e.alt&&n>1)? e.alt[Math.min(n-2,e.alt.length-1)] : e.sc;
  card({kicker:"THE TERM",ti:e.ti,sc,ch:e.ch});
 } else {
  quietCard();
 }
 render();
}
function timeUpKind(){
 if(g.vow==="BOTH"){
  if(g.won.NOBEL&&g.won.PRES) return "BOTH";
  if(g.won.NOBEL) return "BOTH_HALF_N";
  if(g.won.PRES)  return "BOTH_HALF_P";
 }
 if(g.won.PRESALT) return "PRES_MISS";
 return g.shortlists?"NOBEL_MISS":"TIME";
}

/* ============================================================
   OPENING
   ============================================================ */
function boot(){
 newGame();
 $("log").innerHTML="";
 $("termslot").innerHTML="";
 render();
 card({
  cls:"gold", kicker:"THE VOW", ti:"What is it for?",
  sc:"You are twenty-five. You have a dissertation that is nearly finished, an advisor who has not read the third chapter, and forty years.<br><br>Everyone in this profession is doing it for something. Most of them will not say what. <em>Say what.</em>",
  ch:[
   {t:"The Nobel Prize.",why:"you want the call",fn(){ g.vow="NOBEL"; pendingNext=phdStart; return "Said out loud, at twenty-five, it sounds absurd. You will not say it out loud again for thirty years."; }},
   {t:"The presidency of Harwich College.",why:UNIS.HARWICH.blurb,fn(){ g.vow="PRES"; g.target="HARWICH"; pendingNext=phdStart; return "The honest version of the ambition, which almost nobody gives out loud. Note that you have named a building and not a rank: other places will offer you their presidencies, and they will not count."; }},
   {t:"Both.",why:"what else?",fn(){ g.vow="BOTH"; g.target="HARWICH"; pendingNext=phdStart; return "Both. Note that the clock does not adjust for this, and neither does the body."; }}
  ]
 });
}
function phdStart(){
 g.uni=pick(TOP.concat(MID)); g.rank=0; g.S=24;
 card({
  cls:"gold", kicker:"THE PROGRAM", ti:"Nearly done",
  sc:"You are twenty-five, most of the way through a PhD at <em>"+uniName()+"</em>. A stipend of $24k, a desk in a room with four other desks, and a dissertation in three chapters of which two exist.<br><br>Three years of it remain before the market. What you do with them will not appear on your CV, and will decide most of what follows.",
  ch:[{t:"Get to work.",why:"six terms until the job market",
    fn(){ return "The room has a kettle and a whiteboard nobody erases. Somebody's job market paper is on it, from a year that has passed."; }}]
 });
}
function placeStep(){
 const post=pick(TOP), tt=pick(MID);
 card({
  cls:"gold",kicker:"THE MARKET",ti:"Two offers",
  sc:"The market has produced exactly two things. A postdoc at <em>"+UNIS[post].n+"</em> — two years, no teaching, no security, and an address that does roughly a third of the work of a career. Or a tenure-track line at <em>"+UNIS[tt].n+"</em> — seven years on the clock, starting now.<br><br>Everyone will tell you there is an obvious answer. They will not agree about which.",
  ch:[
   {t:"The postdoc at "+UNIS[post].n+".",why:UNIS[post].blurb+" — two years, and no clock.",fn(){
     g.uni=post; g.rank=1; g.S=58; g.flags.POSTDOC=1; g.postdocEnd=g.turn+4;
     return "Two years in a building where the coffee is bad and the corridor conversations are not. Nobody asks what you teach, because you do not."; }},
   {t:"The tenure-track line at "+UNIS[tt].n+".",why:UNIS[tt].blurb+" — seven years, starting now.",fn(){
     startClock(tt,7);
     return "An office with your name on a card in a slot, which is how they indicate that the name is provisional. The clock starts this September."; }}
  ]
 });
}

/* wiring */
$("levers").addEventListener("click",ev=>{
 const b=ev.target.closest("button"); if(!b) return;
 const k=b.dataset.l, d=+b.dataset.d;
 if(d>0&&spent()>=budget()) return;
 g.alloc[k]=Math.max(0,g.alloc[k]+d);
 render();
});
$("go").onclick=runTerm;


boot();
</script>
</body>
</html>
