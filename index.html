/* an exogenous event: no choice, the thing simply happens */
function autoCard(e,sc){
 const snap={R:g.R,K:g.K,N:g.N,P:g.P,S:g.S,E:g.E,B:g.B};
 applyFx(e.auto.fx);
 const bad=!!e.auto.bad, good=!!e.auto.good;
 const el=document.createElement("div");
 el.className="card "+(bad?"grim":good?"gold":"");
 el.innerHTML=`<div class="kicker"><span>${bad?"BAD NEWS":good?"GOOD NEWS":"NEWS"}</span><span>${termName()} \u00b7 age ${age()}</span></div>
  <h2>${fill(e.ti,1)}</h2><div class="scene">${fill(sc,1)}</div>
  <div class="outcome${bad?" bad":""}">${fill(e.auto.say,1)}${deltaStrip(snap)}</div>`;
 $("cardslot").appendChild(el);
 awaiting=false;
}
/* a publication is an event, not a log line */
const PUBLINE={
 "A+":["It is in "+"%J"+". For about a fortnight, people you have never met know one fact about you, and the fact is this.","The acceptance email is three lines. You read it eleven times. Somewhere a colleague reads it once, on a forwarded thread, and closes the tab."],
 "A" :["A real journal, a real result, a real line. It will be cited by people who were going to cite you anyway, plus a few who were not, which is the whole difference.","Solid. The word will follow the paper around for the rest of its life."],
 "B" :["It is out. It will be read by the people who read it already, as a working paper. The journal's website loads slowly, which is the most anyone will say about it.","Published. The CV moves one line. Nothing else does."],
 "C" :["It appears in "+"%J"+". It is, in the sense that matters, gone.","The journal sends a certificate. You do not know where to put the certificate."]
};
const FIELDLINE={
 theory:"It has one theorem, and the theorem has one assumption, and the assumption is what people will remember.",
 micro:"Somewhere a firm in the paper is real, and its lawyers will eventually read Section 4.",
 macro:"A central bank downloads it on the day it appears and does not, as far as anyone can tell, read it.",
 metrics:"Four hundred applied papers will use the method. Eleven will use it correctly.",
 finance:"Three hedge funds have already tried it. One of them still exists.",
 labour:"Both sides of a policy argument will cite it, and both will be roughly right.",
 development:"The village in Table 3 is real, and does not know it is in Table 3.",
 political:"A politician will quote the abstract. The abstract does not say what the politician says it says.",
 behavioural:"The effect is large in the paper and smaller in the world, which is the usual direction.",
 history:"Somebody in a history department is already drafting the response, in a different register."
};
function pubCard(list){
 const top=list.some(p=>p.tier==="A+");
 const best=["A+","A","B","C"].find(t=>list.some(p=>p.tier===t));
 const lead=list.find(p=>p.tier===best);
 const rows=list.map(p=>`<div class="pubrow"><span class="tierpill t-${p.tier==="A+"?"Aplus":p.tier}">${p.tier}</span> <b>${p.ti}</b> <i>\u2014 ${p.jn}</i></div>`).join("");
 const say=pick(PUBLINE[best]).replace("%J",lead.jn)+(lead.f&&FIELDLINE[lead.f]&&Math.random()<0.6?" "+FIELDLINE[lead.f]:"");
 const el=document.createElement("div");
 el.className="card "+(top?"gold":"");
 el.innerHTML=`<div class="kicker"><span>PUBLISHED</span><span>${termName()} \u00b7 age ${age()}</span></div>
  <h2>${list.length>1?"Two in one term":top?"The top four":"In print"}</h2>
  <div class="scene">${rows}</div>
  <div class="outcome">${say}</div>`;
 $("cardslot").appendChild(el);
 awaiting=false;
}
function tile(lbl,val,pct,color,alarm){
 return `<div class="tile${alarm?" alarm":""}">
  <div class="lbl">${lbl}</div>
  <div class="v">${val}</div>
  <div class="track"><b style="width:${clamp(pct,0,100)}%;background:${color}"></b></div>
 </div>`;
}
function needle(){
 const v=g.Mshown;
 const ang=-90+180*(v/100);
 const zone = v<33?"cold": v<67?"warm":"hot";
 const col = v<33?"var(--sky)": v<67?"var(--chalk)":"var(--gold)";
 return `<div class="tile gauge">
  <div class="lbl">Momentum</div>
  <div class="needlebox"><svg viewBox="0 0 100 46" role="img" aria-label="Momentum: running ${zone}">
   <path d="M8 40 A42 42 0 0 1 92 40" fill="none" stroke="#2C2937" stroke-width="7" stroke-linecap="round"/>
   <path d="M8 40 A42 42 0 0 1 36 4.5" fill="none" stroke="var(--sky)" stroke-width="7" stroke-linecap="round" opacity=".5"/>
   <path d="M64 4.5 A42 42 0 0 1 92 40" fill="none" stroke="var(--gold)" stroke-width="7" stroke-linecap="round" opacity=".5"/>
   <g class="needle" style="transform:rotate(${ang}deg)">
    <line x1="50" y1="40" x2="50" y2="12" stroke="${col}" stroke-width="3" stroke-linecap="round"/>
   </g>
   <circle cx="50" cy="40" r="4" fill="${col}"/>
  </svg></div>
  <div class="lbl" style="text-align:center;color:${col}">running ${zone}</div>
 </div>`;
}

function render(){
 /* masthead */
 $("vowchip").textContent = g.vow? vowLabel(false) : "no vow yet";
 $("agechip").textContent = "age "+age()+" · "+termName();
 const tc=$("tenurechip");
 if(g.clock!==null){
  tc.hidden=false;
  const yrsLeft=Math.ceil(g.clock/2);
  tc.textContent="tenure clock — year "+(g.clockLen-yrsLeft+1)+" of "+g.clockLen;
  tc.className="clockchip"+(yrsLeft<=2?" hot":"");
 } else tc.hidden=true;

 /* ladder */
 $("ladder").innerHTML=RANKS.map((r,i)=>
  `<i class="${i<g.rank?"done":i===g.rank?"now":""}" title="${r}"></i>`).join("");
 $("rank").innerHTML="<b>"+title()+"</b>";
 $("place").textContent=g.uni? uniName() : "";

 /* board */
 $("board").innerHTML =
  tile("Research",   g.R.toFixed(0), g.R, "var(--gold)")+
  tile("Know-how",   g.K.toFixed(0), g.K, "var(--mint)")+
  tile("Network",    g.N.toFixed(0), g.N, "var(--sky)")+
  tile("Profile",    g.P.toFixed(0), g.P, "var(--plum)")+
  tile("Salary",     salaryTxt(),    clamp(g.S/3,0,100), "var(--mint)")+
  tile("Ego",        g.E.toFixed(0), g.E, "var(--plum)")+
  tile("Burnout",    g.B.toFixed(0), g.B, g.B>70?"var(--rose)":"var(--gold)", g.B>70)+
  needle();

 /* enemies */
 $("foes").innerHTML=(g.enemies.length?'<span class="foelbl">enemies you made</span>':"")+g.enemies.map(f=>
  `<span class="foe" title="${f.why}">${f.who} · ${f.poisons}</span>`).join("");

 /* cv */
 const q=g.queue.length;
 $("cv").innerHTML=`
  <div class="cvhead">
   <div class="cvbig">${Math.round(g.cites).toLocaleString()}<small>citations</small></div>
   <div class="cvsub">h-index <b>${hIndex()}</b><br><button class="cvlink" data-cv="all">${g.papers.length} published</button> &middot; <button class="cvlink" data-cv="top"><b>${aplus()}</b> in the top four</button></div>
  </div>
  <div class="papers">${g.papers.slice(0,6).map(p=>
   `<div class="prow"><span class="tierpill t-${p.tier==="A+"?"Aplus":p.tier}">${p.tier}</span>
    <span class="ti">${p.ti}</span><span class="jn">${p.jn}</span><span class="ct">${Math.round(p.c)}</span></div>`).join("")}</div>
  ${q? `<div class="wip"><button class="cvlink" data-cv="queue">${q} under review</button></div>`:""}`;

 /* desk */
 $("desk").hidden = awaiting || !!g.ended || !g.vow;
 $("desk").classList.toggle("first", g.turn===0 && spent()===0);
 $("left").textContent = budget()-spent();
 $("levers").innerHTML=LEVERS.map(([k,n])=>{
  const v=g.alloc[k];
  return `<div class="lever${v?" lit":""}">
   <div class="ln">${n}</div>
   <div class="dots${v?"":" none"}">${v?"●".repeat(v):"·"}</div>
   <div class="pm">
    <button data-l="${k}" data-d="-1" ${v<=0?"disabled":""} aria-label="less ${n}">−</button>
    <button data-l="${k}" data-d="1" ${budget()-spent()<=0?"disabled":""} aria-label="more ${n}">+</button>
   </div></div>`;
 }).join("");
 const h=LEVERS.find(l=>g.alloc[l[0]]>0);
 const base = h? h[2] : (g.turn===0
   ? "Spend the term: put your "+budget()+" points into the six activities above, then run it."
   : "Six places to put a term. There are only "+budget()+" points, and there have only ever been.");
 $("hint").textContent = (taxed()? "The editorial desk takes "+(taxed()>1?taxed()+" points":"a point")+" this term. ":"")+base;
 $("go").disabled=awaiting||!!g.ended;
}

/* ---------- the card ---------- */
function card(o){
 awaiting=true;
 const el=document.createElement("div");
 el.className="card "+(o.cls||"");
 el.innerHTML=`
  <div class="kicker"><span>${o.kicker||"THE TERM"}</span><span>${termName()} · age ${age()}</span></div>
  <h2>${fill(o.ti,1)}</h2>
  <div class="scene">${fill(o.sc,1)}</div>
  <div class="choices">${o.ch.map((c,i)=>{
    const ok=gateOK(c.gate);
    const sub = ok ? (c.why||"") : lockWhy(c.gate);
    return `<button data-c="${i}"${ok?"":" disabled"}${c.roll?' class="risky"':""}>${fill(c.t)}${
      sub?`<span class="why">${fill(sub)}</span>`:""}</button>`;
  }).join("")}</div>
  <div class="outcome" hidden></div>`;
 if(!o.append) $("cardslot").innerHTML="";
 else if($("cardslot").children.length) el.dataset.scroll=1;
 $("cardslot").appendChild(el);
 if(el.dataset.scroll&&el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"start"});

 el.querySelectorAll("button[data-c]").forEach(b=>b.onclick=()=>{
  const c=o.ch[+b.dataset.c];
  el.querySelectorAll("button").forEach(x=>x.disabled=true);
  b.style.borderColor="var(--gold)";
  const snap={R:g.R,K:g.K,N:g.N,P:g.P,S:g.S,E:g.E,B:g.B};
  let msg=c.say||"", bad=false;

  if(c.fn){ msg=c.fn()||msg; }
  else if(c.roll){
   const p=rollP(c.roll);
   if(Math.random()<p){ applyFx(c.roll.win.fx); msg=c.roll.win.say; }
   else { applyLoss(c.roll.lose.fx); msg=c.roll.lose.say; bad=true; }
  } else applyFx(c.fx);

  const out=el.querySelector(".outcome");
  if(msg){
   out.hidden=false;
   out.className="outcome"+(bad?" bad":"");
   out.innerHTML=fill(msg,1)+deltaStrip(snap);
  }
  if(pendingNext){
   const go=pendingNext; pendingNext=null;
   out.hidden=false;
   const nb=document.createElement("button");
   nb.className="go"; nb.textContent=o.nextLabel||"Continue";
   nb.onclick=()=>{ awaiting=false; $("cardslot").innerHTML=""; go(); };
   out.appendChild(nb);
  } else {
   awaiting=false;
  }
  render();
  if(!awaiting&&g.draws>0) nextCard();
 });
 render();
}
function deltaStrip(s){
 const nm={R:"research",K:"know-how",N:"network",P:"profile",E:"ego",B:"burnout"};
 const parts=[];
 for(const k in nm){
  const d=g[k]-s[k];
  if(Math.abs(d)>=1) parts.push(`<span class="${d>0?(k==="B"?"dn":"up"):(k==="B"?"up":"dn")}">${nm[k]} ${d>0?"+":"−"}${Math.abs(d).toFixed(0)}</span>`);
 }
 const ds=g.S-s.S;
 if(Math.abs(ds)>=1) parts.push(`<span class="${ds>0?"up":"dn"}">salary ${ds>0?"+":"−"}$${Math.abs(ds).toFixed(0)}k</span>`);
 return parts.length?`<div class="deltas">${parts.join("")}</div>`:"";
}
function lockWhy(ga){
 if(!ga) return "";
 if(ga.E&&ga.P) return "needs a certain amount of ego, and an audience";
 if(ga.K) return "needs institutional know-how "+ga.K+"+";
 if(ga.N) return "needs a network you don't have yet";
 if(ga.R) return "needs a research record you don't have yet";
 return "not yet";
}

/* ============================================================
   THE TURN
   ============================================================ */
function runTerm(){
 if(awaiting||g.ended) return;
 $("log").innerHTML="";
 $("cardslot").innerHTML="";

 if(g.skip>0){
  g.skip--; g.turn++;
  termBanner(); ledgerCard();
  g.Mshown=g.M;
  line("bad","— A term you were not present for."+(g.clock!==null?" The tenure clock is stopped.":""));
  if(g.turn>=80){ end("TIME"); return; }
  render(); return;
 }

 g.turn++;
 termBanner(); ledgerCard();
 const oldM=g.M;

 applyLevers();
 passivePass();
 const pubs=reviewPass();
 citationPass();

 /* promotion: assistant -> associate is the vote; associate -> full is a threshold */
 if(g.rank===3 && g.tenured && g.R+g.K>=110 && Math.random()<0.3){
  g.rank=4; g.S+=22; g.E=clamp(g.E+6,0,100);
  line("gold","▲ Promoted to Professor. The letter takes four months and the raise takes eighteen.");
 }
 /* administrative ladder */
 if(g.office>=1 && g.office<3 && g.K>=45+g.office*14 && Math.random()<0.22){
  g.office++; g.S+=26; g.B=clamp(g.B+8,0,100);
  line("gold","▲ "+OFFICES[g.office]+". A larger office and a calendar that belongs to someone else.");
 }
 if(g.mods.office1 && g.office===0){ g.office=1; delete g.mods.office1; }
 if(g.mods.move){ delete g.mods.move; g.uni="BELLWEATHER"; line("info","→ You move to "+uniName()+"."); }
 if(g.mods.teachfix){ delete g.mods.teachfix; g.tdebt=0; }

 g.alloc={write:0,net:0,pub:0,serv:0,teach:0,rest:0};
 g.Mshown=oldM;   /* the needle lags one beat */

 /* stage transitions */
 if(g.rank===1 && g.postdocEnd && g.turn>=g.postdocEnd){
  const dest = g.R>=42 ? pick(TOP.concat(MID)) : pick(MID.concat(LOW));
  startClock(dest, UNIS[dest].p>=0.8?7:6);
  line("gold","▲ Assistant Professor at "+uniName()+". The clock starts: "+g.clockLen+" years.");
 }

 /* hard stops */
 if(g.B>=100){ render(); collapse(); return; }
 if(g.turn>=80){ render(); end(timeUpKind()); return; }
 if(g.clock!==null){
  g.clock--;
  if(g.clock<=0){ render(); tenureVote(); return; }
 }

 if(g.rank===0 && g.turn>=6){ render(); placeStep(); return; }

 /* op-ed window after a viral collapse */
 if(g.mods.opedwindow && g.turn>=g.mods.opedwindow){
  delete g.mods.opedwindow; render(); card(OPED); return;
 }
 /* endgame rolls */
 if(octoberPass()){ render(); return; }
 if(presSearchReady() && !(g.mods.searchcool>g.turn) && Math.random()<0.40){ render(); presSearch(); return; }

 if(pubs.length) pubCard(pubs);          /* news, not one of the two */
 g.draws=2; g.shown=pubs.length>0;
 nextCard();
 render();
}
/* two events a term: a due storyline step gets the first slot if there is one */
/* a finished draft: where to send it. Not one of the term's two events.
   The paper has a true quality; what the player is told is the quality as
   seen through the ego, which is the one downside of a large one. */
const DRAFT_SC={
 weak:[
  "\u201c{paper}\u201d is done, in the sense that you have stopped. The result is there if you hold the page at an angle. Section 4 apologises for Section 3. The question is where to send it, and the honest answer is that it does not much matter.",
  "You have finished \u201c{paper}\u201d and you have read it through once, quickly, the way one checks a bill. It is fine. It is the word \u201cfine\u201d in a form that can be cited. The question is where.",
  "\u201c{paper}\u201d exists. The introduction promises a great deal and the conclusion, twenty pages later, has forgotten what. It could go out tomorrow. Where is a question you are asking yourself with less conviction than usual."
 ],
 solid:[
  "\u201c{paper}\u201d is finished, or finished enough. It has a result, an introduction that oversells the result, and a section 5 you hope nobody reads. The question is where. Aim high and it comes back, in a year, with three reports; aim low and it is in print by spring, where nobody will find it.",
  "\u201c{paper}\u201d is done. It is a proper paper: a question, an answer, a table that supports the answer, and a paragraph on limitations that is longer than you would like. Somebody will publish it. The question is who, and how long they will take.",
  "You send \u201c{paper}\u201d to a friend for comments and the comments come back kind, which is not the same as enthusiastic. It is solid. Solid is what most careers are made of, and nobody has ever put it on a poster."
 ],
 strong:[
  "\u201c{paper}\u201d is finished and it is good. You know it is good the way one knows a room is warm. The result is clean, the proof is short, and the one obvious objection is dealt with in a footnote that you are slightly too pleased with.",
  "\u201c{paper}\u201d is the best thing you have written this year, and you have said so to two people, which is one more than is wise. The introduction does not oversell it, for once. The question is where to send something you actually believe in.",
  "You finish \u201c{paper}\u201d at 1 a.m. and read it again at 7 and it is still good, which almost never happens. Where it goes will decide whether people find out."
 ],
 best:[
  "\u201c{paper}\u201d is, you are fairly sure, the best thing you have ever written. You have been fairly sure of this before. It is the kind of paper people write one of, and you have now written one of it, and the only question is which of the four journals will have the privilege.",
  "\u201c{paper}\u201d is finished and you have already, in your head, given the talk. The talk goes well. The question of where to send it feels, honestly, like a formality, and you notice that you have used the word \u201chonestly\u201d to yourself, which is usually a sign.",
  "There are papers and there is \u201c{paper}\u201d. You have shown it to nobody, because nobody would understand it yet. The top four exist for exactly this. Everything below them would be a kind of insult."
 ]
};
const DRAFT_SAY={
 "A+":["It goes to one of the four. The submission fee is $250. The editor\u2019s automated reply is warmer than anything the referees will write.",
       "Out to the top. The website says a first decision \u201ctypically\u201d takes four months, and the word \u201ctypically\u201d has never done more work in its life.",
       "Submitted. You check the status page that evening, and the next, and it says \u201cwith editor\u201d for a length of time that will teach you something about yourself."],
 "A": ["A real journal. The editor knows your advisor, which will help or will not, depending on which paper of your advisor\u2019s the editor is thinking of.",
       "It goes to a good field journal, where the referees will at least have read the literature it is in. This is more than can be said for the top four, and it is also why they are the top four.",
       "Sent. The acknowledgement is signed by a managing editor whose entire job is this acknowledgement, and who does it well."],
 "B": ["It will be published. It will be published in the way a stone is dropped into a well: the sound arrives, faintly, and that is all.",
       "Out, to a journal that will take it. The decision will come before you have quite stopped thinking about the paper, which is the only mercy the process offers.",
       "It goes somewhere quick. In eighteen months it will be a line, and the line will be read by search committees at exactly the speed at which they read lines."]
};
function submitCard(){
 const pp=g.nextPaper=g.nextPaper||makePaper();
 const q=clamp(g.R*0.72+ri(-14,14)+(g.mods.bigpaper?18:0),5,100);
 const seen=q+(g.E-50)*0.4+ri(-5,5);            /* the paper as the ego reports it */
 const band= seen<38?"weak": seen<58?"solid": seen<76?"strong":"best";
 const vain=g.E>=65;
 card({append:true,kicker:"THE DRAFT",ti: band==="best"?"Where it belongs": band==="weak"?"Where to put it":"Where to send it",
  sc:pick(DRAFT_SC[band]),
  ch:[
   {t:"The top four.",why: vain?"where it belongs":"a year or more; likely to come back",fn(){ submitPaper({target:"A+",lag:[5,9],q0:q,vain}); return pick(DRAFT_SAY["A+"]); }},
   {t:"A good field journal.",why: vain?"beneath it, arguably":"the sensible choice, which is the problem with it",fn(){ submitPaper({target:"A",lag:[4,7],q0:q}); return pick(DRAFT_SAY["A"]); }},
   {t:"Somewhere quick.",why: vain?"unthinkable, but listed":"in print by spring",fn(){ submitPaper({target:"B",lag:[2,3],q0:q}); return pick(DRAFT_SAY["B"]); }}
  ]});
}
function nextCard(){
 if(g.ended||awaiting) return;
 if(g.pendingSubmit>0){ g.pendingSubmit--; submitCard(); render(); return; }
 if(g.draws<=0){ if(!g.shown) quietCard(); render(); return; }
 g.draws--;
 let e=(g.draws===1)? dueArcStep() : null;
 if(!e) e=drawEvent();
 if(!e){ nextCard(); return; }
 g.seen[e.id]=(g.seen[e.id]||0)+1; g.shown=true;
 startArcs(e);
 const n=g.seen[e.id];
 const sc=(e.alt&&n>1)? e.alt[Math.min(n-2,e.alt.length-1)] : e.sc;
 if(e.auto){ autoCard(e,sc); nextCard(); }
 else card({kicker:"THE TERM",ti:e.ti,sc,ch:e.ch,append:true});
 render();
}
function timeUpKind(){
 if(g.vow==="NOBEL"&&g.won.PRESALT) return "PRES_INSTEAD";
 if(g.vow==="BOTH"){
  if(g.won.NOBEL&&g.won.PRES) return "BOTH";
  if(g.won.NOBEL) return "BOTH_HALF_N";
  if(g.won.PRES)  return "BOTH_HALF_P";
 }
 if(g.won.PRESALT) return "PRES_MISS";
 return g.shortlists?"NOBEL_MISS":"TIME";
}

/* ============================================================
   OPENING
   ============================================================ */
function boot(){
 newGame(); ledgerEl=null;
 $("log").innerHTML="";
 $("termslot").innerHTML="";
 render();
 card({
  cls:"gold", kicker:"THE VOW", ti:"What is it for?",
  sc:"You are twenty-five. You have a dissertation that is nearly finished, an advisor who has not read the third chapter, and forty years.<br><br>Everyone in this profession is doing it for something. Most of them will not say what. <em>Say what.</em>",
  ch:[
   {t:"The Nobel Prize.",why:"you want the call",fn(){ g.vow="NOBEL"; pendingNext=phdStart; return "Said out loud, at twenty-five, it sounds absurd. You will not say it out loud again for thirty years."; }},
   {t:"The presidency of Harwich College.",why:UNIS.HARWICH.blurb,fn(){ g.vow="PRES"; g.target="HARWICH"; pendingNext=phdStart; return "The honest version of the ambition, which almost nobody gives out loud. Note that you have named a building and not a rank: other places will offer you their presidencies, and they will not count."; }},
   {t:"Both.",why:"what else?",fn(){ g.vow="BOTH"; g.target="HARWICH"; pendingNext=phdStart; return "Both. Note that the clock does not adjust for this, and neither does the body."; }}
  ]
 });
}
function phdStart(){
 g.uni=pick(TOP.concat(MID)); g.rank=0; g.S=24;
 card({
  cls:"gold", kicker:"THE PROGRAM", ti:"Nearly done",
  sc:"You are twenty-five, most of the way through a PhD at <em>"+uniName()+"</em> under {advisor}, who has not read the third chapter. "+UNIS[g.uni].blurb+" A stipend of $24k, a desk in a room with four other desks, and a dissertation in three chapters of which two exist.<br><br>Three years of it remain before the market. What you do with them will not appear on your CV, and will decide most of what follows.",
  ch:[{t:"Get to work.",why:"six terms until the job market",
    fn(){ return "The room has a kettle and a whiteboard nobody erases. Somebody's job market paper is on it, from a year that has passed.<br><br><em>Now spend the term. Below, put your five points into the six things a term can go on — research, networking, media, service, teaching, recovery — and run it. Every term, the same five points. It is never enough, and it never will be.</em>"; }}]
 });
}
function placeStep(){
 const post=pick(TOP), tt=pick(MID.filter(u=>u!==g.uni));
 const home=post===g.uni;
 const postTxt = home
  ? "A postdoc at <em>"+UNIS[post].n+"</em>, which is to say they offer to keep you: same building, a slightly better desk, two years, no teaching, no security, and an address that does roughly a third of the work of a career and is already on your CV."
  : "A postdoc at <em>"+UNIS[post].n+"</em> — two years, no teaching, no security, and an address that does roughly a third of the work of a career.";
 card({
  append:true,cls:"gold",kicker:"THE MARKET",ti:"Two offers",
  sc:"The market has produced exactly two things. "+postTxt+" Or a tenure-track line at <em>"+UNIS[tt].n+"</em> — seven years on the clock, starting now.<br><br>Everyone will tell you there is an obvious answer. They will not agree about which.",
  ch:[
   {t: home? "Stay on at "+UNIS[post].n+" as a postdoc." : "The postdoc at "+UNIS[post].n+".",why:(home?"They know you, which cuts both ways":UNIS[post].blurb)+" — two years, and no clock.",fn(){
     g.uni=post; g.rank=1; g.S=58; g.flags.POSTDOC=1; g.postdocEnd=g.turn+4;
     return home ? "Two more years in the same building. The desk is by the window now. Nobody asks what you teach, because you do not, and nobody asks what you are working on, because they think they know."
                 : "Two years in a building where the coffee is bad and the corridor conversations are not. Nobody asks what you teach, because you do not."; }},
   {t:"The tenure-track line at "+UNIS[tt].n+".",why:UNIS[tt].blurb+" — seven years, starting now.",fn(){
     startClock(tt,7);
     return "An office with your name on a card in a slot, which is how they indicate that the name is provisional. The clock starts this September."; }}
  ]
 });
}

/* ---------- the record, in full ---------- */
function openCV(kind){
 const tierCls=t=>"tierpill t-"+(t==="A+"?"Aplus":t);
 let title, sub, rows;
 if(kind==="queue"){
  title="Under review"; sub=g.queue.length+" out";
  rows=g.queue.slice().sort((a,b)=>a.due-b.due).map(p=>`<div class="cvrow"><span class="${tierCls(p.tier)}">${p.tier}</span>
   <div><div class="ti">${p.ti}</div><div class="meta"><i>${p.jn}</i> \u00b7 ${p.rounds>=9?"decided, not yet in print":p.rounds?"revise and resubmit":"with the referees"}</div></div>
   <div></div></div>`);
 } else {
  const list=(kind==="top"? g.papers.filter(p=>p.tier==="A+") : g.papers.slice()).sort((a,b)=>b.pub-a.pub);
  title= kind==="top" ? "The top four" : "Published";
  sub= list.length+(kind==="top"?" in the Quarterly, Metrica, the Review or the American":" papers")+" \u00b7 "+Math.round(g.cites).toLocaleString()+" citations \u00b7 h-index "+hIndex();
  rows=list.map(p=>`<div class="cvrow"><span class="${tierCls(p.tier)}">${p.tier}</span>
   <div><div class="ti">${p.ti}</div><div class="meta"><i>${p.jn}</i> \u00b7 age ${25+Math.floor(p.pub/2)}${p.f?" \u00b7 "+p.f:""}</div></div>
   <div class="ct">${Math.round(p.c)}<small>cites</small></div></div>`);
 }
 $("ovl").innerHTML=`<div class="sheet" role="dialog" aria-label="${title}">
  <h2>${title}</h2><div class="sub">${sub}</div>
  <div class="cvlist">${rows.length?rows.join(""):'<div class="empty">Nothing yet. The drawer is where about forty percent of the field\u2019s best work lives.</div>'}</div>
  <button class="go close" id="cvclose">Back to the term</button></div>`;
 $("ovl").hidden=false;
 $("cvclose").onclick=closeCV;
}
function openBio(key){
 const b=BIOS[key]; if(!b) return;
 $("ovl").innerHTML=`<div class="sheet" role="dialog" aria-label="${CAST[key]}">
  <h2>${CAST[key]}</h2><div class="sub">${b.role}</div>
  <div class="bio">${b.bio}</div>
  <button class="go close" id="cvclose">Back to the term</button></div>`;
 $("ovl").hidden=false;
 $("cvclose").onclick=closeCV;
}
function closeCV(){ $("ovl").hidden=true; $("ovl").innerHTML=""; }
$("cardslot").addEventListener("click",ev=>{ const w=ev.target.closest(".who"); if(w) openBio(w.dataset.who); });
$("cv").addEventListener("click",ev=>{ const b=ev.target.closest("[data-cv]"); if(b) openCV(b.dataset.cv); });
$("ovl").addEventListener("click",ev=>{ if(ev.target===$("ovl")) closeCV(); });
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"&&!$("ovl").hidden) closeCV(); });

/* wiring */
$("levers").addEventListener("click",ev=>{
 const b=ev.target.closest("button"); if(!b) return;
 const k=b.dataset.l, d=+b.dataset.d;
 if(d>0&&spent()>=budget()) return;
 g.alloc[k]=Math.max(0,g.alloc[k]+d);
 render();
});
$("go").onclick=runTerm;


$("ver").textContent="v"+VERSION;
boot();
</script>
