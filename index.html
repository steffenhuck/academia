<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Discipline</title>
<meta name="description" content="An academic career, 25 to 65. Declare your vow — the Nobel, a presidency, or both — and spend forty years finding out what the field actually counts.">
<script data-goatcounter="https://steffenhuck.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14131A; --panel:#1E1D27; --panel2:#262430; --edge:#332F42;
  --gold:#F0B429; --goldsoft:#7A5C17; --rose:#FF5A6B; --mint:#3ED9A4;
  --sky:#7BA7FF; --plum:#B98BFF; --chalk:#F4F1E9; --dim:#9A94AC; --dimmer:#6B6579;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--chalk);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5;
  background-image:radial-gradient(circle at 50% 0%, #201E2B 0%, var(--ink) 60%);
  background-attachment:fixed;
  min-height:100%;
}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 120px;padding-left:16px;padding-right:16px}
.disp{font-family:"Fraunces","Iowan Old Style",Georgia,serif}
.mono{font-family:"Space Mono",ui-monospace,monospace}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- masthead ---------- */
header.mast{
  border:2px solid var(--edge); border-radius:18px; background:var(--panel);
  padding:16px 18px 14px; margin-bottom:14px; position:relative; overflow:hidden;
}
header.mast::after{
  content:""; position:absolute; right:-40px; top:-60px; width:180px; height:180px;
  border-radius:50%; background:radial-gradient(circle,rgba(240,180,41,.16),transparent 65%);
}
header.mast h1{
  font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:44px; line-height:.92;
  margin:0; letter-spacing:-.02em; text-wrap:balance;
}
header.mast .tag{
  font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  color:var(--dim); margin-top:8px;
}
.vowbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.vowchip{
  border:1.5px solid var(--goldsoft); background:rgba(240,180,41,.09); color:var(--gold);
  border-radius:999px; padding:5px 12px; font-size:12px; font-weight:800;
  letter-spacing:.06em; text-transform:uppercase;
}
.clockchip{
  border:1.5px solid var(--edge); background:var(--panel2); color:var(--chalk);
  border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700;
}
.clockchip.hot{border-color:var(--rose);color:var(--rose)}

/* ---------- the ladder ---------- */
.ladder{display:flex;gap:4px;margin:0 0 6px}
.ladder i{
  flex:1; height:8px; border-radius:4px; background:#2A2835; border:1px solid #37344A;
  transition:background .4s,height .3s;
}
.ladder i.done{background:var(--goldsoft);border-color:var(--goldsoft)}
.ladder i.now{background:var(--gold);border-color:var(--gold);height:13px}
.rankline{
  font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--dim); margin:0 0 14px; display:flex; justify-content:space-between; gap:10px;
}
.rankline b{color:var(--chalk)}

/* ---------- stat board ---------- */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
@media(max-width:460px){.board{grid-template-columns:repeat(2,1fr)}}
.tile{
  background:var(--panel); border:1.5px solid var(--edge); border-radius:14px;
  padding:9px 10px 10px; min-width:0;
}
.tile .lbl{
  font-size:9.5px; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
  color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tile .v{font-size:27px;font-weight:800;line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .track{height:5px;border-radius:3px;background:#2C2937;margin-top:7px;overflow:hidden}
.tile .track b{display:block;height:100%;border-radius:3px;transition:width .5s}
.tile.alarm{border-color:var(--rose)}
.tile.alarm .v{color:var(--rose)}
.tile.gauge{display:flex;flex-direction:column;justify-content:space-between}
.needlebox{display:flex;justify-content:center;margin-top:2px}
.needlebox svg{width:100%;max-width:120px;height:46px}
.needle{transition:transform 1.1s cubic-bezier(.4,1.5,.5,1);transform-origin:50px 40px}

/* ---------- CV panel ---------- */
.cv{
  background:var(--panel); border:1.5px solid var(--edge); border-radius:16px;
  padding:12px 14px 13px; margin-bottom:12px;
}
.cvhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.cvbig{font-size:40px;font-weight:800;line-height:.95;color:var(--gold);font-variant-numeric:tabular-nums}
.cvbig small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.cvsub{font-size:13px;color:var(--dim);font-weight:600}
.cvsub b{color:var(--chalk)}
.papers{margin-top:10px;display:flex;flex-direction:column;gap:4px;max-height:132px;overflow-y:auto}
.papers:empty{display:none}
.prow{font-family:"Space Mono",monospace;font-size:11.5px;color:var(--dim);display:flex;gap:8px;align-items:baseline}
.prow .ti{color:var(--chalk);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .jn{font-style:italic}
.prow .ct{color:var(--gold);font-weight:700;white-space:nowrap}
.tierpill{
  font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;letter-spacing:.06em;
  border:1px solid currentColor;white-space:nowrap
}
.t-Aplus{color:var(--gold)} .t-A{color:var(--mint)} .t-B{color:var(--sky)} .t-C{color:var(--dimmer)}
.wip{font-family:"Space Mono",monospace;font-size:11.5px;color:var(--dimmer);margin-top:8px}

/* ---------- the card ---------- */
.card{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:2px solid var(--edge); border-radius:18px; padding:16px 17px 17px; margin-bottom:12px;
  animation:rise .45s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .card{animation:none} .needle{transition:none} .tile .track b{transition:none}
  .termbar{animation:none} .clockchip.tick{animation:none}
}
.termbar{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin:6px 0 11px;padding:9px 2px 0;border-top:2.5px solid var(--gold);
  animation:sweep .5s cubic-bezier(.2,.9,.3,1) both;
}
.termbar .tt{font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:21px;letter-spacing:-.01em}
.termbar .ta{font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);text-align:right}
@keyframes sweep{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.clockchip.tick{animation:tickflash .7s ease-out}
@keyframes tickflash{0%{background:var(--gold);color:#1A1509;border-color:var(--gold)}100%{}}
.card.quiet{border-color:#2E2B3A;background:var(--panel)}
.card.quiet .scene{color:var(--dim);font-style:italic}
.card.gold{border-color:var(--gold);background:linear-gradient(180deg,#2A2418,var(--panel))}
.card.grim{border-color:var(--rose)}
.kicker{
  font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
  display:flex;justify-content:space-between;gap:10px;
}
.kicker span:last-child{color:var(--dimmer);letter-spacing:.1em}
.card h2{
  font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:29px; line-height:1.03;
  margin:7px 0 9px; letter-spacing:-.015em; text-wrap:balance;
}
.scene{font-size:15.5px;line-height:1.55;color:#DAD5E4}
.scene em{color:var(--chalk)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:13px}
.choices button{
  text-align:left; background:#23212E; color:var(--chalk);
  border:1.5px solid #3D3950; border-radius:12px; padding:11px 13px;
  font-size:15px; font-weight:700; line-height:1.35; cursor:pointer;
  transition:border-color .15s,background .15s,transform .06s;
}
.choices button:hover:not(:disabled){border-color:var(--gold);background:#2A2534}
.choices button:active:not(:disabled){transform:scale(.99)}
.choices button:disabled{opacity:.45;cursor:not-allowed}
.choices button .why{
  display:block;font-size:12.5px;font-weight:500;color:var(--dim);
  margin-top:5px;line-height:1.42;letter-spacing:.01em
}
.choices button.risky{border-color:#6B3A44}
.choices button.risky:hover:not(:disabled){border-color:var(--rose)}
.outcome{
  margin-top:12px;padding-top:11px;border-top:1px dashed #413D55;
  font-size:14.5px;line-height:1.5;color:var(--mint);font-weight:600;
}
.outcome.bad{color:var(--rose)}
.deltas{
  margin-top:8px;font-family:"Space Mono",monospace;font-size:11.5px;color:var(--dim);
  display:flex;flex-wrap:wrap;gap:4px 10px
}
.deltas .up{color:var(--mint)} .deltas .dn{color:var(--rose)}

/* ---------- vote tally ---------- */
.tally{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 4px}
.vote{
  width:30px;height:38px;border-radius:5px;border:1.5px solid var(--edge);background:#23212E;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
}
.vote.yes{border-color:var(--mint);color:var(--mint)}
.vote.no{border-color:var(--rose);color:var(--rose)}
.votenote{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.45}
.votenote b{color:var(--rose)}

/* ---------- the desk ---------- */
.desk{
  background:var(--panel); border:2px solid var(--edge); border-radius:18px;
  padding:13px 14px 14px; margin-bottom:12px;
}
.deskhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.deskhead h3{
  font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:19px;margin:0;letter-spacing:-.01em
}
.pts{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.04em}
.pts b{color:var(--gold);font-size:15px}
.levers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:400px){.levers{grid-template-columns:repeat(2,1fr)}}
.lever{background:#23212E;border:1.5px solid #342F45;border-radius:12px;padding:8px 7px 7px;text-align:center}
.lever.lit{border-color:var(--gold);background:#2A2418}
.lever .ln{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.lever.lit .ln{color:var(--gold)}
.lever .dots{font-size:13px;letter-spacing:2px;color:var(--gold);height:19px;line-height:19px}
.lever .dots.none{color:#403B52}
.lever .pm{display:flex;gap:5px;justify-content:center}
.lever .pm button{
  width:30px;height:28px;border-radius:8px;border:1.5px solid #3D3950;background:#1B1A24;
  color:var(--chalk);font-size:16px;font-weight:800;cursor:pointer;line-height:1;
}
.lever .pm button:disabled{opacity:.3;cursor:not-allowed}
.hint{font-size:11.5px;color:var(--dimmer);margin-top:9px;line-height:1.45}
.go{
  width:100%;margin-top:11px;padding:14px;border-radius:13px;border:none;cursor:pointer;
  background:var(--gold);color:#1A1509;font-size:16px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;transition:filter .15s;
}
.go:hover:not(:disabled){filter:brightness(1.08)}
.go:disabled{background:#3A3648;color:var(--dimmer);cursor:not-allowed}

/* ---------- log ---------- */
#log{display:flex;flex-direction:column;gap:3px;margin-bottom:14px}
.line{
  font-family:"Space Mono",monospace;font-size:11.5px;line-height:1.5;color:var(--dim);
  padding-left:11px;border-left:2px solid #322F42;
}
.line.good{color:var(--mint);border-color:var(--mint)}
.line.bad{color:var(--rose);border-color:var(--rose)}
.line.gold{color:var(--gold);border-color:var(--gold)}

/* ---------- enemies ---------- */
.foes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.foes:empty{display:none}
.foe{
  font-size:11px;font-weight:700;border:1.5px solid #5B3742;background:rgba(255,90,107,.08);
  color:#FF8C99;border-radius:999px;padding:4px 10px;
}

/* ---------- ending ---------- */
.final{margin-top:13px;padding:13px;border-radius:12px;background:#191823;border:1.5px solid var(--edge)}
.finalbig{font-size:46px;font-weight:800;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.finalbig small{display:block;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:5px}
.finalrow{font-family:"Space Mono",monospace;font-size:12px;color:var(--dim);margin-top:11px;line-height:1.7}
.finalrow b{color:var(--chalk)}
.remembers{font-size:13.5px;color:var(--dim);font-style:italic;margin-top:11px;line-height:1.5}

/* ---------- footer ---------- */
footer{text-align:center;padding:6px 0 4px}
footer a{color:var(--dimmer);font-style:italic;font-size:14px;text-decoration:none}
footer a:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">

<header class="mast">
  <h1>The Discipline</h1>
  <div class="tag">an academic career &middot; 25 to 65</div>
  <div class="vowbar">
    <span class="vowchip" id="vowchip">no vow yet</span>
    <span class="clockchip" id="agechip">age 25</span>
    <span class="clockchip" id="tenurechip" hidden>tenure clock</span>
  </div>
</header>

<div class="ladder" id="ladder"></div>
<div class="rankline"><span id="rank">&mdash;</span><span id="place"></span></div>

<div class="board" id="board"></div>
<div class="foes" id="foes"></div>

<div class="cv" id="cv"></div>

<div id="termslot"></div>
<div id="cardslot"></div>

<div class="desk" id="desk" hidden>
  <div class="deskhead">
    <h3>The term ahead</h3>
    <div class="pts">points left <b id="left">5</b></div>
  </div>
  <div class="levers" id="levers"></div>
  <div class="hint" id="hint"></div>
  <button class="go" id="go">Run the term</button>
</div>

<div id="log"></div>

<footer><a href="https://steffenhuck.github.io">steffen huck</a></footer>
</div>

<script>
'use strict';

/* ============================================================
   THE DISCIPLINE — v0 engine
   80 turns = 2 terms x 40 years, age 25 to 65.
   ============================================================ */

/* ---------- institutions ---------- */
const UNIS={
 HARWICH  :{n:"Harwich College",               s:"Harwich",     p:1.00, note:"est. 1638",
  blurb:"Founded 1638, older than the country, and never once described as up-and-coming."},
 THROMBER :{n:"Thromber University",           s:"Thromber",    p:0.97, note:"endowed 1889",
  blurb:"Endowed 1889 on a patent for a bottle stopper. The largest endowment in the world, and nobody has ever found this odd."},
 PELHAM   :{n:"Pelham College",                s:"Pelham",      p:0.94, note:"smaller, and aware of it",
  blurb:"Smaller than Harwich and insufferable about it. The faculty club has a dress code and enforces it."},
 CALDERON :{n:"Calderon University",           s:"Calderon",    p:0.91, note:"good weather",
  blurb:"Good weather, bad seminars, and three people who are going to win this thing before you do."},
 CUTHBERTS:{n:"St Cuthbert\u2019s College",       s:"St Cuthbert\u2019s", p:0.89, note:"genuinely medieval",
  blurb:"Genuinely medieval. There is sherry, and a statute from 1451 that nobody has got round to repealing."},
 OSTRANDER:{n:"Ostrander State University",    s:"Ostrander",   p:0.62, note:"serious, unmentioned",
  blurb:"A serious department that nobody outside it mentions and everybody inside it defends."},
 BELLWEATHER:{n:"Bellweather University",      s:"Bellweather", p:0.57, note:"two good macro people",
  blurb:"Two good macro people, one grudge of long standing, and a building named after a bank that failed."},
 FENWICK  :{n:"Fenwick College",               s:"Fenwick",     p:0.53, note:"acting chair, nine years",
  blurb:"The chair has been acting for nine years and has come to prefer it that way."},
 BOWHEAD  :{n:"Bowhead State University",      s:"Bowhead",     p:0.30, note:"enrollment 14,000",
  blurb:"Enrollment fourteen thousand, parking ample, and a football program that cannot be discussed."},
 VERONA   :{n:"Lake Verona Polytechnic Institute", s:"Lake Verona", p:0.24, note:"formerly a teachers\u2019 college",
  blurb:"Formerly a teacher training college \u2014 and formerly is doing a great deal of work in that sentence."},
 CRANMOOR :{n:"Cranmoor A&M University",       s:"Cranmoor",    p:0.27, note:"strong in agronomy",
  blurb:"Strong in agronomy. Genuinely, unironically strong in agronomy."}
};
const TOP=["HARWICH","THROMBER","PELHAM","CALDERON","CUTHBERTS"];
const MID=["OSTRANDER","BELLWEATHER","FENWICK"];
const LOW=["BOWHEAD","VERONA","CRANMOOR"];

/* ---------- journals ---------- */
const JOURNALS={
 "A+":{w:9.0, n:["the Quarterly","Metrica","the Review","the American"]},
 "A" :{w:3.6, n:["the Journal of Economic Theory and Practice","the Economic Journal of the Midwest"]},
 "B" :{w:1.4, n:["Regional Science and Public Choice","the Bulletin of Applied Economics"]},
 "C" :{w:0.4, n:["the Journal of Applied Modelling","the International Journal of Economics and Business Research"]}
};

/* ---------- paper titles ---------- */
const T1=["Cheap Talk with","Optimal Taxation under","Learning and Forgetting in","Strategic Delay in",
 "Identification of","A Note on","Reputation and","Dynamic Inconsistency in","Robust Inference for",
 "Information Design in","The Welfare Cost of","Herding in","Commitment and","Bounded Rationality in",
 "Costly Signalling in","Matching under","Contagion in","Time Preference and","The Political Economy of"];
const T2=["Costly Listening","Heterogeneous Regret","Thin Markets","Committee Voting","Peer Effects",
 "Search Frictions","Sticky Prices","the Labour Share","Repeated Games","Public Goods Provision",
 "Sovereign Default","Networks","Second-Price Auctions","Household Portfolios","the Phillips Curve",
 "Intergenerational Mobility","Mechanism Design","Incomplete Contracts","Rational Inattention"];
const T3=["","","","",": Evidence from Denmark",": Evidence from a Field Experiment",": A Structural Approach",
 " Revisited",": Theory and Evidence",": A Reassessment",": Evidence from Administrative Data",
 ": A Comment"];

/* ---------- people (for enemies) ---------- */
const FIRST=["Anneke","Gerhard","Priya","Tomas","Marguerite","Dov","Linnea","Rafael","Hyun-woo",
 "Beatrix","Callum","Ingrid","Emeka","Sylvie","Bertram","Noor","Lars","Cecilia"];
const LAST=["Vandermeer","Ostrowski","Balakrishnan","Feld","Auerbach","Nkemdirim","Halvorsen","Petrucci",
 "Ashworth","Dubois","Reinholt","Sarkisian","Leung","Whitcombe","Maravall","Oyelaran"];
const GRUDGE=[
 ["you rewrote their section without asking","referee"],
 ["your referee report used the word “unserious”","referee"],
 ["you took the credit at the NBER meeting","committee"],
 ["you did not cite them, twice","referee"],
 ["you told a room they had confused correlation with a career","committee"],
 ["you declined to write their tenure letter","vote"],
 ["you were charming to their spouse and rude to them","vote"],
 ["you called their identification strategy “brave” in public","search"],
 ["you got the job they were shortlisted for","search"],
 ["you laughed during their job talk","vote"]
];

/* ---------- levers ---------- */
const LEVERS=[
 ["write","Write",  "research strength, and pages toward the next paper. There is no lever for thinking."],
 ["net","Network",  "coauthors, committees, the people who remember your name"],
 ["pub","Publicize","op-eds, podcasts, the circuit"],
 ["serv","Service", "institutional know-how — budgets, senates, retreats"],
 ["teach","Teaching","preparation. Students notice. The system does not."],
 ["rest","Rest",    "the only thing that lowers burnout"]
];
const RANKS=["PhD Student","Postdoc","Assistant Professor","Associate Professor","Professor"];
const OFFICES=["","Department Chair","Dean","Provost","President"];

const sig=x=>1/(1+Math.exp(-x));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

/* ============================================================
   STATE
   ============================================================ */
let g=null, awaiting=false, pendingNext=null;

function newGame(){
 g={
  turn:0, rank:0, office:0, uni:null, vow:null, target:null,
  R:14, K:8, N:10, P:4, S:0, E:35, B:8, M:12, Mshown:12,
  papers:[], queue:[], wip:0, cites:0,
  enemies:[], flags:{}, seen:{}, jit:{}, mods:{},
  clock:null, clockLen:0, tenured:false, denials:0, postdocEnd:null, presSince:null,
  tdebt:0, shortlists:0, lostYears:0, collapses:0,
  alloc:{write:0,net:0,pub:0,serv:0,teach:0,rest:0},
  skip:0, ended:null, nobelDead:false, presDead:false, won:{}
 };
 for(const e of EVENTS) g.jit[e.id]=Math.random()*1.1-0.55;
}

const age      = ()=>25+Math.floor(g.turn/2);
const termName = ()=>(g.turn%2? "Spring term":"Fall term");
const prestige = ()=>g.uni?UNIS[g.uni].p:0.5;
const uniName  = ()=>g.uni?UNIS[g.uni].n:"—";
const uniShort = ()=>g.uni?UNIS[g.uni].s:"—";
const budget   = ()=>5+(g.rank>=4?1:0)+(g.office>=2?1:0);
const spent    = ()=>Object.values(g.alloc).reduce((a,b)=>a+b,0);
const aplus    = ()=>g.papers.filter(p=>p.tier==="A+").length;
const title    = ()=>g.office? OFFICES[g.office] : (g.flags.CHAIR? "Distinguished Professor":RANKS[g.rank]);

function hIndex(){
 const c=g.papers.map(p=>Math.floor(p.c)).sort((a,b)=>b-a);
 let h=0; for(let i=0;i<c.length;i++) if(c[i]>=i+1) h=i+1;
 return h;
}
function salaryTxt(){ return "$"+Math.round(g.S)+"k"; }

/* ---------- THE PHD ---------- */
{id:"P1",ti:"The Advisor",b:[0,0],ex:{base:1},

{id:"P2",ti:"The Question",b:[0,1],ex:{base:1},
 sc:"Third row, Tuesday seminar. You have a real question — the identification leans on an assumption the speaker slid past in nineteen seconds. You also have, in the same instant, a much showier question you could ask instead.",

 {t:"Ask the showy one.",roll:{stat:"N",pivot:28,
   win:{fx:{N:6,E:4},say:"Laughter in the right register. Two people ask your name afterwards. The identification problem remains, unmolested, forever."},
   lose:{fx:{E:-4},say:"It lands in silence. The speaker answers it in four words. You spend the rest of the seminar composing an email you will not send."}}}]},

/* ============================================================
   PAPERS
   ============================================================ */
function makeTitle(){ return pick(T1)+" "+pick(T2)+pick(T3); }

function submitPaper(){
 const q=clamp(g.R*0.72+ri(-14,14)+(g.mods.bigpaper?18:0), 5, 100);
 let z=-1.9+3.0*q/100+0.9*g.N/100+1.1*prestige()+0.5*g.M/100;
 if(g.flags.CARTEL)z+=0.35;
 const r=Math.random(), tier = r<sig(z)-0.42 ? "A+" : r<sig(z)+0.06 ? "A" : r<sig(z)+0.52 ? "B" : "C";
 const lag = tier==="A+"? ri(5,9) : tier==="A"? ri(4,7) : ri(2,5);
 g.queue.push({ti:makeTitle(), tier, q, due:g.turn+lag, rounds:0});
 line("info","✉ Submitted: “"+g.queue[g.queue.length-1].ti+"” — out for review.");
 if(g.mods.bigpaper) delete g.mods.bigpaper;
}

function reviewPass(){
 for(const s of g.queue.slice()){
  if(s.due>g.turn) continue;
  if(s.rounds<1 && Math.random()<0.45){
   s.rounds++; s.due=g.turn+ri(2,4);
   line("info","↻ R&R at "+pick(JOURNALS[s.tier].n)+": three referees, one of whom wants a different paper.");
   continue;
  }
  g.queue.splice(g.queue.indexOf(s),1);
  const jn=pick(JOURNALS[s.tier].n);
  g.papers.unshift({ti:s.ti,jn,tier:s.tier,q:s.q,c:0,pub:g.turn,yr:Math.floor(g.turn/2)+1});
  const pill=s.tier==="A+"?"gold":"good";
  line(pill,"★ Published in "+jn+": “"+s.ti+"”");

function citationPass(){

 let gained=0;

  const a=g.turn-p.pub;

  const inc = JOURNALS[p.tier].w * (0.32+0.68*p.q/100) * matthew * decay * (0.65+Math.random()*0.7);
  p.c+=inc; gained+=inc;
 }

}

 } else { g.tdebt+=g.rank>=1?1:0.5; }
 if(a.rest){ g.B=clamp(g.B-a.rest*9,0,100); line("info","\u263e Rest: burnout risk \u2212"+(a.rest*9)); }
 if(g.wip>=100){ g.wip-=100; submitPaper(); }

function passivePass(){
 /* burnout accrues */
 let load = 2.6 + g.rank*0.9 + g.office*1.7 + g.queue.length*0.8;
 if(g.vow==="BOTH") load*=1.35;
 if(g.clock!==null) load+=1.6;
 g.B=clamp(g.B+load,0,100);
 /* momentum decays */
 g.M=clamp(g.M*0.955,0,100);
 /* ego drifts down without feeding */
 g.E=clamp(g.E-0.4,0,100);
 /* profile fades */
 if(g.P>12) g.P=clamp(g.P-g.P*0.028,0,100);
 /* nor does anything else hold on its own: the field moves on, the contacts
    retire, the budget model changes under you */
 g.R=clamp(g.R-g.R*0.011,0,100);
 g.K=clamp(g.K-g.K*0.010,0,100);
 g.N=clamp(g.N-g.N*0.013,0,100);
 /* public profile taxes research */
 if(g.P>70){ g.R=clamp(g.R-0.8,0,100); if(Math.random()<0.28) line("bad","⬇ A colleague, to another colleague: “hasn't published in years, but does love a microphone.”"); }
 /* salary creep */
 g.S+=0.35+prestige()*0.5+g.office*0.6;
}

function terms(){
 return {
  base:1,
  lowMom:1-g.M/100, highMom:g.M/100,
  highR:g.R/100, highK:g.K/100, highP:g.P/100, highB:g.B/100,
  lowS:clamp((45-g.S)/45,0,1),
  tdebt:clamp(g.tdebt/10,0,1),
  spec:g.flags.SPEC?1:0
 };
}
function gateOK(ga){
 if(!ga) return true;
 if(ga.R&&g.R<ga.R) return false;
 if(ga.K&&g.K<ga.K) return false;
 if(ga.N&&g.N<ga.N) return false;
 if(ga.P&&g.P<ga.P) return false;
 if(ga.E&&g.E<ga.E) return false;
 if(ga.flag&&!g.flags[ga.flag]) return false;
 return true;
}
function drawEvent(){
 const t=terms(), pool=[];
 for(const e of EVENTS){
  if(g.rank<e.b[0]||g.rank>e.b[1]) continue;
  if(e.once&&g.seen[e.id]) continue;
  if(!gateOK(e.ga)) continue;
  let s=g.jit[e.id]||0;
  for(const k in e.ex) s+=e.ex[k]*(t[k]||0);
  if(e.tr){
   if(g.vow==="BOTH") s+=0.25;
   else if((e.tr==="nobel"&&g.vow==="NOBEL")||(e.tr==="pres"&&g.vow==="PRES")) s+=0.85;
   else s-=1.1;
  }
  if(e.once) s+=1.2;
  s-=1.4*Math.log(1+(g.seen[e.id]||0));
  pool.push([e,Math.exp(s)]);
 }
 const quiet=Math.E*0.9, total=quiet+pool.reduce((a,p)=>a+p[1],0);
 let r=Math.random()*total;
 if(r<quiet) return null;
 r-=quiet;
 for(const[e,w] of pool){ r-=w; if(r<=0) return e; }
 return null;
}

/* ============================================================
   ROLLS  (Ego = mean shift + tail risk)
   ============================================================ */
function rollP(roll){
 const base = roll.stat==="R"?g.R : roll.stat==="K"?g.K : roll.stat==="N"?g.N :
              roll.stat==="P"?g.P : roll.stat==="E"?g.E : 50;
 const egoShift = 0.28*(g.E-50);
 return sig((base-(roll.pivot||50)+egoShift)/14);
}
function applyLoss(fx){
 const mult=1+g.E/120;
 const out={};
 for(const k in fx) out[k]=(typeof fx[k]==="number"&&fx[k]<0)? fx[k]*mult : fx[k];
 applyFx(out);
 if(Math.random()<g.E/200) addFoe();
}
function applyFx(fx){
 if(!fx) return;
 for(const k of ["R","K","N","P"]) if(fx[k]){
  const d = fx[k]>0 ? fx[k]*(1-g[k]/105) : fx[k];
  g[k]=clamp(g[k]+d,0,100);
 }
 for(const k of ["E","B"]) if(fx[k]) g[k]=clamp(g[k]+fx[k],0,100);
 if(fx.S) g.S=Math.max(0,g.S+fx.S);
 if(fx.wip) g.wip+=fx.wip;
 if(fx.mom) g.M=clamp(g.M+fx.mom,0,100);
 if(fx.flag) g.flags[fx.flag]=1;
 if(fx.mod) g.mods[fx.mod]=1;
 if(fx.foe) addFoe();
 if(fx.ending) end(fx.ending);
}

function tenureVote(){

            + (g.P>72?-0.45:0) + teachPen;
 for(let i=0;i<seats;i++){
  if(i<foes.length){ votes.push(false); named.push(foes[i]); continue; }
  votes.push(Math.random()<sig(base));
 }

 const pass = yes>=7;
 let note="";

  ? "The letter says: <em>“a genuine institutional citizen. We will miss the polish in the published record, but he knows how to run a meeting, and a department is a great many meetings.”</em>"

 });

 ANTISOCIAL:"was not, in the end, really a colleague",
 GENEROUS:"wrote the kindest report someone ever got",
 HONEST:"reported the null",
 SPEC:"had a specification, and stood by it",
 CORRECTED:"corrected it themselves, in public",
 CARTEL:"cited the circle, and was cited by it",
 OUTSIDE:"stayed out of the circle",
 MENTOR:"read the draft twice",
 THEPAPER:"took the four-year bet",
 EDITOR:"decided, in part, what the field was",
 PHONED_IN:"phoned one in, and it was quoted back",
 AGENT:"had, at the end, an agent",
 VIRAL:"went briefly and enormously viral",
 CHOSE_LIFE:"chose the city",
 TRUTHFUL:"said no, when asked if it got easier",
 THURSDAYS:"went every Thursday",
 GOODHIRE:"won the hire by one vote",
 CANDID:"told a trustee the truth",
 LOYAL:"never used an outside offer",
 TWOBODY:"got the second line",
 FUNDED:"was funded, once, properly",
 ADMIN_ESCAPE:"found the budget model, and it found them back",
 FEST:"could not speak, at the end of the dinner"
};

function end(kind){
 if(g.ended) return;
 g.ended=kind;
 if(kind==="NOBEL"){ g.won.NOBEL=1; if(g.vow==="BOTH"&&!g.won.PRES){ nobelInterlude(); return; } }
 if(kind==="PRES"&&g.vow==="BOTH"&&!g.won.NOBEL){ g.ended=null; presInterlude(); return; }
 const key = (g.vow==="BOTH"&&g.won.NOBEL&&g.won.PRES)?"BOTH":kind;
 const [t,body]=ENDTEXT[key]();
 const met=vowMet();
 const traits=Object.keys(EPITHETS).filter(f=>g.flags[f]).map(f=>EPITHETS[f]);

 const full=`<div class="final">
  <div class="finalbig">${Math.round(g.cites).toLocaleString()}<small>citations</small></div>
  <div class="finalrow">
   <b>${title()}</b>, ${uniName()}<br>
   h-index <b>${hIndex()}</b> &middot; ${g.papers.length} papers &middot; ${aplus()} in the top four<br>
   terminal salary <b>${salaryTxt()}</b> &middot; age ${age()}<br>
   ${g.lostYears?`years lost to collapse <b>${g.lostYears}</b> &middot; `:""}enemies made <b>${g.enemies.length}</b>
  </div></div>`;

 const thin=`<div class="final">
  <div class="finalbig">${salaryTxt()}<small>terminal salary</small></div>
  <div class="finalrow">
   That is the number. The vow was <b>${vowLabel(true)}</b>, and it was not met, so this is the figure the ledger closes on.<br><br>
   <span style="color:var(--dimmer)">${title()}, ${uniName()} &middot; ${Math.round(g.cites).toLocaleString()} citations &middot; h-index ${hIndex()} &middot; ${g.papers.length} papers &middot; age ${age()}</span>
  </div></div>`;

 card({
  cls: met?"gold":"grim", kicker:"THE END", ti:t,
  sc: body + (met?full:thin) + (traits.length?`<div class="remembers">The field remembers: ${traits.join(" · ")}.</div>`:""),
  ch:[{t:"Begin again.",fn(){ setTimeout(boot,60); return ""; }}]
 });
 render();
}
function nobelInterlude(){
 g.ended=null;
 g.M=clamp(g.M+40,0,100); g.E=clamp(g.E+18,0,100); g.N=clamp(g.N+16,0,100);
 g.P=clamp(g.P+26,0,100); g.S+=40; g.flags.CHAIR=1;
 card({cls:"gold",kicker:"OCTOBER",ti:"The call",
  sc:"It comes at 5:11 a.m. and the number is Swedish.<br><br>You vowed both. The medal is one of them. There is a presidency outstanding and, on the evidence of the last four decades, roughly "+Math.max(0,80-g.turn)+" terms in which to get it. You are "+age()+".",
  ch:[{t:"Back to the committee work.",fn(){ return "The laureate returns to the space allocation subcommittee, where his presence is noted as a considerable coup."; }}]});
}
function presInterlude(){
 g.won.PRES=1; g.office=4; g.uni=g.target;
 g.K=clamp(g.K+20,0,100); g.N=clamp(g.N+18,0,100); g.S+=90; g.B=clamp(g.B+20,0,100);
 card({cls:"gold",kicker:"THE OFFICE",ti:"President",
  sc:"They call on a Sunday.<br><br>You vowed both. The office is one of them. The other requires a phone call from Stockholm to a man who now spends eleven hours a day on the endowment, and Stockholm has historically shown very little interest in university presidents.",
  ch:[{t:"Take the office.",fn(){ return "The portrait in the corner office is of a man who owned people. There is a plaque explaining this, added in 2034, which is smaller than the portrait."; }}]});
}
function vowLabel(full){
 if(g.vow==="NOBEL") return "the Nobel";
 const t = g.target ? (full?UNIS[g.target].n:UNIS[g.target].s) : "\u2026";
 if(g.vow==="PRES") return "the presidency of "+t;
 return "the Nobel and the presidency of "+t;
}

/* ============================================================
   UI
   ============================================================ */
const $=id=>document.getElementById(id);

function line(cls,txt){
 const d=document.createElement("div");
 d.className="line "+(cls==="info"?"":cls);
 d.textContent=txt;
 $("log").appendChild(d);
}

function termBanner(){
 $("termslot").innerHTML=`<div class="termbar"><span class="tt">${termName()}</span><span class="ta">age ${age()} \u00b7 ${title()}</span></div>`;
 const ac=$("agechip");
 if(ac){ ac.classList.remove("tick"); void ac.offsetWidth; ac.classList.add("tick"); }
}
function quietCard(){
 const el=document.createElement("div");
 el.className="card quiet";
 el.innerHTML=`<div class="kicker"><span>A QUIET TERM</span><span>${termName()} \u00b7 age ${age()}</span></div>
  <div class="scene">${pick(QUIET)}</div>`;
 $("cardslot").innerHTML="";
 $("cardslot").appendChild(el);
}
function tile(lbl,val,pct,color,alarm){
 return `<div class="tile${alarm?" alarm":""}">
  <div class="lbl">${lbl}</div>
  <div class="v">${val}</div>
  <div class="track"><b style="width:${clamp(pct,0,100)}%;background:${color}"></b></div>
 </div>`;
}
function needle(){
 const v=g.Mshown;
 const ang=-90+180*(v/100);
 const zone = v<33?"cold": v<67?"warm":"hot";
 const col = v<33?"var(--sky)": v<67?"var(--chalk)":"var(--gold)";
 return `<div class="tile gauge">
  <div class="lbl">Momentum</div>
  <div class="needlebox"><svg viewBox="0 0 100 46" role="img" aria-label="Momentum: running ${zone}">
   <path d="M8 40 A42 42 0 0 1 92 40" fill="none" stroke="#2C2937" stroke-width="7" stroke-linecap="round"/>
   <path d="M8 40 A42 42 0 0 1 36 4.5" fill="none" stroke="var(--sky)" stroke-width="7" stroke-linecap="round" opacity=".5"/>
   <path d="M64 4.5 A42 42 0 0 1 92 40" fill="none" stroke="var(--gold)" stroke-width="7" stroke-linecap="round" opacity=".5"/>
   <g class="needle" style="transform:rotate(${ang}deg)">
    <line x1="50" y1="40" x2="50" y2="12" stroke="${col}" stroke-width="3" stroke-linecap="round"/>
   </g>
   <circle cx="50" cy="40" r="4" fill="${col}"/>
  </svg></div>
  <div class="lbl" style="text-align:center;color:${col}">running ${zone}</div>
 </div>`;
}

function render(){
 /* masthead */
 $("vowchip").textContent = g.vow? vowLabel(false) : "no vow yet";
 $("agechip").textContent = "age "+age()+" · "+termName();
 const tc=$("tenurechip");
 if(g.clock!==null){
  tc.hidden=false;
  const yrsLeft=Math.ceil(g.clock/2);
  tc.textContent="tenure clock — year "+(g.clockLen-yrsLeft+1)+" of "+g.clockLen;
  tc.className="clockchip"+(yrsLeft<=2?" hot":"");
 } else tc.hidden=true;

 /* ladder */
 $("ladder").innerHTML=RANKS.map((r,i)=>
  `<i class="${i<g.rank?"done":i===g.rank?"now":""}" title="${r}"></i>`).join("");
 $("rank").innerHTML="<b>"+title()+"</b>";
 $("place").textContent=g.uni? uniShort()+" · "+UNIS[g.uni].note : "";

 /* board */
 $("board").innerHTML =
  tile("Research",   g.R.toFixed(0), g.R, "var(--gold)")+
  tile("Know-how",   g.K.toFixed(0), g.K, "var(--mint)")+
  tile("Network",    g.N.toFixed(0), g.N, "var(--sky)")+
  tile("Profile",    g.P.toFixed(0), g.P, "var(--plum)")+
  tile("Salary",     salaryTxt(),    clamp(g.S/3,0,100), "var(--mint)")+
  tile("Ego",        g.E.toFixed(0), g.E, "var(--plum)")+
  tile("Burnout",    g.B.toFixed(0), g.B, g.B>70?"var(--rose)":"var(--gold)", g.B>70)+
  needle();

 /* enemies */
 $("foes").innerHTML=g.enemies.map(f=>
  `<span class="foe" title="${f.why}">${f.who} · ${f.poisons}</span>`).join("");

 /* cv */
 const q=g.queue.length;
 $("cv").innerHTML=`
  <div class="cvhead">
   <div class="cvbig">${Math.round(g.cites).toLocaleString()}<small>citations</small></div>
   <div class="cvsub">h-index <b>${hIndex()}</b><br>${g.papers.length} published &middot; <b>${aplus()}</b> in the top four</div>
  </div>
  <div class="papers">${g.papers.slice(0,6).map(p=>
   `<div class="prow"><span class="tierpill t-${p.tier==="A+"?"Aplus":p.tier}">${p.tier}</span>
    <span class="ti">${p.ti}</span><span class="jn">${p.jn}</span><span class="ct">${Math.round(p.c)}</span></div>`).join("")}</div>
  <div class="wip">${q? q+" under review &middot; ":""}next paper ${Math.min(99,Math.round(g.wip))}% written</div>`;

 /* desk */
 $("desk").hidden = awaiting || !!g.ended || !g.vow;
 $("left").textContent = budget()-spent();
 $("levers").innerHTML=LEVERS.map(([k,n])=>{
  const v=g.alloc[k];
  return `<div class="lever${v?" lit":""}">
   <div class="ln">${n}</div>
   <div class="dots${v?"":" none"}">${v?"●".repeat(v):"·"}</div>
   <div class="pm">
    <button data-l="${k}" data-d="-1" ${v<=0?"disabled":""} aria-label="less ${n}">−</button>
    <button data-l="${k}" data-d="1" ${budget()-spent()<=0?"disabled":""} aria-label="more ${n}">+</button>
   </div></div>`;
 }).join("");
 const h=LEVERS.find(l=>g.alloc[l[0]]>0);
 $("hint").textContent = h? h[2] : "Six places to put a term. There are only "+budget()+" points, and there have only ever been.";
 $("go").disabled=awaiting||!!g.ended;
}

/* ---------- the card ---------- */
function card(o){
 awaiting=true;
 const el=document.createElement("div");
 el.className="card "+(o.cls||"");
 el.innerHTML=`
  <div class="kicker"><span>${o.kicker||"THE TERM"}</span><span>${termName()} · age ${age()}</span></div>
  <h2>${o.ti}</h2>
  <div class="scene">${o.sc}</div>
  <div class="choices">${o.ch.map((c,i)=>{
    const ok=gateOK(c.gate);
    const sub = ok ? (c.why||"") : lockWhy(c.gate);
    return `<button data-c="${i}"${ok?"":" disabled"}${c.roll?' class="risky"':""}>${c.t}${
      sub?`<span class="why">${sub}</span>`:""}</button>`;
  }).join("")}</div>
  <div class="outcome" hidden></div>`;
 $("cardslot").innerHTML="";
 $("cardslot").appendChild(el);

 el.querySelectorAll("button[data-c]").forEach(b=>b.onclick=()=>{
  const c=o.ch[+b.dataset.c];
  el.querySelectorAll("button").forEach(x=>x.disabled=true);
  b.style.borderColor="var(--gold)";
  const snap={R:g.R,K:g.K,N:g.N,P:g.P,S:g.S,E:g.E,B:g.B};
  let msg=c.say||"", bad=false;

  if(c.fn){ msg=c.fn()||msg; }
  else if(c.roll){
   const p=rollP(c.roll);
   if(Math.random()<p){ applyFx(c.roll.win.fx); msg=c.roll.win.say; }
   else { applyLoss(c.roll.lose.fx); msg=c.roll.lose.say; bad=true; }
  } else applyFx(c.fx);

  const out=el.querySelector(".outcome");
  if(msg){
   out.hidden=false;
   out.className="outcome"+(bad?" bad":"");
   out.innerHTML=msg+deltaStrip(snap);
  }
  if(pendingNext){
   const go=pendingNext; pendingNext=null;
   out.hidden=false;
   const nb=document.createElement("button");
   nb.className="go"; nb.textContent=o.nextLabel||"Continue";
   nb.onclick=()=>{ awaiting=false; go(); };
   out.appendChild(nb);
  } else {
   awaiting=false;
  }
  render();
 });
 render();
}
function deltaStrip(s){
 const nm={R:"research",K:"know-how",N:"network",P:"profile",E:"ego",B:"burnout"};
 const parts=[];
 for(const k in nm){
  const d=g[k]-s[k];
  if(Math.abs(d)>=1) parts.push(`<span class="${d>0?(k==="B"?"dn":"up"):(k==="B"?"up":"dn")}">${nm[k]} ${d>0?"+":"−"}${Math.abs(d).toFixed(0)}</span>`);
 }
 const ds=g.S-s.S;
 if(Math.abs(ds)>=1) parts.push(`<span class="${ds>0?"up":"dn"}">salary ${ds>0?"+":"−"}$${Math.abs(ds).toFixed(0)}k</span>`);
 return parts.length?`<div class="deltas">${parts.join("")}</div>`:"";
}
function lockWhy(ga){
 if(!ga) return "";
 if(ga.E&&ga.P) return "needs a certain amount of ego, and an audience";
 if(ga.K) return "needs institutional know-how "+ga.K+"+";
 if(ga.N) return "needs a network you don't have yet";
 if(ga.R) return "needs a research record you don't have yet";
 return "not yet";
}

/* ============================================================
   THE TURN
   ============================================================ */
function runTerm(){
 if(awaiting||g.ended) return;
 $("log").innerHTML="";
 $("cardslot").innerHTML="";

 if(g.skip>0){
  g.skip--; g.turn++;
  termBanner();
  g.Mshown=g.M;
  line("bad","— A term you were not present for.");
  if(g.clock!==null) g.clock--;
  if(g.turn>=80){ end("TIME"); return; }
  render(); return;
 }

 g.turn++;
 termBanner();
 const oldM=g.M;

 applyLevers();
 passivePass();
 reviewPass();
 citationPass();

 /* promotion: assistant -> associate is the vote; associate -> full is a threshold */
 if(g.rank===3 && g.tenured && g.R+g.K>=110 && Math.random()<0.3){
  g.rank=4; g.S+=22; g.E=clamp(g.E+6,0,100);
  line("gold","▲ Promoted to Professor. The letter takes four months and the raise takes eighteen.");
 }
 /* administrative ladder */
 if(g.office>=1 && g.office<3 && g.K>=45+g.office*14 && Math.random()<0.22){
  g.office++; g.S+=26; g.B=clamp(g.B+8,0,100);
  line("gold","▲ "+OFFICES[g.office]+". A larger office and a calendar that belongs to someone else.");
 }
 if(g.mods.office1 && g.office===0){ g.office=1; delete g.mods.office1; }
 if(g.mods.move){ delete g.mods.move; g.uni=pick(MID); line("info","→ You move to "+uniName()+"."); }
 if(g.mods.teachfix){ delete g.mods.teachfix; g.tdebt=0; }

 g.alloc={write:0,net:0,pub:0,serv:0,teach:0,rest:0};
 g.Mshown=oldM;   /* the needle lags one beat */

 /* stage transitions */
 if(g.rank===1 && g.postdocEnd && g.turn>=g.postdocEnd){
  const dest = g.R>=42 ? pick(TOP.concat(MID)) : pick(MID.concat(LOW));
  startClock(dest, UNIS[dest].p>=0.8?7:6);
  line("gold","▲ Assistant Professor at "+uniName()+". The clock starts: "+g.clockLen+" years.");
 }

 /* hard stops */
 if(g.B>=100){ render(); collapse(); return; }
 if(g.turn>=80){ render(); end(timeUpKind()); return; }
 if(g.clock!==null){
  g.clock--;
  if(g.clock<=0){ render(); tenureVote(); return; }
 }

 if(g.rank===0 && g.turn>=6){ render(); placeStep(); return; }

 /* op-ed window after a viral collapse */
 if(g.mods.opedwindow && g.turn>=g.mods.opedwindow){
  delete g.mods.opedwindow; render(); card(OPED); return;
 }
 /* endgame rolls */
 if(octoberPass()){ render(); return; }
 if(presSearchReady() && !(g.mods.searchcool>g.turn) && Math.random()<0.40){ render(); presSearch(); return; }

 const e=drawEvent();
 if(e){
  g.seen[e.id]=(g.seen[e.id]||0)+1;
  card({kicker:"THE TERM",ti:e.ti,sc:e.sc,ch:e.ch});
 } else {
  quietCard();
 }
 render();
}
function timeUpKind(){
 if(g.vow==="BOTH"){
  if(g.won.NOBEL&&g.won.PRES) return "BOTH";
  if(g.won.NOBEL) return "BOTH_HALF_N";
  if(g.won.PRES)  return "BOTH_HALF_P";
 }
 if(g.won.PRESALT) return "PRES_MISS";
 return g.shortlists?"NOBEL_MISS":"TIME";
}

/* ============================================================
   OPENING
   ============================================================ */
function boot(){
 newGame();
 $("log").innerHTML="";
 $("termslot").innerHTML="";
 render();
 card({
  cls:"gold", kicker:"THE VOW", ti:"What is it for?",
  sc:"You are twenty-five. You have a dissertation that is nearly finished, an advisor who has not read the third chapter, and forty years.<br><br>Everyone in this profession is doing it for something. Most of them will not say what. <em>Say what.</em>",
  ch:[
   {t:"The Nobel Prize.",why:"you want the call",fn(){ g.vow="NOBEL"; pendingNext=phdStart; return "Said out loud, at twenty-five, it sounds absurd. You will not say it out loud again for thirty years."; }},
   {t:"A university presidency.",why:"you want the office",fn(){ g.vow="PRES"; pendingNext=targetStep; return "The honest version of the ambition, which almost nobody gives."; }},
   {t:"Both.",why:"what else?",fn(){ g.vow="BOTH"; pendingNext=targetStep; return "Both. Note that the clock does not adjust for this, and neither does the body."; }}
  ]
 });
}
function phdStart(){
 g.uni=pick(TOP.concat(MID)); g.rank=0; g.S=24;
 card({
  cls:"gold", kicker:"THE PROGRAM", ti:"Nearly done",
  sc:"You are twenty-five, most of the way through a PhD at <em>"+uniName()+"</em>. A stipend of $24k, a desk in a room with four other desks, and a dissertation in three chapters of which two exist.<br><br>Three years of it remain before the market. What you do with them will not appear on your CV, and will decide most of what follows.",
  ch:[{t:"Get to work.",why:"six terms until the job market",
    fn(){ return "The room has a kettle and a whiteboard nobody erases. Somebody's job market paper is on it, from a year that has passed."; }}]
 });
}
function targetStep(){
 card({
  cls:"gold",kicker:"THE VOW",ti:"President of where?",
  sc:"A presidency is not a rank, it is an address. Name the one you mean. You will be measured against this and nothing else.",
  ch: TOP.map(k=>({t:UNIS[k].n, why:UNIS[k].blurb, fn(){ g.target=k; pendingNext=phdStart;
    return "Noted. "+UNIS[k].n+" — "+UNIS[k].note+". Everything else will be a near miss."; }}))
 });
}
function placeStep(){
 const post=pick(TOP), tt=pick(MID);
 card({
  cls:"gold",kicker:"THE MARKET",ti:"Two offers",
  sc:"The market has produced exactly two things. A postdoc at <em>"+UNIS[post].n+"</em> — two years, no teaching, no security, and an address that does roughly a third of the work of a career. Or a tenure-track line at <em>"+UNIS[tt].n+"</em> — seven years on the clock, starting now.<br><br>Everyone will tell you there is an obvious answer. They will not agree about which.",
  ch:[
   {t:"The postdoc at "+UNIS[post].n+".",why:UNIS[post].blurb+" — two years, and no clock.",fn(){
     g.uni=post; g.rank=1; g.S=58; g.flags.POSTDOC=1; g.postdocEnd=g.turn+4;
     return "Two years in a building where the coffee is bad and the corridor conversations are not. Nobody asks what you teach, because you do not."; }},
   {t:"The tenure-track line at "+UNIS[tt].n+".",why:UNIS[tt].blurb+" — seven years, starting now.",fn(){
     startClock(tt,7);
     return "An office with your name on a card in a slot, which is how they indicate that the name is provisional. The clock starts this September."; }}
  ]
 });
}

/* wiring */
$("levers").addEventListener("click",ev=>{
 const b=ev.target.closest("button"); if(!b) return;
 const k=b.dataset.l, d=+b.dataset.d;
 if(d>0&&spent()>=budget()) return;
 g.alloc[k]=Math.max(0,g.alloc[k]+d);
 render();
});
$("go").onclick=runTerm;


boot();
</script>
