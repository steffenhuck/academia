<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Discipline</title>
<meta name="description" content="An academic career, 25 to 65. Declare your vow — the Nobel, a presidency, or both — and spend forty years finding out what the field actually counts.">
<script data-goatcounter="https://steffenhuck.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14131A; --panel:#1E1D27; --panel2:#262430; --edge:#332F42;
  --gold:#F0B429; --goldsoft:#7A5C17; --rose:#FF5A6B; --mint:#3ED9A4;
  --sky:#7BA7FF; --plum:#B98BFF; --chalk:#F4F1E9; --dim:#9A94AC; --dimmer:#6B6579;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--chalk);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5;
  background-image:radial-gradient(circle at 50% 0%, #201E2B 0%, var(--ink) 60%);
  background-attachment:fixed;
  min-height:100%;
}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 120px;padding-left:16px;padding-right:16px}
.disp{font-family:"Fraunces","Iowan Old Style",Georgia,serif}
.mono{font-family:"Space Mono",ui-monospace,monospace}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- masthead ---------- */
header.mast{
  border:2px solid var(--edge); border-radius:18px; background:var(--panel);
  padding:16px 18px 14px; margin-bottom:14px; position:relative; overflow:hidden;
}
header.mast::after{
  content:""; position:absolute; right:-40px; top:-60px; width:180px; height:180px;
  border-radius:50%; background:radial-gradient(circle,rgba(240,180,41,.16),transparent 65%);
}
header.mast h1{
  font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:44px; line-height:.92;
  margin:0; letter-spacing:-.02em; text-wrap:balance;
}
header.mast .tag{
  font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  color:var(--dim); margin-top:8px;
}
.vowbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.vowchip{
  border:1.5px solid var(--goldsoft); background:rgba(240,180,41,.09); color:var(--gold);
  border-radius:999px; padding:5px 12px; font-size:12px; font-weight:800;
  letter-spacing:.06em; text-transform:uppercase;
}
.clockchip{
  border:1.5px solid var(--edge); background:var(--panel2); color:var(--chalk);
  border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700;
}
.clockchip.hot{border-color:var(--rose);color:var(--rose)}

/* ---------- the ladder ---------- */
.ladder{display:flex;gap:4px;margin:0 0 6px}
.ladder i{
  flex:1; height:8px; border-radius:4px; background:#2A2835; border:1px solid #37344A;
  transition:background .4s,height .3s;
}
.ladder i.done{background:var(--goldsoft);border-color:var(--goldsoft)}
.ladder i.now{background:var(--gold);border-color:var(--gold);height:13px}
.rankline{
  font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--dim); margin:0 0 14px; display:flex; justify-content:space-between; gap:10px;
}
.rankline b{color:var(--chalk)}

/* ---------- stat board ---------- */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
@media(max-width:460px){.board{grid-template-columns:repeat(2,1fr)}}
.tile{
  background:var(--panel); border:1.5px solid var(--edge); border-radius:14px;
  padding:9px 10px 10px; min-width:0;
}
.tile .lbl{
  font-size:9.5px; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
  color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tile .v{font-size:27px;font-weight:800;line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .track{height:5px;border-radius:3px;background:#2C2937;margin-top:7px;overflow:hidden}
.tile .track b{display:block;height:100%;border-radius:3px;transition:width .5s}
.tile.alarm{border-color:var(--rose)}
.tile.alarm .v{color:var(--rose)}
.tile.gauge{display:flex;flex-direction:column;justify-content:space-between}
.needlebox{display:flex;justify-content:center;margin-top:2px}
.needlebox svg{width:100%;max-width:120px;height:46px}
.needle{transition:transform 1.1s cubic-bezier(.4,1.5,.5,1);transform-origin:50px 40px}

/* ---------- CV panel ---------- */
.cv{
  background:var(--panel); border:1.5px solid var(--edge); border-radius:16px;
  padding:12px 14px 13px; margin-bottom:12px;
}
.cvhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.cvbig{font-size:40px;font-weight:800;line-height:.95;color:var(--gold);font-variant-numeric:tabular-nums}
.cvbig small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.cvsub{font-size:13px;color:var(--dim);font-weight:600}
.cvsub b{color:var(--chalk)}
.papers{margin-top:10px;display:flex;flex-direction:column;gap:4px;max-height:132px;overflow-y:auto}
.papers:empty{display:none}
.prow{font-family:"Space Mono",monospace;font-size:11.5px;color:var(--dim);display:flex;gap:8px;align-items:baseline}
.prow .ti{color:var(--chalk);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .jn{font-style:italic}
.prow .ct{color:var(--gold);font-weight:700;white-space:nowrap}
.pubrow{margin:4px 0 8px;line-height:1.45}
.pubrow b{color:var(--chalk)}
.pubrow i{color:var(--dim)}
.tierpill{
  font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;letter-spacing:.06em;
  border:1px solid currentColor;white-space:nowrap
}
.t-Aplus{color:var(--gold)} .t-A{color:var(--mint)} .t-B{color:var(--sky)} .t-C{color:var(--dimmer)}
.wip{font-family:"Space Mono",monospace;font-size:11.5px;color:var(--dimmer);margin-top:8px}

/* ---------- the card ---------- */
.card{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:2px solid var(--edge); border-radius:18px; padding:16px 17px 17px; margin-bottom:12px;
  animation:rise .45s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .card{animation:none} .needle{transition:none} .tile .track b{transition:none}
  .termbar{animation:none} .clockchip.tick{animation:none}
}
.termbar{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin:6px 0 11px;padding:9px 2px 0;border-top:2.5px solid var(--gold);
  animation:sweep .5s cubic-bezier(.2,.9,.3,1) both;
}
.termbar .tt{font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:21px;letter-spacing:-.01em}
.termbar .ta{font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);text-align:right}
@keyframes sweep{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.clockchip.tick{animation:tickflash .7s ease-out}
@keyframes tickflash{0%{background:var(--gold);color:#1A1509;border-color:var(--gold)}100%{}}
.card.quiet{border-color:#2E2B3A;background:var(--panel)}
.card.quiet .scene{color:var(--dim);font-style:italic}
.card.gold{border-color:var(--gold);background:linear-gradient(180deg,#2A2418,var(--panel))}
.card.grim{border-color:var(--rose)}
.kicker{
  font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
  display:flex;justify-content:space-between;gap:10px;
}
.kicker span:last-child{color:var(--dimmer);letter-spacing:.1em}
.card h2{
  font-family:"Fraunces",Georgia,serif; font-weight:900; font-size:29px; line-height:1.03;
  margin:7px 0 9px; letter-spacing:-.015em; text-wrap:balance;
}
.card.ledger{padding:13px 16px 13px;border-color:#3A3648}
.card.ledger h2{font-size:19px;margin:6px 0 8px}
.card.ledger .lines{display:flex;flex-direction:column;gap:3px}
.card.ledger .lines:empty::after{content:"Nothing moved. That is also a term.";font-family:"Space Mono",monospace;font-size:11.5px;color:var(--dimmer)}
.scene{font-size:15.5px;line-height:1.55;color:#DAD5E4}
.scene em{color:var(--chalk)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:13px}
.choices button{
  text-align:left; background:#23212E; color:var(--chalk);
  border:1.5px solid #3D3950; border-radius:12px; padding:11px 13px;
  font-size:15px; font-weight:700; line-height:1.35; cursor:pointer;
  transition:border-color .15s,background .15s,transform .06s;
}
.choices button:hover:not(:disabled){border-color:var(--gold);background:#2A2534}
.choices button:active:not(:disabled){transform:scale(.99)}
.choices button:disabled{opacity:.45;cursor:not-allowed}
.choices button .why{
  display:block;font-size:12.5px;font-weight:500;color:var(--dim);
  margin-top:5px;line-height:1.42;letter-spacing:.01em
}
.choices button.risky{border-color:#6B3A44}
.choices button.risky:hover:not(:disabled){border-color:var(--rose)}
.outcome{
  margin-top:14px;padding:13px 15px 14px;border-radius:12px;
  background:rgba(62,217,164,.09);border:1.5px solid rgba(62,217,164,.38);
  font-size:15px;line-height:1.52;color:var(--chalk);font-weight:500;
}
.outcome::before{
  content:"What happened";display:block;font-size:10px;font-weight:800;
  letter-spacing:.18em;text-transform:uppercase;color:var(--mint);margin-bottom:6px;
}
.outcome.bad{background:rgba(255,90,107,.09);border-color:rgba(255,90,107,.42)}
.outcome.bad::before{color:var(--rose);content:"What happened \2014 badly"}
.outcome .go{margin-top:12px}
.deltas{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px}
.deltas span{
  font-family:"Space Mono",monospace;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:999px;border:1.5px solid currentColor;
}
.deltas .up{color:var(--mint)} .deltas .dn{color:var(--rose)}

/* ---------- vote tally ---------- */
.tally{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 4px}
.vote{
  width:30px;height:38px;border-radius:5px;border:1.5px solid var(--edge);background:#23212E;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
}
.vote.yes{border-color:var(--mint);color:var(--mint)}
.vote.no{border-color:var(--rose);color:var(--rose)}
.votenote{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.45}
.votenote b{color:var(--rose)}

/* ---------- the desk ---------- */
.desk{
  background:var(--panel); border:2px solid var(--edge); border-radius:18px;
  padding:13px 14px 14px; margin-bottom:12px;
}
.desk.first{border-color:var(--gold);box-shadow:0 0 0 4px rgba(240,180,41,.14)}
.desk.first .deskhead h3::after{content:" \2190 start here";font-family:"Archivo",sans-serif;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-left:8px}
.deskhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.deskhead h3{
  font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:19px;margin:0;letter-spacing:-.01em
}
.pts{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.04em}
.pts b{color:var(--gold);font-size:15px}
.levers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:400px){.levers{grid-template-columns:repeat(2,1fr)}}
.lever{background:#23212E;border:1.5px solid #342F45;border-radius:12px;padding:8px 7px 7px;text-align:center}
.lever.lit{border-color:var(--gold);background:#2A2418}
.lever .ln{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.lever.lit .ln{color:var(--gold)}
.lever .dots{font-size:13px;letter-spacing:2px;color:var(--gold);height:19px;line-height:19px}
.lever .dots.none{color:#403B52}
.lever .pm{display:flex;gap:5px;justify-content:center}
.lever .pm button{
  width:30px;height:28px;border-radius:8px;border:1.5px solid #3D3950;background:#1B1A24;
  color:var(--chalk);font-size:16px;font-weight:800;cursor:pointer;line-height:1;
}
.lever .pm button:disabled{opacity:.3;cursor:not-allowed}
.hint{font-size:11.5px;color:var(--dimmer);margin-top:9px;line-height:1.45}
.go{
  width:100%;margin-top:11px;padding:14px;border-radius:13px;border:none;cursor:pointer;
  background:var(--gold);color:#1A1509;font-size:16px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;transition:filter .15s;
}
.go:hover:not(:disabled){filter:brightness(1.08)}
.go:disabled{background:#3A3648;color:var(--dimmer);cursor:not-allowed}

/* ---------- log ---------- */
#log{display:flex;flex-direction:column;gap:3px;margin-bottom:14px}
#log:empty{display:none}
.line{
  font-family:"Space Mono",monospace;font-size:11.5px;line-height:1.5;color:var(--dim);
  padding-left:11px;border-left:2px solid #322F42;
}
.line.good{color:var(--mint);border-color:var(--mint)}
.line.bad{color:var(--rose);border-color:var(--rose)}
.line.gold{color:var(--gold);border-color:var(--gold)}

/* ---------- enemies ---------- */
.foes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.foes:empty{display:none}
.who{color:var(--chalk);border-bottom:1px dotted var(--gold);cursor:pointer}
.who:hover{color:var(--gold)}
.sheet .bio{font-size:15px;line-height:1.55;color:#DAD5E4}
.foelbl{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);align-self:center;margin-right:2px}
.foe{
  font-size:11px;font-weight:700;border:1.5px solid #5B3742;background:rgba(255,90,107,.08);
  color:#FF8C99;border-radius:999px;padding:4px 10px;
}

/* ---------- ending ---------- */
.final{margin-top:13px;padding:13px;border-radius:12px;background:#191823;border:1.5px solid var(--edge)}
.finalbig{font-size:46px;font-weight:800;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.finalbig small{display:block;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:5px}
.finalrow{font-family:"Space Mono",monospace;font-size:12px;color:var(--dim);margin-top:11px;line-height:1.7}
.finalrow b{color:var(--chalk)}
.remembers{font-size:13.5px;color:var(--dim);font-style:italic;margin-top:11px;line-height:1.5}

/* ---------- footer ---------- */
.cvlink{
  background:none;border:none;padding:0;margin:0;color:inherit;font:inherit;cursor:pointer;
  border-bottom:1.5px dotted var(--gold);color:var(--chalk);
}
.cvlink:hover{color:var(--gold)}
.cvlink b{color:inherit}
#ovl{position:fixed;inset:0;background:rgba(10,9,14,.78);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
#ovl[hidden]{display:none}
.sheet{
  width:100%;max-width:640px;background:var(--panel);border:2px solid var(--gold);border-radius:18px;
  padding:16px 18px 18px;animation:rise .35s cubic-bezier(.2,.9,.3,1) both;
}
.sheet h2{font-family:"Fraunces",Georgia,serif;font-weight:900;font-size:26px;margin:0 0 2px;letter-spacing:-.015em}
.sheet .sub{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.cvlist{display:flex;flex-direction:column;gap:9px;max-height:62vh;overflow-y:auto;padding-right:4px}
.cvrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid #2E2B3A}
.cvrow:first-child{border-top:none}
.cvrow .ti{font-weight:700;color:var(--chalk);line-height:1.35}
.cvrow .meta{font-family:"Space Mono",monospace;font-size:11.5px;color:var(--dim);margin-top:3px}
.cvrow .meta i{color:var(--dim)}
.cvrow .ct{font-family:"Space Mono",monospace;font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap}
.cvrow .ct small{display:block;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:right}
.sheet .empty{color:var(--dim);font-style:italic;padding:10px 0}
.sheet .close{margin-top:14px}
footer{text-align:center;padding:6px 0 4px}
footer a{color:var(--dimmer);font-style:italic;font-size:14px;text-decoration:none}
footer a:hover{color:var(--gold)}
footer .ver{font-family:"Space Mono",monospace;font-size:10px;color:var(--dimmer);margin-left:10px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="wrap">

<header class="mast">
  <h1>The Discipline</h1>
  <div class="tag">an academic career &middot; 25 to 65</div>
  <div class="vowbar">
    <span class="vowchip" id="vowchip">no vow yet</span>
    <span class="clockchip" id="agechip">age 25</span>
    <span class="clockchip" id="tenurechip" hidden>tenure clock</span>
  </div>
</header>

<div class="ladder" id="ladder"></div>
<div class="rankline"><span id="rank">&mdash;</span><span id="place"></span></div>

<div class="board" id="board"></div>
<div class="foes" id="foes"></div>

<div class="cv" id="cv"></div>

<div id="termslot"></div>
<div id="cardslot"></div>

<div class="desk" id="desk" hidden>
  <div class="deskhead">
    <h3>The term ahead</h3>
    <div class="pts">points left <b id="left">5</b></div>
  </div>
  <div class="levers" id="levers"></div>
  <div class="hint" id="hint"></div>
  <button class="go" id="go">Run the term</button>
</div>

<div id="log"></div>

<footer><a href="https://steffenhuck.github.io">steffen huck</a> <span class="ver" id="ver"></span></footer>
<div id="ovl" hidden></div>
</div>

<script>
'use strict';
const VERSION="0.03.15";

/* ============================================================
   THE DISCIPLINE — v0 engine
   80 turns = 2 terms x 40 years, age 25 to 65.
   ============================================================ */

/* ---------- institutions ---------- */
const UNIS={
 HARWICH  :{n:"Harwich College",               s:"Harwich",     p:1.00, note:"est. 1638",
  blurb:"Founded 1638, older than the country, and never once described as up-and-coming."},
 THROMBER :{n:"Thromber University",           s:"Thromber",    p:0.97, note:"endowed 1889",
  blurb:"Endowed 1889 on a patent for a bottle stopper. The largest endowment in the world, and nobody has ever found this odd."},
 PELHAM   :{n:"Pelham College",                s:"Pelham",      p:0.94, note:"smaller, and aware of it",
  blurb:"Smaller than Harwich and insufferable about it. The faculty club has a dress code and enforces it."},
 CALDERON :{n:"Calderon University",           s:"Calderon",    p:0.91, note:"good weather",
  blurb:"Good weather, bad seminars, and three people who are going to win this thing before you do."},
 CUTHBERTS:{n:"St Cuthbert\u2019s College",       s:"St Cuthbert\u2019s", p:0.89, note:"genuinely medieval",
  blurb:"Genuinely medieval. There is sherry, and a statute from 1451 that nobody has got round to repealing."},
 OSTRANDER:{n:"Ostrander State University",    s:"Ostrander",   p:0.62, note:"serious, unmentioned",
  blurb:"A serious department that nobody outside it mentions and everybody inside it defends."},
 BELLWEATHER:{n:"Bellweather University",      s:"Bellweather", p:0.57, note:"two good macro people",
  blurb:"Two good macro people, one grudge of long standing, and a building named after a bank that failed."},
 FENWICK  :{n:"Fenwick College",               s:"Fenwick",     p:0.53, note:"acting chair, nine years",
  blurb:"The chair has been acting for nine years and has come to prefer it that way."},
 BOWHEAD  :{n:"Bowhead State University",      s:"Bowhead",     p:0.30, note:"enrollment 14,000",
  blurb:"Enrollment fourteen thousand, parking ample, and a football program that cannot be discussed."},
 VERONA   :{n:"Lake Verona Polytechnic Institute", s:"Lake Verona", p:0.24, note:"formerly a teachers\u2019 college",
  blurb:"Formerly a teacher training college \u2014 and formerly is doing a great deal of work in that sentence."},
 CRANMOOR :{n:"Cranmoor A&M University",       s:"Cranmoor",    p:0.27, note:"strong in agronomy",
  blurb:"Strong in agronomy. Genuinely, unironically strong in agronomy."}
};
const TOP=["HARWICH","THROMBER","PELHAM","CALDERON","CUTHBERTS"];
const MID=["OSTRANDER","BELLWEATHER","FENWICK"];
const LOW=["BOWHEAD","VERONA","CRANMOOR"];

/* ---------- journals ---------- */
const JOURNALS={
 "A+":{w:9.0, n:["the Quarterly","Metrica","the Review","the American"]},

/* {paper} names the paper in the drawer — the one the next submission sends.
   {qpaper} and {qjournal} name the paper under review longest — the one the
   process mods (accept, reject, resubmit, delay, publish) act on.
   With html set, cast names become clickable and open their bio. */
const oldestQ=()=>g.queue.slice().sort((a,b)=>a.due-b.due)[0];
function fill(str,html){
 if(!str) return str;
 return String(str)
  .replace(/\{paper\}/g,()=>(g.nextPaper=g.nextPaper||makePaper()).ti)
  .replace(/\{qpaper\}/g,()=>{ const q=oldestQ(); return q?q.ti:"the paper"; })
  .replace(/\{qjournal\}/g,()=>{ const q=oldestQ(); return q?q.jn:"the journal"; })
  .replace(/\{(\w+)\}/g,(m,k)=>{
   if(CAST[k]===undefined) return m;
   const key=BIOS[k]?k:(BIOS[k.replace(/S$/,"")]?k.replace(/S$/,""):null);
   return (html&&key)? `<span class="who" data-who="${key}">${CAST[k]}</span>` : CAST[k];
  });
}

 {t:"Push hard for the second position.",roll:{stat:"N",pivot:45,
   win:{fx:{N:5,S:6,flag:"TWOBODY"},say:"The dean finds money that did not exist until the moment it was needed, which is the only way money is ever found in a university."},
   lose:{fx:{B:12,E:-6},say:"“We'd love to, but the line isn't there.” The line is never there. You commute for six years and count it as a solved problem because the alternative is counting it as an unsolved one."}}},
 {t:"Take it anyway and commute.",fx:{B:14,S:4},say:"Sunday nights become a genre of their own."},
 {t:"Turn it down for the worse place with the right city.",fx:{S:-4,B:-6,flag:"CHOSE_LIFE"},say:"A defensible decision that the profession will price, accurately and permanently, at about fifteen percent of your career."}]},

{id:"D3",ti:"The Working Paper",b:[1,3],ex:{base:.9},
 sc:"It's finished enough. You can post it now and start the clock on people reading it, or sit on it for a term and make it right.",
 ch:[
 {t:"Post it.",fx:{wip:40,P:3,N:3,mom:6},say:"Seventy downloads in a week, which feels like weather. Three of them matter."},
 {t:"Hold it back and polish.",fx:{R:5,wip:18,B:3},say:"It is genuinely better. In the interval, a group at Calderon posts something adjacent and gets the phrase."}]},

/* ---------- ASSISTANT PROFESSOR ---------- */
{id:"A1",ti:"The Committee Invitation",b:[2,3],ex:{base:1.1},
 sc:"The chair would like you on the undergraduate curriculum review. It meets fortnightly. It has met fortnightly since 2009 and has never produced a document.",
 ch:[
 {t:"Say yes.",fx:{K:8,N:5,B:5},say:"You discover the budget model by accident — a spreadsheet nobody guards because nobody believes anyone would want it. You want it."},
 {t:"Say no, citing the clock.",fx:{R:5,wip:16,N:-4},say:"Entirely reasonable and entirely remembered. The clock excuse works exactly once per colleague."}]},

{id:"A2",ti:"The Desk Reject",b:[2,4],ex:{base:1,lowMom:1.2},ga:{queue:1},
 sc:"“{qpaper}” comes back from {qjournal} in eleven days. The editor's note is four sentences long and two of them are about the journal's space constraints.",
 ch:[
 {t:"Send it down a tier tomorrow.",fx:{E:-4,mod:"resubmit"},say:"It goes out again in the morning, one tier down. Something about the paper's ambition quietly resizes itself to fit."},
 {t:"Appeal.",roll:{stat:"E",pivot:60,
   win:{fx:{N:3,mod:"delay"},say:"The editor sends it out after all. It will take a year longer than it should, and it may still not get in, but being read by three people who matter is worth more than being desk-rejected by none who do."},
   lose:{fx:{E:-8,mod:"reject",foe:{why:"you appealed their desk rejection",poisons:"referee"}},say:"The reply contains the phrase “we receive a great many appeals.” The paper is back in the drawer, and you have made a permanent, unnecessary impression on someone who edits things."}}},
 {t:"Put it in the drawer and start something better.",fx:{R:6,wip:20,B:4,mod:"reject"},say:"The drawer is where about forty percent of the field's actual best work lives. This one joins it, and something better starts."}]},

{id:"A3",ti:"The Op-Ed Request",b:[2,4],ex:{base:.7,highP:2},
 sc:"A mid-tier outlet wants 800 words by Thursday on something adjacent to your dissertation. The fee is $250 and the audience is, in the strict sense, everyone.",
 ch:[
 {t:"Write it properly.",fx:{P:9,N:4,R:-2,B:5},say:"It is careful, hedged, and correct. It gets 40,000 readers and one email from a senior colleague reading, in its entirety: “Saw your piece. Interesting to see you branching out.”"},
 {t:"Phone it in.",fx:{P:7,E:4,flag:"PHONED_IN"},say:"Ninety minutes, three confident claims, one of them beyond your evidence. It does very well. It will be quoted back at you, by someone who dislikes you, at a moment you cannot choose."},
 {t:"Decline.",say:"Nothing happens. Nothing whatsoever. The integrity is real and mechanically invisible, which is the most accurate thing this game does."}]},

{id:"A4",ti:"Evaluations",b:[2,4],ex:{base:.6,tdebt:2.6},
 sc:"Your teaching scores have arrived. The mean is 2.1. The free-text comments have been forwarded to the chair by a parent, which is a sentence nobody in this building has heard before.",
 ch:[
 {t:"Take the workshop. Fix it.",fx:{K:4,B:5,mod:"teachfix"},say:"You learn, at forty, that you had been lecturing at the whiteboard rather than the room. It costs a term. It is not on any form."},
 {t:"Point out that your research record is excellent.",fx:{N:-6,E:5,foe:{why:"you told the chair, in front of them, that the teaching did not matter",poisons:"vote"}},say:"The chair agrees with you, on the record, and privately reclassifies you as a problem to be managed rather than a colleague to be promoted."}]},

{id:"A5",ti:"The Counteroffer",b:[2,4],ex:{base:.7,highR:1.4},ga:{R:45},
 sc:"Bellweather has made an offer. Your chair asks, in the corridor, whether it's “something you're taking seriously,” which is the sound of a man doing arithmetic.",
 ch:[
 {t:"Negotiate hard.",roll:{stat:"N",pivot:48,
   win:{fx:{S:14,N:3,E:6},say:"They match it and add a course release. You have discovered the central fact of academic compensation: it is not paid for work, it is paid for the credible threat of leaving."},
   lose:{fx:{S:3,foe:{why:"you tried to use Bellweather against the department",poisons:"vote"}},say:"“We can't match that.” A pause. “But we've found you a parking space in the structure.” You take the parking space. Everyone learns the number you settled for."}}},
 {t:"Take Bellweather.",fx:{S:11,N:-2,mod:"move"},say:"A real raise and a worse address. The address is the part that compounds."},
 {t:"Tell them you're not going anywhere.",fx:{N:4,S:-2,flag:"LOYAL"},say:"Loyalty is the one asset in this profession with no market price and no buyer."}]},

{id:"A6",ti:"The Citation Circle",b:[2,4],ex:{base:.8},tr:"nobel",
 sc:"Four people work on your thing. Over dinner it becomes clear, without anyone saying it, that the four of you could simply agree to cite each other exhaustively for the next fifteen years.",
 ch:[
 {t:"Join the circle.",fx:{N:7,mom:9,E:4,flag:"CARTEL"},say:"Nobody signs anything. Nobody needs to. Your citation count begins to behave like a stock in a bull market, which is to say it begins to measure something other than the thing."},
 {t:"Stay out.",fx:{R:4,flag:"OUTSIDE"},say:"You cite what you use. Over fifteen years the difference between your count and theirs will grow to roughly a factor of three, and the difference in the papers will grow to roughly nothing."}]},

{id:"A7",ti:"The Junior Colleague",b:[2,4],ex:{base:.8},
 sc:"She is two years in, visibly drowning, and her question after the seminar was better than the paper. She asks if you'd read a draft.",
 ch:[
 {t:"Read it properly. Twice.",fx:{B:4,N:3,flag:"MENTOR"},say:"Six pages of comments and an hour in your office. She places at Ostrander, then at Pelham, and in 2049 she is on a committee you have not thought about since Tuesday."},
 {t:"“Send it over” and skim it.",fx:{R:2},say:"You return three sentences of encouragement. She takes it well, files you accurately, and tells the next cohort where to go and where not to."},
 {t:"Tell her the clock doesn't care about drafts.",fx:{R:4,E:4,foe:{why:"what you said about the clock and the draft",poisons:"committee"}},say:"It is honest advice. It is also the only thing anyone says to her that year, and she remembers the room, the phrasing, and the date."}]},

/* ---------- SENIOR: ADMINISTRATION ---------- */
{id:"S1",ti:"The Strategic Plan",b:[3,4],ex:{base:1},tr:"pres",
 sc:"The dean has commissioned a strategic plan. It has five pillars. The word “excellence” appears in four of them and the fifth is about excellence.",
 ch:[
 {t:"Write the section on research excellence.",fx:{K:9,N:5,B:4},say:"You discover that whoever writes the document decides which departments exist in five years. Nobody else has noticed this. You do not point it out."},
 {t:"Attend and say nothing.",fx:{K:2,B:2},say:"Four hours. A branded notebook. Lunch was good."},
 {t:"Say out loud that it is meaningless.",fx:{E:7,N:-6,foe:{why:"you called the strategic plan meaningless, in the meeting",poisons:"search"}},say:"It is meaningless, and you are entirely right, and the room agrees with you privately for years, and the dean who wrote it is provost by 2038."}]},

{id:"S2",ti:"The Retreat",b:[3,4],ex:{base:.9},tr:"pres",
 sc:"Two days at a hotel with a lake. There is a facilitator. There is a flip chart. At 4 p.m. on day one, real decisions begin to be made by whoever is still in the room.",
 ch:[
 {t:"Stay in the room.",fx:{K:11,N:6,B:7},say:"By Saturday evening there are six of you, a bottle, and the actual allocation of nine faculty lines. This is the university. Everything else is the website."},
 {t:"Leave after dinner.",fx:{R:4,B:-3},say:"You get four hours of writing in a hotel room. In the morning the line allocation is presented as having been obvious."}]},

{id:"S3",ti:"The Chair's Office",b:[3,4],ex:{base:.9,highK:1.6},ga:{K:40},tr:"pres",once:1,
 sc:"They want you to chair the department. Three years. A course release, a small stipend, and the collected grievances of twenty-eight adults with lifetime job security.",
 ch:[
 {t:"Take it.",fx:{K:14,N:8,S:5,B:10,mod:"office1"},say:"You learn the budget model, the hiring pipeline, and which four people actually decide things. Your research output falls off a cliff, which everyone notices and nobody mentions."},
 {t:"Decline — you have a paper.",fx:{R:7,wip:22,N:-5},say:"The paper is good. Someone else learns the budget model."}]},

{id:"S4",ti:"The Hiring Meeting",b:[3,4],ex:{base:1},
 sc:"Two candidates. One is plainly better and would be visibly, permanently better than three people in the room. The other is fine and would be grateful.",
 ch:[
 {t:"Fight for the better one.",fx:{K:5,R:3,N:-3,flag:"GOODHIRE"},say:"You win by one vote after two hours. She arrives, is excellent, and within a decade is the reason anyone outside the building says the department's name."},
 {t:"Let the room have the grateful one.",fx:{N:6,K:3},say:"Unanimous, quick, and everyone goes to lunch pleased with themselves. The department is imperceptibly worse every year forever, at a rate nobody can attribute to anything."}]},

{id:"S5",ti:"The Board Dinner",b:[3,4],ex:{base:.7,highK:1.4},ga:{K:50},tr:"pres",
 sc:"{trustee} has been seated next to you. He made his money in logistics software and he would like to know, sincerely, what economics has learned in the last thirty years.",
 ch:[
 {t:"Tell him honestly.",fx:{K:4,N:3,flag:"CANDID"},say:"You say: a great deal about measurement, much less about prediction than people assume. He listens, genuinely. He does not give the university any money, and he does remember you."},
 {t:"Tell him what he wants to hear.",fx:{N:8,K:5,E:4,S:2},say:"Incentives, data, evidence-based policy, a phrase about human capital. He is delighted. Eighteen months later there is a building with a name on it, and you are on the committee that chose the name."}]},

/* ---------- SENIOR: RESEARCH / PRIZE ---------- */
{id:"N1",ti:"The Paper",b:[3,4],ex:{base:.8,highR:2},ga:{R:62},tr:"nobel",once:1,
 sc:"It has been in your head for two years: the one that would reframe the thing rather than extend it. It is a four-year bet and it fails completely or it doesn't.",
 ch:[
 {t:"Clear the desk. Take the bet.",fx:{B:16,R:5,mod:"bigpaper",flag:"THEPAPER"},say:"You cancel two revisions and a keynote. For four years you publish almost nothing and people begin to use the past tense about you at dinner."},
 {t:"Not this decade.",fx:{wip:30,R:3},say:"You write three good extensions instead. They are cited well. You think about the other thing on aeroplanes."}]},

{id:"N2",ti:"The Editor's Letter",b:[3,4],ex:{base:.8,highMom:2},ga:{N:50},
 sc:"They want you on the board of one of the four. It is unpaid, it is enormous, and saying the word out loud at dinner parties does something to a room.",
 ch:[
 {t:"Accept.",fx:{N:11,mom:10,E:7,B:8,flag:"EDITOR"},say:"You now decide, in part, what the field is. You will handle 140 papers a year and read perhaps forty of them properly, and the other hundred will be decided by people you chose."},
 {t:"Decline — the time.",fx:{R:6,wip:24},say:"They ask someone else, who is delighted, and who will now be deciding what the field is."}]},

{id:"N3",ti:"The Nomination",b:[3,4],ex:{base:.7,highMom:2.2},ga:{N:45},tr:"nobel",
 sc:"A prize — not the prize, but a real one — has a nomination window. Someone would have to write the letter. Nobody has offered.",
 ch:[
 {t:"Ask a friend to nominate you.",roll:{stat:"E",pivot:52,
   win:{fx:{mom:16,P:5,E:6,flag:"ASKED"},say:"He writes it gladly and well. You are shortlisted, which is itself a fact that gets reported, and facts that get reported generate further facts."},
   lose:{fx:{N:-4,E:-6},say:"A long pause on the phone. “Of course — I'd assumed someone already had.” Nobody had, and now two people know you asked."}}},
 {t:"Wait to be nominated.",fx:{R:3},say:"The window closes. It is won by someone whose friend was less embarrassed than yours."}]},

{id:"N4",ti:"The Festschrift",b:[4,4],ex:{base:.5,highMom:1.6},once:1,
 sc:"Your students are organising a conference in your honour. There will be a volume. There will be a dinner at which people say true things about you in the past tense while you sit there.",
 ch:[
 {t:"Be moved by it.",fx:{N:6,E:5,mom:6,flag:"FEST"},say:"Eleven of them came. Two flew from Seoul. The volume is uneven and the dinner is not, and you find yourself unable to speak for a moment at the end, which everyone politely ignores."},
 {t:"Suggest it's premature.",fx:{E:8,mom:-4},say:"It goes ahead anyway, a year later, slightly smaller."}]},

{id:"N5",ti:"The Podcast",b:[3,4],ex:{base:.7,highP:1.8},
 sc:"Three hours, no edit, an audience of 900,000 and a host who has read one of your papers and the Wikipedia page for game theory.",
 ch:[
 {t:"Do it.",fx:{P:14,N:5,mom:8,R:-3,B:5},say:"You are lucid for two hours and tired for the third, and it is the third that gets clipped. For eleven years strangers will quote a sentence at you that you would like to revise."},
 {t:"Decline politely.",fx:{R:3},say:"A colleague does it instead and is, within two years, the economist the country has heard of."}]},

{id:"N6",ti:"The Replication",b:[3,4],ex:{base:.6,spec:2.4},ga:{flag:"SPEC"},once:1,
 sc:"A team of graduate students, entirely without malice, have re-run everything in your 2031 paper. They have written to you first, which is a courtesy, and they have found what you already knew was there.",
 ch:[
 {t:"Post a correction yourself, immediately.",fx:{R:-4,N:5,E:-8,flag:"CORRECTED"},say:"It costs you the paper and, briefly, a great deal of standing. Fifteen years later it is the single thing about you that junior people mention approvingly, and they mention it often."},
 {t:"Write a robustness appendix defending it.",fx:{E:6,R:-2,foe:{why:"the forty-page appendix, which was aimed at them",poisons:"referee"},flag:"DEFENDED"},say:"It is forty pages and it is sufficiently technical that the dispute dies of exhaustion rather than resolution. The paper survives. So does the thing behind your eyes."}]},

/* ---------- GENERAL / LIFE ---------- */
{id:"G1",ti:"The Grant",b:[1,4],ex:{base:.9},
 sc:"A major council grant. The application is 60 pages, the success rate is 11%, and the budget justification alone will take a fortnight.",
 ch:[
 {t:"Write it.",roll:{stat:"K",pivot:38,
   win:{fx:{R:6,K:7,N:5,S:3,mom:6,flag:"FUNDED"},say:"Funded. Two postdocs, four years, and a line on the letterhead. Half the value is the money and half is that the committee has now read your name approvingly, which is a different asset entirely."},
   lose:{fx:{B:8,E:-5},say:"Rejected, with three referee comments totalling ninety words, one of which misspells your surname. The fortnight is gone and unrecoverable."}}},
 {t:"Skip it and write the paper.",fx:{R:6,wip:26},say:"A defensible allocation that the dean will mention, in aggregate, in a slide about departmental grant income."}]},

{id:"G2",ti:"The Reading Group",b:[0,3],ex:{base:.7},
 sc:"Six people, Thursday evenings, no credit, no minutes, arguing about a literature none of you work in.",
 ch:[
 {t:"Go every week.",fx:{R:5,N:5,B:3,flag:"THURSDAYS"},say:"It is the only room in the building where anyone changes their mind about anything. Two of your best three papers come out of it, and neither will ever cite it."},
 {t:"Stop going in November.",fx:{B:-4},say:"Thursday evenings return to you. You use them, mostly, to be tired earlier."}]},

{id:"G3",ti:"The Private Sector",b:[2,4],ex:{base:.5,lowS:2},once:1,
 sc:"A hedge fund would like a conversation. Then a bank. Then, more seriously, a tech company with a research division and an actual interest in your methods. The number they say out loud is roughly four times the number on your payslip.",
 ch:[
 {t:"Listen, and stay.",fx:{E:6,S:2,flag:"TEMPTED"},say:"You use it, correctly, as a negotiating fact. You also now know the number, permanently, and it sits next to every committee meeting for the rest of your life."},
 {t:"Take the consultancy, keep the job.",fx:{S:12,R:-3,N:3,B:6},say:"Two days a month and a great deal of money. The papers slow. Nobody says anything, because most of them are doing it too."},
 {t:"Leave academia.",fx:{ending:"EXIT"},say:""}]},

{id:"G4",ti:"The Sabbatical",b:[2,4],ex:{base:.8,highB:2.4},
 sc:"A term. The form asks for a research plan. You have not slept properly since the tenure clock started and the honest research plan is “lie down.”",
 ch:[
 {t:"Actually rest.",fx:{B:-30,R:2,E:-3},say:"You read things that are not in your field. In week nine an idea arrives, unbidden, while you are doing something else, which is the only way ideas have ever arrived."},
 {t:"Use it to write three papers.",fx:{R:9,wip:44,B:4},say:"Three papers. You return exactly as tired as you left, having spent the one instrument the institution gives you for not being tired."}]},

{id:"G5",ti:"The Dinner",b:[1,4],ex:{base:.6},
 sc:"Your partner asks, not unkindly and not for the first time, whether there is a year in which this gets easier.",
 ch:[
 {t:"“After tenure.”",fx:{B:4,E:2},say:"You believe it when you say it. So, for about another three years, do they."},
 {t:"Say the true thing: no.",fx:{B:-8,N:-2,flag:"TRUTHFUL"},say:"A long silence, and then something that is not quite relief but is adjacent to it. You take Saturdays after that, most weeks, and your output falls by a margin the profession can measure and you cannot feel."}]},

{id:"G6",ti:"The Obituary",b:[3,4],ex:{base:.5},once:1,
 sc:"{advisorS} has died. The department asks you to write the appreciation for the newsletter. You have not spoken to him in nine years, for a reason you would struggle to state out loud.",
 ch:[
 {t:"Write it warmly.",fx:{N:4,E:-3,flag:"OBIT"},say:"Eight hundred words, all of them true, none of them complete. His widow writes to thank you. You put the letter in the drawer with the chapter he never read."},
 {t:"Let someone else do it.",fx:{},say:"Someone does. It is fine. It mentions you, in a list."}]},
/* ================================================================
   BATCH 2 — from Steffen's sketches, then twenty more
   ================================================================ */

/* ---------- early: the proof, the discussant, the visit ---------- */
{id:"P7",ti:"The Proofs",b:[0,2],ex:{base:.9},ga:{queue:1},once:1,
 sc:"“{qpaper}” is accepted at {qjournal}. You are reading the proofs — the typeset pages, the last moment anything can change — and in Lemma 2 you see it. The inequality goes the wrong way. The result survives, probably, with a different argument you do not currently have.",
 ch:[
 {t:"Write to the editor tonight.",fx:{R:4,N:3,B:5,mod:"delay",flag:"OWNED_ERROR"},say:"The editor is, unexpectedly, gracious: “better now than in a comment.” Publication slips a year. The corrected lemma will be better than the original, and nobody but the two of you will ever know there was a first version."},
 {t:"Fix it in the proofs. Say nothing.",fx:{E:3,mod:"publish",flag:"SILENT_FIX"},say:"You rewrite two lines under the heading “typographical corrections.” The typesetter does not read mathematics. It goes through. For about three years you will feel a small cold thing whenever anyone cites Lemma 2."},
 {t:"It's a lemma. Let it go.",fx:{R:-2,mod:"publish",flag:"LEFT_ERROR"},say:"It goes through. The lemma will be wrong in print. The result, as it happens, is true anyway — which is not the same as the proof being right, and one day a graduate student with time on their hands will notice the difference."}]},

{id:"G12",ti:"The Graduate Student With Time",b:[2,4],ex:{base:.6},ga:{since:["LEFT_ERROR",8]},once:1,
 sc:"An email from a second-year at Ostrander State, {prewitt}, with a PDF attached. The PDF is four pages long and its title is “A Note on Lemma 2.” It is polite, correct, and already on the working paper series.",
 ch:[
 {t:"Reply warmly. Concede in print.",fx:{R:2,N:5,E:-5,flag:"CONCEDED"},say:"You write back the same day and post a corrigendum the same week. The student, who had braced for a war, is disarmed and slightly disappointed. Years later they say you were “decent about it,” which is what the profession says instead of “right.”"},
 {t:"Reply coolly. Note that the result holds.",fx:{E:4,N:-4,foe:{why:"you patronised them about Lemma 2",poisons:"referee"}},say:"Your reply is two paragraphs and uses the phrase “as is well known.” The result does hold. The student, who is now in their fourth year and will one day referee something of yours, has a file."}]},

{id:"P8",ti:"The Discussant",b:[0,2],ex:{base:1},
 sc:"Session 4B. Your discussant is {discussant}, whose name is on the theorem you extended, and he has decided, in front of forty people, that your identification is “not merely wrong but confused.” He is wrong. You know exactly why he is wrong. He is also the person who will referee this.",
 ch:[
 {t:"Push back, on the spot.",roll:{stat:"R",pivot:40,
   win:{fx:{R:4,N:5,mom:7,E:6},say:"You take him through it in ninety seconds, slowly, the way you would explain it to a student. Silence, then somebody at the back says “that's right, actually.” He does not concede. The room does, and the room is what travels."},
   lose:{fx:{E:-8,N:-3,foe:{why:"you corrected them in Session 4B, badly",poisons:"referee"}},say:"You are right and you are flustered, and flustered is what forty people saw. He smiles. “We'll take this offline.” Offline is where he referees things."}}},
 {t:"Thank him for the excellent point.",fx:{N:3,E:-5,flag:"ACQUIESCED"},say:"“That's very helpful, thank you, I'll think about it.” You will not think about it, because there is nothing to think about. He beams. Two people who understood the paper look at you with something that is not quite contempt."},
 {t:"Say nothing. Let the chair move on.",fx:{E:-2},say:"The session runs over. Nobody remembers your paper; everybody remembers his sentence. That is what a discussant is for."}]},

{id:"P9",ti:"The Visit",b:[1,2],ex:{base:.9},once:1,
 sc:"Eleven months of video calls with {calderon} at Calderon — the best project you have ever been near. You fly out for the week that was going to finish it. In his office is another postdoc, at the whiteboard, using your notation. Nobody has told you anything, which is itself the information.",
 ch:[
 {t:"Say it out loud, in the office.",fx:{N:-5,E:4,B:4,foe:{why:"you made a scene in their office about a coauthorship",poisons:"referee"}},say:"He is startled that you would raise it. Startled is the key word: it had not occurred to him that this required a conversation. You are off the project by Friday, cleanly, with an acknowledgment footnote promised and, to be fair, delivered."},
 {t:"Say nothing. Go home.",fx:{E:-6,B:6,flag:"REPLACED_SILENT"},say:"You stay the week. You are useful. You fly home with your name in the acknowledgments. The paper, when it appears, will do very well — you know that already, and it is the whole of the difficulty."}]},

{id:"G13",ti:"The Paper You Weren't On",b:[1,4],ex:{base:.7},ga:{since:["REPLACED_SILENT",6]},once:1,
 sc:"{calderonS}'s paper is everywhere. Two hundred citations in its first year, a policy brief, a line in a central banker's speech. Your notation is on every slide. The acknowledgments thank you “for early conversations.” A junior colleague forwards it to you, not unkindly, with the subject line “isn't this your thing?”",
 ch:[
 {t:"Write to him now, and copy the journal.",roll:{stat:"E",pivot:55,
   win:{fx:{R:5,N:-4,mom:5,E:8,submit:{tier:"A+",lag:[1,2],cites:180,jn:"the Quarterly"},flag:"CRIED_FOUL_LATE"},say:"A corrigendum is going through, adding your name. It is the least gracious document in the journal's history. Your citation count is about to double, and three people in the field have stopped replying to your emails."},
   lose:{fx:{N:-8,E:-6,foe:{why:"you tried to claim their paper two years after the fact",poisons:"committee"}},say:"He replies at length, copying the other coauthor, with a timeline. The timeline is accurate and devastating: eleven months and no draft. The junior colleague who forwarded it never mentions it again."}}},
 {t:"Let it be his.",fx:{R:3,flag:"LET_IT_GO"},say:"You cite it, correctly, in your next three papers. Somewhere in the discipline's oral tradition your name is attached to it in a subordinate clause, and that clause, it turns out, is worth something after all."}]},

{id:"D4",ti:"Istanbul",b:[1,3],ex:{base:.9},
 sc:"The conference dinner is on a roof above the Bosphorus and the rakı arrives before the food. The senior people are at the far end of the table. Somewhere around the third glass, the far end stops being far.",
 ch:[
 {t:"Stay. Drink. Bond.",fx:{N:9,B:7,E:3,mom:3},say:"By one in the morning you have been told which editor is “finished,” who is leaving Pelham, and the real reason a famous paper has never been replicated. You remember about half of it and are remembered by all of it. This is what the field means by “community.”"},
 {t:"Go home early. You present at nine.",fx:{R:3,B:-3},say:"Your talk at nine is crisp, to a room of eleven, four of whom are asleep. The far end of the table remembers that you left."}]},

{id:"D5",ti:"The Email",b:[1,2],ex:{base:.9},once:1,
 sc:"Subject line: “Really liked your talk.” The sender is {star}: thirty-four, two papers in the Quarterly, and is the person everyone at your stage would give a year to be. The email is three lines long. The third line proposes you write the next version of “{paper}” together.",
 ch:[
 {t:"Say yes.",fx:{N:10,mom:9,R:2,submit:{bias:1.8,lag:[3,4],q:8},flag:"STAR_COAUTHOR"},say:"The draft is finished in five months and goes out under two names — his first, alphabetically and otherwise. It will be the first time anyone outside your building has known your name, and the seminar invitations that follow will be addressed to him."},
 {t:"Say thank you, and keep it yours.",fx:{R:5,E:3,submit:{bias:-0.6,lag:[6,8],rounds:1},flag:"KEPT_IT"},say:"It goes out with one name on it and will take longer and land lower. When people describe it, they will describe the result and not the person, which is either the point or the price."}]},

/* ---------- mid: boards and editors ---------- */
{id:"A8",ti:"The Board of the Bulletin",b:[2,4],ex:{base:.8},once:1,
 sc:"The Bulletin of Applied Economics invites you to join its editorial board. It is the journal you would send something to as a last exit, and both of you know it. The invitation mentions your “growing reputation” twice.",
 ch:[
 {t:"Accept. A line is a line.",fx:{K:3,N:2,P:-2,flag:"BULLETIN_BOARD"},say:"Your CV acquires a line. Eleven manuscripts a year arrive, none of which should have been written. A colleague at Pelham, reading your web page, says “oh” in a particular tone."},
 {t:"Decline, politely.",fx:{},say:"They ask someone else, who accepts, and whose CV now has a line. Nothing else changes. Integrity is very quiet."}]},

{id:"A9",ti:"The Board of the Journal",b:[2,4],ex:{base:.8,highMom:1.2},ga:{N:35},once:1,
 sc:"The Journal of Economic Theory and Practice wants you on its board. This is a real journal and a real job: forty manuscripts a year, a meeting in April, an editor who notices when reports are late. The line on the CV is worth something. So is the time.",
 ch:[
 {t:"Accept.",fx:{N:7,mom:5,K:4,tax:8,flag:"ED_BOARD"},say:"For the next four years you are one point down every term. You did not agree to that in so many words. Nobody ever does."},
 {t:"Decline, citing the clock.",fx:{R:3,N:-2},say:"The editor understands, in the way editors understand things, which is to say she remembers."}]},

{id:"N7",ti:"Co-editor of the Review",b:[3,4],ex:{base:.8,highMom:1.6},ga:{N:55,R:50},once:1,
 sc:"The Review would like you as a co-editor. Three hundred papers a year across your desk, a term of five years, a name on the masthead that changes how rooms treat you. It will cost, in every term of those five years, time you do not have.",
 ch:[
 {t:"Accept.",fx:{N:12,mom:14,E:8,K:5,tax:10,flag:"COEDITOR"},say:"You now decide, in part, what the field is. For five years you are one point down every term, and for the rest of your life people will tell you, at conferences, which of their papers you rejected."},
 {t:"Decline.",fx:{R:6,wip:20},say:"They ask a colleague at Calderon, who accepts, and who now decides what the field is, including the part of it you work in."}]},

{id:"E1",ti:"The Laureate's Paper",b:[3,4],ex:{base:1.2},ga:{flag:"COEDITOR"},once:1,
 sc:"A submission from {laureate}. It is, by any honest reading, not good: a twenty-year-old idea with new notation and no result. The referees will know who wrote it; everyone knows how he writes. Your name will be on the decision letter.",
 ch:[
 {t:"Reject it. Politely. Yourself.",fx:{R:4,E:6,K:3,foe:{why:"you rejected their paper at the Review",poisons:"committee"},flag:"REJECTED_LAUREATE"},say:"The letter is two paragraphs and takes you a weekend. He replies to the managing editor, not to you, asking whether the Review has “changed its standards.” It has not; that is the problem. He sits on two committees you will care about."},
 {t:"Send it to referees who will do it for you.",fx:{K:5,N:2,B:4},say:"The referees are brave the way referees are brave, which is anonymously. The rejection carries their reports and your signature. He knows exactly who chose the referees. This is the ordinary form of editorial courage, and it is not nothing."},
 {t:"Accept it. Minor revisions.",fx:{N:6,E:-4,R:-3,flag:"WAVED_LAUREATE"},say:"It appears. It is cited nine times, all by him. A graduate student at Pelham writes a post titled “How Did This Get In?” that gets forty thousand views and does not mention your name, which is the last kindness the internet will do you."}]},

{id:"E2",ti:"The Glowing Report",b:[3,4],ex:{base:1.1},ga:{flag:"COEDITOR"},once:1,
 sc:"One of the two reports on a paper you are handling is remarkable: generous, detailed, plainly written by someone who has thought about the problem for years. You are drafting the acceptance when you check the referee's web page and find the author's name on three of their papers.",
 ch:[
 {t:"Discard the report. Get a third.",fx:{K:6,N:-2,B:4,flag:"CAUGHT_IT"},say:"The third report is lukewarm. The paper is rejected, and the author, who never knew how close it came, blames the Review's “declining standards.” The referee, who knows exactly what happened, never referees for you again."},
 {t:"Accept the paper. The report is, after all, correct.",fx:{E:3,N:4,flag:"LET_IT_THROUGH"},say:"It is a good paper. That was never the question. Two years later the editorial board adopts a conflict-of-interest form, and the managing editor, introducing it, looks at nobody in particular."},
 {t:"Write to the referee and ask them to explain.",fx:{K:3,N:-4,E:2,foe:{why:"you accused them of a conflict of interest",poisons:"referee"}},say:"They explain, at length, that co-authorship “in a different area” is not a conflict, and that they are offended you would suggest it. They are, as it happens, on the Review's board. The paper is rejected anyway, which nobody will let you forget."}]},

/* ---------- the chair: five things nobody prepares you for ---------- */
{id:"C1",ti:"The Petty Cash",b:[3,4],ex:{base:1.1,office:1.5},ga:{office:1},once:1,
 sc:"You are chair. {admin}, the department administrator, whom you have known for nine years, has been taking money from the petty cash — not a great deal, over a long time, with a consistency that in another context would be called discipline. The bursar has the spreadsheet. The bursar would like to know what you intend to do.",
 ch:[
 {t:"Report it. It isn't yours to forgive.",fx:{K:6,N:-4,B:6,flag:"REPORTED_CASH"},say:"She is gone in a month. The department loses the only person who knew how the room bookings worked, and for a year nothing gets booked. Several colleagues feel you could have handled it “more humanely,” by which they mean without them noticing."},
 {t:"Handle it quietly. Repayment, resignation, no file.",fx:{K:3,N:3,B:4,flag:"QUIET_CASH"},say:"She repays it and leaves “for family reasons.” Everyone is grateful. Eighteen months later the bursar's successor finds the spreadsheet, and the question becomes not what she did but why there is no record of what you did."}]},

{id:"C2",ti:"The Email to the MSc",b:[3,4],ex:{base:1.1,office:1.5},ga:{office:1},once:1,
 sc:"At 11:40 p.m. every student on the MSc receives an email containing a racial slur and the name of a lecturer. By 8 a.m. it is on two student forums and one national newspaper site, and {dean}'s office has called your mobile, which it has never done before.",
 ch:[
 {t:"Statement by nine. Investigation by noon. Name nothing.",fx:{K:9,B:10,N:2},say:"The statement is four sentences and says nothing anyone could object to, which is its purpose. The investigation takes three months and finds a compromised account. Nobody thanks you for the four sentences. Three colleagues think they were too weak and two think they were too strong, and the newspaper never runs a follow-up."},
 {t:"Wait for the facts before saying anything.",fx:{K:-4,N:-6,B:12,P:-3},say:"By noon the silence is the story. The Dean issues a statement instead, which names the department and implies you. You learn that in this job the facts arrive after the verdict, and the verdict is about whoever spoke last."}]},

{id:"C3",ti:"The Complaint",b:[3,4],ex:{base:1,office:1.5},ga:{office:1},once:1,
 sc:"Two colleagues who have hated each other since 2031 have each filed a formal complaint of bullying against the other, on the same day, with the same HR officer. One of them cried in your office. Then the other one did. The HR officer would like a “chair's view.”",
 ch:[
 {t:"Give a view. Say what you actually think happened.",fx:{K:5,N:-5,E:3,foe:{why:"you took the other side in the complaint",poisons:"vote"}},say:"Your view is careful and accurate, and one of them will never forgive it. The other will never thank you, because being believed is not gratitude-shaped. The case takes eleven months and concludes that “communication could be improved.”"},
 {t:"Decline to have a view. Process, not people.",fx:{K:4,N:-2,B:5},say:"You say “I think this needs to go through the proper process” eleven times in one meeting. Both of them conclude you are a coward. HR concludes you are helpful. Everyone is correct."},
 {t:"Get them in a room and sort it.",roll:{stat:"K",pivot:55,
   win:{fx:{K:8,N:6,flag:"PEACEMAKER"},say:"Forty minutes, no minutes taken, a great deal of shouting, then something that in another department would be called an apology. It holds for six years. Nobody knows what you did and you cannot tell them."},
   lose:{fx:{K:-3,N:-6,B:8,foe:{why:"you put them in a room with their enemy",poisons:"vote"}},say:"It goes as badly as a meeting can go without furniture. One of them files a third complaint, about you, for holding the meeting. HR asks, in a tone, whether you had “considered the process.”"}}}]},

{id:"C4",ti:"Shouted At",b:[3,4],ex:{base:1,office:1.4},ga:{office:1},
 sc:"{shouter}, who has a named chair and no recent papers, stands in your office and shouts at you for eleven minutes about his teaching load, which is nine hours a year. You can hear the administrator in the corridor deciding not to come in.",
 ch:[
 {t:"Let him finish. Say “noted.” Change nothing.",fx:{K:4,E:-3,B:5},say:"He leaves with the feeling of having been heard, which is most of what he came for. His load remains nine hours. Your administrator brings you a coffee without being asked, which is the department's highest honour."},
 {t:"Shout back.",roll:{stat:"E",pivot:55,
   win:{fx:{E:6,N:3,K:2},say:"He is so surprised that he stops. Nobody has raised their voice to him since 2019. A week later he sends a paper to the reading group, unprompted. Something has been restored that you did not know was missing."},
   lose:{fx:{E:-4,N:-5,foe:{why:"you shouted at them in your own office",poisons:"vote"}},say:"It becomes, within the hour, “the chair lost it.” He tells it well. He has told stories for a living for forty years."}}},
 {t:"Give him a course release to make it stop.",fx:{K:-3,N:2,B:-2,flag:"PAID_OFF"},say:"It stops. Every other full professor learns, by Tuesday, that shouting works. You have set a price, and the price was low."}]},

{id:"C5",ti:"The Breach",b:[3,4],ex:{base:1,office:1.5},ga:{office:1},once:1,
 sc:"A spreadsheet with every colleague's salary, and several people's medical leave, has been sitting on a shared drive with the wrong permissions for a month. You know who did it: a well-meaning person who would be destroyed by a formal process. Nobody outside the department knows yet.",
 ch:[
 {t:"Fix it yourself. Quietly. No process.",fx:{K:3,N:3,B:6,flag:"QUIET_BREACH"},say:"Permissions corrected, a quiet word, a note in a drawer. The person is grateful in a way that is almost unbearable. You have done the humane thing and, in the College's terms, the wrong one, and the College's terms are the ones written down."},
 {t:"Report it. Start the process.",fx:{K:7,N:-6,B:8,flag:"REPORTED_BREACH"},say:"The investigation takes seven months and ends the well-meaning person's career, which everyone agrees was disproportionate and nobody could stop. You are described, in a corridor, as “by the book,” which is not a compliment in this building."}]},

{id:"C6",ti:"The Envelope",b:[3,4],ex:{base:1.4},ga:{since:["QUIET_BREACH",4]},once:1,
 sc:"An email from an address that does not exist. It contains three lines from the salary spreadsheet and a request for a course allocation that would not otherwise be made. It notes, helpfully, that you chose not to report the breach.<br><br>The College, when you tell them, insists on an investigation — and informs you that you will not be leading it, for the simple reason that you are now a suspect.",
 ch:[
 {t:"Cooperate fully. Hold the blame.",fx:{K:5,N:-5,E:-8,B:12,flag:"HELD_BLAME"},say:"Four months. Your emails are read by a lawyer. You are cleared, in a letter that uses “regrettable” about the process and “appropriate” about the outcome. Nobody is ever caught. What you learn, afterwards, is that when something bad happens blame must be assigned, and you had it in your hands and did not move it on."},
 {t:"Move the blame on. Name the person who left the file.",fx:{K:8,N:-3,E:2,foe:{why:"you named them to the investigation to save yourself",poisons:"vote"},flag:"MOVED_BLAME"},say:"The investigation has a name and stops looking for another. You are chair for the rest of your term and something else for the rest of your life. The well-meaning person leaves academia. You have learned the lesson everyone who survives this job learns, and you do not like having learned it."},
 {t:"Resign the chair. Let someone else hold it.",fx:{K:-6,N:2,B:-10,mod:"resignOffice",flag:"RESIGNED_CHAIR"},say:"The Dean accepts with visible relief and a paragraph about your “contribution.” The investigation continues without you and finds nothing. You go back to your papers, which have been waiting, and which do not blackmail anyone."}]},

/* ---------- any stage: gods and editors ---------- */
{id:"G7",ti:"The God's Footnote",b:[1,4],ex:{base:.8,highR:.8},once:1,
 sc:"The paper has four thousand citations and a name on it that appears in the textbook. Its main result depends on an assumption in footnote 11 that, you have realised on a Sunday, does not hold. You have checked four times. It is Sunday evening and nobody knows but you.",
 ch:[
 {t:"Write a comment. Submit it to the same journal.",roll:{stat:"R",pivot:50,
   win:{fx:{R:8,mom:10,P:6,N:3,E:8,submit:{tier:"A+",lag:[4,5],cites:90,f:"theory"},flag:"CORRECTED_GOD"},say:"It goes out to his journal. It will take two years and a referee who is plainly him, and it will be cited more than any paper you have written. He will never acknowledge it. Three of his students, over the years, will tell you quietly that you were right."},
   lose:{fx:{R:2,E:-8,N:-4,foe:{why:"you wrote a comment on their famous paper",poisons:"referee"}},say:"Rejected — “technically correct but of limited interest.” The editor was his student. The paper keeps its four thousand citations and gains the next four thousand. You have made an enemy of a textbook."}}},
 {t:"Write to him privately.",roll:{stat:"N",pivot:45,
   win:{fx:{N:8,R:3,mom:4,flag:"GOD_GRATEFUL"},say:"He replies in nine minutes. “You're right. Nobody has noticed in twenty years.” A corrigendum appears with your name in the acknowledgments. He writes you a letter, unasked, four years later, at exactly the moment you need one."},
   lose:{fx:{E:-3},say:"No reply. Then, eight months later, a working paper by him and a student “clarifying” footnote 11, with no mention of your email. You have been useful. It is not the same as being cited."}}},
 {t:"Leave it. Gods are for other people to fight.",fx:{B:-2,E:-2},say:"Footnote 11 stands. Somebody else finds it in 2044 and gets a job at Harwich for the comment. You read the comment in your office and recognise every step."}]},

{id:"G8",ti:"The Editor's Friend",b:[1,4],ex:{base:.9,lowMom:.8},ga:{queue:1},
 sc:"“{qpaper}” is rejected at {qjournal}. Two reports: one has misread the model, the other has misread the first report. The editor's letter agrees with both and is signed by {editor}, who has dinner, monthly, with everyone you have ever been compared to.",
 ch:[
 {t:"Appeal, with a point-by-point.",roll:{stat:"N",pivot:55,
   win:{fx:{R:3,N:4,mom:5,mod:"accept"},say:"A third referee. Nine months. The acceptance, when it comes, will read as if the whole thing had been the editor's idea. You have learned that appeals work exactly when you are already known, which is the one case in which you do not need them."},
   lose:{fx:{E:-6,N:-4,mod:"reject",foe:{why:"you appealed their rejection in writing",poisons:"referee"}},say:"“The decision stands.” Four words. The paper is back in the drawer. He handles a third of the field's submissions and now recognises your name, which is not the kind of recognition you were building toward."}}},
 {t:"Send it down a tier, tomorrow.",fx:{E:-3,mod:"resubmit"},say:"It goes out again in the morning, one tier down. Something about the paper's ambition quietly resizes itself to fit."},
 {t:"Send him the email you are composing in your head.",fx:{E:6,N:-8,B:-4,mod:"reject",foe:{why:"you sent them the email",poisons:"referee"}},say:"It is a very good email. It is forwarded, by him, to nine people, with no comment, because none is needed. The paper is back in the drawer. For a decade you will be introduced at conferences with a slight pause before your name."}]},

/* ---------- twenty more ---------- */
{id:"P10",ti:"The Cohort",b:[0,0],ex:{base:1},once:1,
 sc:"{rival} has a job talk at Harwich. She started the same September you did. At the lunch where this is mentioned, nobody looks at you, which is how you learn that everyone had been wondering.",
 ch:[
 {t:"Congratulate her. Mean it.",fx:{N:5,E:-3,flag:"GRACIOUS"},say:"She remembers. In a profession this small, remembering is a currency; in eleven years she is on a search committee reading your file, and says “they were decent to me when it cost something.”"},
 {t:"Ask her for her slides.",fx:{R:4,K:2,E:-2},say:"They are extremely good. You learn what a job market paper looks like when it is actually finished, which nobody had shown you. Envy has, occasionally, a syllabus."},
 {t:"Say nothing and work until two.",fx:{R:3,wip:15,B:6,E:2},say:"The work is good. The lunch was worse than the work was good, and you will remember the lunch."}]},

{id:"P11",ti:"The Advisor's Name",b:[0,0],ex:{base:1},once:1,
 sc:"Your job market paper is done. {advisorS}, who has read it twice and improved it once, mentions — lightly, as if it were the weather — that it “might travel better” with his name on it. He is, in the sense that matters, not wrong.",
 ch:[
 {t:"Add his name.",fx:{N:6,mom:6,R:-2,E:-4,flag:"SHARED_JMP"},say:"It travels. Three flyouts become six. At every one of them someone asks, kindly, what your contribution was. You have a good answer. You will give it for a decade."},
 {t:"Keep it single-authored.",fx:{R:5,E:4,N:-3},say:"Three flyouts. He is gracious about it, and slightly less available for the letter, which arrives late and is one paragraph shorter than the one he wrote for the person who said yes."}]},

{id:"D6",ti:"The Second Postdoc",b:[1,1],ex:{base:1.2},once:1,
 sc:"The market has produced no job. It has produced another postdoc, at Bellweather, two years, slightly more money. Everyone says two postdocs is fine now. Everyone who says it has a job.",
 ch:[
 {t:"Take it. Two more years to write.",fx:{R:5,wip:20,B:5,E:-4,S:4,flag:"SECOND_POSTDOC"},say:"Two years. The papers get better. The word “postdoc” on your conference badge acquires a faint smell that you can detect and nobody mentions."},
 {t:"Take the teaching job at Cranmoor A&M instead. A real line.",fx:{K:5,S:8,R:-3,B:3,mod:"toCranmoor"},say:"Tenure-track, four courses a year, an office with a door. The papers slow. The door, it turns out, was the thing you wanted, and you were not supposed to want it."}]},

{id:"D7",ti:"The Seminar Dinner",b:[1,2],ex:{base:.9},
 sc:"Dinner after the seminar. You have been seated next to the woman who chairs the hiring committee at Ostrander State, which is not an accident, and she has asked what you thought of the speaker's paper, which was not good.",
 ch:[
 {t:"Say it was not good, and why.",roll:{stat:"R",pivot:35,
   win:{fx:{N:7,R:2,E:4},say:"She agrees, and adds two things you had missed. By dessert you are having the conversation people describe afterwards as “the interview.” It was."},
   lose:{fx:{N:-4,E:-4,foe:{why:"you were rude about their coauthor's paper at dinner",poisons:"search"}},say:"He is her coauthor. This was on the paper. You did not read the paper."}}},
 {t:"Say it was interesting.",fx:{N:2},say:"It was not interesting and she knows it. You have passed the test of being harmless, which is a real test, and not the one you wanted to pass."}]},

{id:"A10",ti:"The First Student",b:[2,3],ex:{base:1},once:1,
 sc:"A second-year, {student}, has asked you to supervise. She is bright, anxious, and will need, over five years, roughly two hundred hours you do not have. The clock does not count students.",
 ch:[
 {t:"Take her on. Properly.",fx:{B:6,N:3,K:2,R:-2,flag:"FIRST_STUDENT"},say:"Two hundred hours becomes three hundred. She finishes in five years and places at Fenwick, then Ostrander. In 2046 she is on a panel and cites you unprompted, and you find you have to look at the ceiling for a moment."},
 {t:"Decline. Suggest someone with tenure.",fx:{R:3,wip:8,E:-2},say:"She goes to someone with tenure who is not very good at it. She finishes anyway; the good ones do. She does not cite you. There was nothing to cite."}]},

{id:"A11",ti:"The Letter Writers",b:[2,2],ex:{base:1},once:1,
 sc:"The chair needs six names for your tenure letters. You may suggest three. One of them could be {discussantS}, who said your identification was “confused,” and who has since, you are told, come round.",
 ch:[
 {t:"Name him. Test it.",roll:{stat:"N",pivot:50,
   win:{fx:{N:6,mom:6,flag:"BRAVE_LETTER"},say:"His letter, you learn years later, was the strongest of the six. “I was wrong about this candidate, and I am rarely wrong.” The committee reads that sentence twice."},
   lose:{fx:{N:-4,B:8,foe:{why:"you asked them for a tenure letter and they said what they thought",poisons:"vote"}},say:"His letter is two paragraphs and uses the word “competent” as if it cost him money. The chair shows it to you afterwards, which chairs are not supposed to do, and says only “well.”"}}},
 {t:"Name three safe people.",fx:{N:2,K:2},say:"Three warm letters from three people nobody has heard of. The committee notes that the letters are “uniformly positive,” in a tone suggesting uniformity was the finding."}]},

{id:"A12",ti:"The Course Nobody Wants",b:[2,4],ex:{base:.9,tdebt:.8},
 sc:"The core econometrics course for the MSc. Two hundred students, four hours a week, a reputation for destroying whoever teaches it. The chair has asked you “as a favour,” which is what it is called when there is no choice.",
 ch:[
 {t:"Teach it. Properly.",fx:{K:4,B:9,R:-2,N:3,flag:"TAUGHT_CORE"},say:"You lose a term. The students are, for once, taught. Nobody on any committee ever reads a teaching evaluation, but the chair remembers who said yes, and the chair is one vote."},
 {t:"Teach it. Badly.",fx:{B:3,N:1},say:"You reuse someone's slides from 2029. The evaluations are terrible and, as far as you can tell, weightless. The clock ticks. This is what the incentives said to do, and you did it, and something small in you has been noted."},
 {t:"Refuse, citing the clock.",fx:{R:3,wip:10,N:-4,foe:{why:"you refused the core course they then had to teach",poisons:"vote"}},say:"An associate professor teaches it instead, badly, and does not forgive you. The clock is a good reason. It is also, in this building, an insult."}]},

{id:"A13",ti:"The Thread",b:[2,4],ex:{base:.7,highP:1.6},
 sc:"You have written eleven posts about a policy paper by a rival. They are correct, funny, and slightly cruel. Your thumb is over the button.",
 ch:[
 {t:"Post it.",roll:{stat:"P",pivot:35,
   win:{fx:{P:11,N:4,mom:6,E:5,R:-2,flag:"THREAD"},say:"Nine thousand shares. Two journalists. A podcast. Your rival replies, badly. For a month you are the economist people have heard of, and the paper you should have been writing is one month older."},
   lose:{fx:{P:5,N:-6,E:-4,foe:{why:"your thread about their paper",poisons:"referee"}},say:"It does not travel. It is seen by the rival, the rival's students, and the rival's friend on the editorial board. You have spent the goodwill of a small profession on a joke nobody laughed at."}}},
 {t:"Delete the draft.",fx:{R:2,B:-1},say:"Eleven posts, unpublished, join the drawer where about forty percent of your best sentences live."}]},

{id:"A14",ti:"The Referee Request",b:[2,4],ex:{base:.8,highR:.6},once:1,
 sc:"The Quarterly asks you to referee a paper. It is by the person whose result you have been racing for two years, and it is, you see within a page, better than yours.",
 ch:[
 {t:"Recuse yourself.",fx:{K:2,N:2,E:-3,flag:"RECUSED"},say:"The editor thanks you and finds someone slower. The paper appears in eighteen months. Yours appears in twenty, in a lower journal, cited in a footnote as “contemporaneous work.” You did the right thing, and it is footnote-shaped."},
 {t:"Referee it. Honestly. Fast.",fx:{R:3,N:4,E:-2,flag:"FAIR_REF"},say:"Your report is the best they get. It appears in nine months. Yours is now a comment on theirs. The editor, who guessed exactly what you were doing, sends a note that says only “thank you — I know.”"},
 {t:"Referee it. Slowly. Thoroughly.",fx:{R:2,E:4,B:4,flag:"SLOW_REF"},say:"Fourteen months and a report that asks for a different paper. Yours comes out first. Nobody can prove anything. You know, and the editor suspects, and the author — who will one day sit on something you want — has a theory."}]},

{id:"S6",ti:"The External Review",b:[3,4],ex:{base:.9,highK:.8},ga:{K:30},once:1,
 sc:"Every seven years three people from other universities spend two days deciding whether your department exists. The chair has asked you to write the self-study, a ninety-page document whose only purpose is to be skimmed.",
 ch:[
 {t:"Write it. Make it say what the department should become.",fx:{K:10,N:5,B:8,flag:"SELF_STUDY"},say:"Ninety pages. The reviewers quote four of them in their report, and those four become policy. You have discovered that the person who writes the document is the person who decides, and that nobody else has noticed."},
 {t:"Write it. Copy last time's and update the numbers.",fx:{K:3,B:3},say:"It is skimmed, as intended. The reviewers recommend what they recommended last time. Nothing changes, which was the department's preference all along."}]},

{id:"S7",ti:"The Student at Harwich",b:[3,4],ex:{base:.9},ga:{since:["FIRST_STUDENT",16]},once:1,
 sc:"{student} — your first student — has been made a full professor at Harwich College. You are not at Harwich College. She sends a kind email. It contains the phrase “I owe you so much,” which is true, and which nobody at Harwich will ever say to you.",
 ch:[
 {t:"Reply with pride. Mean every word.",fx:{N:6,E:-2,mom:3,flag:"PROUD"},say:"You write four paragraphs. She keeps the email; you learn this at her inaugural lecture, where she reads a line of it aloud. You look at the ceiling again. The ceiling at Harwich is very fine."},
 {t:"Reply briefly. Feel what you feel.",fx:{E:-5,B:3},say:"“Congratulations — well deserved.” Six words. She notices the six words. Some things are not the student's fault and are held against her anyway, quietly, forever."}]},

{id:"N8",ti:"The Handbook Chapter",b:[3,4],ex:{base:.8},once:1,
 sc:"You have been asked to write the chapter on your field for the Handbook. Sixty pages, no original result, cited by everyone who does not want to read the papers. It is the most useful thing you will write and the one you will least want on your CV.",
 ch:[
 {t:"Write it.",fx:{N:6,P:4,mom:5,R:-3,B:6,submit:{tier:"A",lag:[2,3],jn:"the Handbook",cites:120},flag:"HANDBOOK"},say:"It takes a year, and goes to the Handbook. It will be cited three hundred times by people who cite nothing else of yours. You become, in the profession's shorthand, “the person who wrote the survey,” which is a rung and a cage."},
 {t:"Decline. Write a paper instead.",fx:{R:5,wip:18},say:"A younger person writes the chapter, and for twenty years their name and not yours is the one that appears when someone types the topic into a search box."}]},

{id:"N9",ti:"The Nap",b:[3,4],ex:{base:.7},once:1,
 sc:"You have fallen asleep in a job talk, briefly, visibly, in the second row. The candidate saw. The candidate is very good. The vote is on Thursday.",
 ch:[
 {t:"Apologise to the candidate afterwards. Vote yes.",fx:{N:4,K:2,E:-3,flag:"APOLOGISED"},say:"She laughs, generously. She is hired. In year three she mentions it at a dinner, kindly, and everyone laughs, and you laugh, and you will hear the story told in four more cities."},
 {t:"Say nothing. Vote yes.",fx:{K:1},say:"She is hired. She never mentions it. The not-mentioning is a small ongoing tax that both of you pay for nine years."},
 {t:"Vote no. She saw.",fx:{E:3,K:-4,N:-4,flag:"VOTED_NO_ASLEEP"},say:"She goes to Calderon and becomes, within a decade, the reason people say Calderon's name. You have voted against a career because it witnessed a nap."}]},

{id:"N10",ti:"The Chair",b:[4,4],ex:{base:.6,highMom:1.8,highR:1.2},ga:{R:60,N:45},once:1,tr:"nobel",
 sc:"A named chair. The name belongs to a dead man who made his money in something the university no longer mentions. It comes with a stipend, a research budget, and a plaque, and it is the last promotion in a life that has no others.",
 ch:[
 {t:"Accept, and give the inaugural lecture.",fx:{mom:12,E:8,N:6,P:5,S:20,flag:"CHAIR"},say:"The lecture is good. The dead man's granddaughter is in the front row and thanks you afterwards for “honouring the family,” and you realise the plaque has two names on it and only one of them is yours."},
 {t:"Accept, and skip the lecture.",fx:{mom:8,E:4,S:20,flag:"CHAIR"},say:"The stipend arrives. The plaque goes up. The dean is mildly hurt about the lecture, and the dead man's family, who had been told there would be one, do not renew the gift when it comes up in 2047."}]},

{id:"S8",ti:"The Corner Offices",b:[3,4],ex:{base:1,office:1.5},ga:{office:1},once:1,
 sc:"The building is being reorganised. The corner offices — there are four — are wanted by eleven people, all of whom have theories about seniority, all different, all documented. You hold the plan.",
 ch:[
 {t:"Allocate by seniority. Publish the rule.",fx:{K:6,N:-3,foe:{why:"the office allocation",poisons:"vote"}},say:"Seven people are unhappy in a way they can defend. One of them will not speak to you for four years, and is on the committee. A rule was applied; that is what rules are for."},
 {t:"Allocate by who will make the most trouble.",fx:{K:8,N:3,E:-2,flag:"REALPOLITIK"},say:"Nobody complains. Everyone knows why. You have learned the actual job, and the actual job is not in any document."},
 {t:"Draw lots in a public meeting.",fx:{K:2,N:5,B:-3},say:"The meeting is a delight. The losers cannot blame you and so blame fate, which does not sit on committees. A junior person gets a corner office and her productivity, for reasons nobody can explain, doubles."}]},

{id:"S9",ti:"The Donor's Nephew",b:[3,4],ex:{base:1,office:1.5},ga:{office:2},once:1,
 sc:"A trustee whose name is on the new building has a nephew applying to the PhD program. The nephew is fine. The nephew is not good. The Dean's office would like to know your “thinking.”",
 ch:[
 {t:"Admit him. It is one place.",fx:{K:6,N:5,S:2,E:-3,flag:"NEPHEW"},say:"He is admitted. He finishes in seven years and works in his uncle's foundation. The building is very fine. Four years later, at a dinner, the trustee remembers, and a chair gets funded that you will sit in."},
 {t:"Reject him. The committee decides.",fx:{K:3,N:-6,B:4,flag:"NO_NEPHEW"},say:"He goes to Bowhead State. The trustee is “disappointed,” a word that in that office means eleven million dollars. The Dean does not forgive you, because the Dean is the one who had to make the phone call."}]},

{id:"S10",ti:"The Cut",b:[3,4],ex:{base:1,office:1.5},ga:{office:2},
