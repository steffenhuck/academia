 sc:"Six percent, across the board, by Friday. You can protect the department by cutting the postdoc program, or protect the postdocs by cutting the seminar budget, or cut everything a little and be hated a little by everyone.",
 ch:[
 {t:"Cut the postdocs.",fx:{K:5,N:-4,R:-3,foe:{why:"you cut the postdoc line they ran",poisons:"vote"}},say:"Four young people do not come. The seminar continues. The faculty are grateful in the way people are grateful when the cost lands on someone who cannot vote."},
 {t:"Cut the seminar.",fx:{K:5,N:-6,E:2},say:"Nobody visits for a year. The faculty are furious in a way that involves emails. The postdocs, who did not know they were saved, do not thank you, because nobody tells them."},
 {t:"Salami. Everything a little.",fx:{K:3,N:-2,B:5},say:"Everyone is a little worse off and everyone knows it was you. Nobody is much worse off. This is called leadership in the documents and cowardice in the corridor, and it is, on the evidence, what most people would do."}]},

{id:"S11",ti:"The Occupation",b:[3,4],ex:{base:1.3,office:2},ga:{office:4},once:1,
 sc:"Two hundred students have occupied the administration building over something the endowment has invested in. Their demands are long. Their sleeping bags are excellent. Your office is on the third floor of the building they have occupied.",
 ch:[
 {t:"Go down. Talk. No security.",roll:{stat:"K",pivot:65,
   win:{fx:{K:8,P:8,N:4,mom:5,flag:"WENT_DOWN"},say:"Forty minutes on the floor of the lobby. You concede nothing and they leave on Tuesday. A photograph of you sitting on the floor does very well. The board does not like the photograph and does like the outcome."},
   lose:{fx:{K:-4,P:6,N:-5,B:10},say:"They film it. You say one sentence that is accurate and sounds terrible. The sentence outlives the occupation, the semester, and most of your other sentences."}}},
 {t:"Wait them out. Exams are in three weeks.",fx:{K:4,B:6,P:-3},say:"They leave for exams. The board approves. The students remember, and in twelve years three of them are on the alumni council, and they still remember."},
 {t:"Call security.",fx:{K:-6,P:-8,N:-6,B:8,foe:{why:"you called security on the occupation",poisons:"search"}},say:"It is over in an hour and on the news for a month. The board thanks you privately and distances itself publicly. You have discovered the exact width of the gap between those two things."}]},

{id:"G9",ti:"The Scan",b:[2,4],ex:{base:.5,highB:1.6},once:1,
 sc:"The doctor uses the word “concerning” and then the word “probably.” There is a scan in three weeks. In the interval you have a referee report, a grant deadline, and a seminar to give at Pelham.",
 ch:[
 {t:"Cancel everything. Wait properly.",fx:{B:-12,R:-2,N:-2,E:-3,flag:"WAITED"},say:"Three weeks of not working. It is, it turns out, nothing. You return to the report and the grant and the seminar and find that all three were still there and that nobody had died of your absence, which is the most alarming thing the scan revealed."},
 {t:"Work through it. Tell nobody.",fx:{B:10,R:2,E:2},say:"You give the seminar at Pelham the day before the scan. It goes well. It is nothing. You have learned that you can do this, and you will do it again, and one day it will not be nothing."}]},

{id:"G10",ti:"The Reunion",b:[3,4],ex:{base:.6},once:1,
 sc:"Twenty years since the PhD. Nine of the cohort are at the dinner. {rivalS} is at Harwich. One is at Thromber. Two are in banks and are paying for the wine. One left for a think tank and looks, you notice, eleven years younger than the rest of you.",
 ch:[
 {t:"Ask the think tank one how it happened.",fx:{E:-4,B:-3,flag:"ASKED_HOW"},say:"She says: “I stopped waiting to be chosen.” She says it without malice. You think about it on the train home, and for some weeks after, and then the term starts."},
 {t:"Talk to {rivalS}. Networking is networking.",fx:{N:5,E:2},say:"She is as pleased to see you as she would be to see anyone. You get a seminar invitation out of it, in April, which is something."},
 {t:"Drink with the bankers.",fx:{B:-4,N:2,S:1},say:"They are generous, funny, and know exactly what your salary is. One of them says “you're the one who stayed,” and means it as a compliment, and you take it as one, mostly."}]},

{id:"G11",ti:"The Coauthor Who Stopped",b:[2,4],ex:{base:.9},
 sc:"The paper is eighty percent done and {coauthor} has not replied in four months. His last email said “on it.” He is, you learn from a third party, going through a divorce, or a breakdown, or a sabbatical, depending on who you ask.",
 ch:[
 {t:"Finish it alone. Keep his name on.",fx:{R:4,B:7,N:3,submit:{lag:[4,6]},flag:"CARRIED"},say:"You write his sections. It goes out with both names. He will thank you, years later, in a bar, at a length that suggests he knows exactly what it cost. That is the whole return on the investment, and it is, oddly, enough."},
 {t:"Finish it alone. Take his name off.",fx:{R:5,E:4,N:-4,submit:{lag:[4,6]},foe:{why:"you removed their name from the paper",poisons:"referee"}},say:"It goes out with one name. He surfaces, eventually, and sees the working paper. The email he sends is short. You were within your rights. Rights are not the currency here."},
 {t:"Wait.",fx:{B:2,R:-1,submit:{bias:-0.8,lag:[8,10]}},say:"Four months becomes eleven. It goes out, eventually, behind two others that say roughly the same thing. Loyalty has a price, and the price is a citation count."}]},
/* ================================================================
   BATCH 3 — provenance, students, the referee's memory, the office,
   the publication process, and things that simply happen
   ================================================================ */

/* ---------- the arcane result: keep track ---------- */
{id:"G14",ti:"Page 411",b:[1,4],ex:{base:.7,highR:.6},ga:{R:30},once:1,
 sc:"In a 1961 volume nobody has opened since the library was rebuilt, a Hungarian you have never heard of, {hungarian}, proves, in four pages and a notation that has since died, something your entire subfield has spent a decade circling. It has been cited once, in 1964, by its author.",
 ch:[
 {t:"Write it up in modern language. Modernise the proof. Cite him.",fx:{R:6,mom:4,N:2,submit:{bias:.6,lag:[4,6],f:"theory"},flag:"CITED_OLD"},say:"It goes out with a 1961 volume in the references. The field will be briefly, pleasantly ashamed of itself. You are the person who found the Hungarian, which is a small permanent distinction, like having discovered a restaurant."},
 {t:"Write it up. Modernise the proof. Cite nobody.",fx:{R:9,mom:10,E:6,submit:{tier:"A+",lag:[4,6],f:"theory"},flag:"UNCITED_SOURCE"},say:"It goes to the Quarterly. It is your result now. It is, in every technical sense, your result. The 1961 volume is still in the library, and libraries are patient."}]},

{id:"G15",ti:"On the Provenance of a Recent Result",b:[2,4],ex:{base:.6,highP:1.5,highMom:1},ga:{since:["UNCITED_SOURCE",8]},once:1,
 sc:"A working paper by two graduate students at Thromber. It is nine pages long, scrupulously polite, and contains a photograph of page 411 of a 1961 volume.",
 ch:[
 {t:"Post a correction. Say you were unaware.",roll:{stat:"N",pivot:50,
   win:{fx:{R:-4,N:-4,E:-8,mom:-10,flag:"HUNGARIAN_CAUGHT"},say:"The corrigendum runs. Enough people believe you that it does not end anything. Not enough believe you that it ends. For the rest of your career a certain kind of colleague pauses before the word “original.”"},
   lose:{fx:{R:-10,N:-14,P:-8,E:-14,mom:-25,foe:{why:"page 411",poisons:"committee"},flag:"HUNGARIAN_CAUGHT"},say:"Nobody believes you. A blog post with the two pages side by side gets sixty thousand views. The Quarterly does not retract, because the result is correct, which is the worst possible outcome: it stays in print with your name on it, and everyone knows."}}},
 {t:"Say nothing. It is not a retraction matter.",fx:{E:-4,mom:-8,N:-6,flag:"HUNGARIAN_SILENT"},say:"The working paper is cited eleven times. Yours is cited four hundred. The arithmetic is on your side, and the arithmetic is not the point, and you know it every time someone says “your result.”"}]},

{id:"G16",ti:"Budapest",b:[2,4],ex:{base:.5},ga:{since:["CITED_OLD",6]},once:1,
 sc:"An email from Budapest. The Hungarian's daughter, who is seventy-one and a retired pharmacist, has been sent your paper by a former student of her father's. She had not known. She would like to thank you.",
 auto:{good:1,fx:{N:3,E:-2,mom:3},say:"You write back. It is the only email you receive that year that you keep."}},

/* ---------- the student's idea ---------- */
{id:"N11",ti:"The Idea",b:[3,4],ex:{base:.8},once:1,
 sc:"Your PhD student, {student}, has had an idea. Not a good idea — the other kind, the kind that comes twice in a career and never to the same person. She has explained it to you in your office in eleven minutes, and you have understood, in the eleventh, that it will matter. It would, obviously, benefit from your name on it.",
 ch:[
 {t:"Put your name on it. She needs the cover.",fx:{R:6,mom:14,N:5,E:6,submit:{tier:"A+",lag:[3,5],cites:60},flag:"TOOK_IDEA"},say:"It goes out with two names — yours second, alphabetically, and first in every seminar introduction. It will do exactly what you know it will. She will place at Pelham. At the dinner she will thank you, at length, and you will not be able to tell, then or ever, how much of it she means."},
 {t:"Keep your name off it. Write her a letter that says so.",fx:{N:4,E:-4,mom:2,flag:"GAVE_IDEA"},say:"It appears with one name. It does exactly what you knew it would. She places at Harwich. Your letter, which says “the idea is entirely hers, and I say so because it will be doubted,” is quoted in the citation for her first prize."}]},

{id:"N12",ti:"The Acceptance Speech",b:[3,4],ex:{base:.8,highP:.6},ga:{since:["TOOK_IDEA",14]},once:1,
 sc:"She has won the medal — the one for under forty. The speech is short. It thanks her parents, her partner, and “the graduate students I have been lucky to have.” It does not mention you. Everyone in the room who was in the field in the relevant year notices the shape of the omission, and so, a beat later, does the room.",
 auto:{bad:1,fx:{N:-6,E:-8,mom:-6},say:"Nobody says anything. That is what is said."}},

{id:"N13",ti:"The Acceptance Speech",b:[3,4],ex:{base:.8},ga:{since:["GAVE_IDEA",14]},once:1,
 sc:"She has won the medal — the one for under forty. The speech is short. In the middle of it she says your name and stops, and then says it again, and the room, which knows the story, applauds a person who is not on stage.",
 auto:{good:1,fx:{N:8,mom:8,E:4,P:4},say:"You are in the third row. You do not look at the ceiling this time. You look at her."}},

/* ---------- two applicants ---------- */
{id:"A15",ti:"One Place",b:[2,4],ex:{base:.9},once:1,
 sc:"One funded place, two applicants. The first is a little smarter — the kind of smart that produces a question in a seminar nobody can answer. The second has, plainly, the better work ethic: a draft already, sent unasked, and a cover letter that cites your third paper by section number.",
 ch:[
 {t:"The smarter one.",fx:{E:2,flag:"CHOSE_SMART"},say:"She arrives, asks two questions in the first month that you cannot answer, and does not produce a page for eighteen months. You have bought variance. Variance is what you told yourself you wanted."},
 {t:"The one who works.",fx:{K:2,flag:"CHOSE_DILIGENT"},say:"He arrives with a plan and follows it. Pages every Friday. Nothing in them surprises you and nothing in them is wrong. You have bought a floor. Floors are underrated."}]},

{id:"A16",ti:"Variance",b:[2,4],ex:{base:.9},ga:{since:["CHOSE_SMART",8]},once:1,
 sc:"The smart one has a draft. It is either the best thing to come out of the department in a decade or a beautiful mistake, and after two readings you genuinely cannot tell which.",
 ch:[
 {t:"Send it out.",roll:{stat:"coin",
   win:{fx:{mom:12,N:8,R:4,cites:40,flag:"SMART_PAID"},say:"It was the first thing. She places at Calderon, and for a decade every introduction of you includes her name, which is either the best or the second-best thing that can happen to a supervisor."},
   lose:{fx:{N:-3,E:-5,B:5},say:"It was the second thing. A referee finds the mistake in a paragraph. She leaves for a quant fund in the spring, is very happy, and sends a Christmas card every year that you cannot look at for long."}}},
 {t:"Ask for another year of work first.",fx:{B:4,K:2},say:"She works for another year and the draft gets safer and smaller. It places her at Fenwick. You will never know what the first version would have done, and you will think about that more than you expect."}]},

{id:"A17",ti:"The Floor",b:[2,4],ex:{base:.9},ga:{since:["CHOSE_DILIGENT",8]},once:1,
 sc:"The one who works has finished. On time. Five chapters, each of which is fine. He has a job at Ostrander State, a tie for the interview, and he has, without being asked, cited your third paper in all five chapters.",
 auto:{good:1,fx:{N:4,cites:25,K:2},say:"He will cite you in everything he ever writes. It is not a large number per paper, and there will be a great many papers."}},

/* ---------- temptation, and its arithmetic ---------- */
{id:"G17",ti:"Lisbon",b:[3,4],ex:{base:.6},ga:{N:30},once:1,
 sc:"The conference is in Lisbon and the visiting professor is someone you have argued with, pleasantly, at dinners on three continents for eleven years. Tonight the argument has become something else, and you both know it, and you are both married, and the hotel is the same hotel.",
 ch:[
 {t:"Go back to your room. Alone.",fx:{B:-2,E:-2},say:"You lie awake for a while and then you do not. In the morning she is at breakfast with her laptop and it is exactly as it was, and you are, on balance, glad, and also not."},
 {t:"Don't.",fx:{E:6,B:-8,flag:"LISBON"},say:"For four days you are a different person, and then you fly home and are the old one, with a secret. Secrets are heavy in a way that is hard to explain to anyone who has never carried one through a faculty meeting."},
 {t:"Talk until three, and say so.",fx:{N:5,B:-4,E:-1},say:"You say the true thing, which is that you would, and won't. She says the same. It is the best conversation you have had in a decade and you will never have it again, and it makes the next eleven years of arguments at dinners a little better."}]},

{id:"G18",ti:"The Second Household",b:[3,4],ex:{base:.9},ga:{since:["LISBON",6]},once:1,
 sc:"It did not stay in Lisbon. There are now two lives, and you are running both with the diligence of a person who has never done anything by halves, and one of them has found the phone.",
 ch:[
 {t:"Choose. Now.",roll:{stat:"coin",
   win:{fx:{B:-10,S:-30,N:-4,E:-4,flag:"DIVORCED"},say:"The divorce is expensive, civilised, and takes fourteen months. On the other side of it you are poorer, quieter, and — a thing nobody warned you — happier. She moves to your city in the spring."},
   lose:{fx:{B:8,S:-30,N:-8,E:-8,foe:{why:"you left them for someone at a conference",poisons:"search"},flag:"DIVORCED"},say:"The divorce is expensive and not civilised. Lisbon does not last the year. Your former spouse's brother is a trustee at Pelham, and this becomes, in a way nobody could have drawn on a whiteboard, a problem for a search committee in 2047."}}},
 {t:"End it. Stay.",fx:{B:6,E:-6,flag:"ENDED_IT"},say:"You end it in an airport. Your marriage survives the way a building survives a fire: standing, and everyone can smell it. The visiting professor does not come to conferences you are at for a while, and then does, and it is fine, and it is not."}]},

{id:"G19",ti:"Both Adults",b:[3,4],ex:{base:.5,highE:1.4},ga:{E:45},once:1,
 sc:"Your postdoc, {postdoc}, is twenty-nine and has been in your office for an hour about a proof, and somewhere in the hour the proof has stopped being the subject. You are fifty-one. You have a chair, a spouse, and a very clear sense — you would say this if asked — that you are both adults.",
 ch:[
 {t:"Say no, and say why.",fx:{N:2,E:-3,K:2,flag:"DREW_LINE"},say:"You say the true thing, which is not about the two of you but about the room, and who signs whose letters. It is an awkward five minutes. She is, six years later, on a committee, and votes, and remembers the five minutes accurately."},
 {t:"Say no. Say nothing.",fx:{E:-1},say:"You mention the seminar. She takes the hint, or takes something. It is never spoken of. Whether that was grace or cowardice you will decide differently on different days."},
 {t:"You are both adults.",fx:{E:8,B:-10,flag:"AFFAIR_JUNIOR"},say:"It is, for a while, wonderful, the way a thing built on a slope is wonderful. You are not both adults; you are an adult and a person whose letters you sign, and the difference is not visible from where you are standing, and it is visible from everywhere else."}]},

{id:"G20",ti:"Through the Proper Channel",b:[3,4],ex:{base:.4,office:2.5,highP:1.8},ga:{since:["AFFAIR_JUNIOR",6]},once:1,
 sc:"It arrives on a Tuesday, through the proper channel, four years after the fact and eleven days after your name appeared in a newspaper for a different reason. It is measured, specific, and correct. It has been drafted with help. The help is a lawyer.",
 ch:[
 {t:"Resign everything today. Say nothing.",fx:{mod:"resignOffice",P:-25,N:-22,E:-15,B:14,mom:-30,flag:"SCANDAL"},say:"The statement is two sentences. Every office you hold is gone by Friday. The papers stay in print with your name on them, which is what papers do. The rest of the life is very quiet, and the quiet is not restful."},
 {t:"Fight it. It was consensual.",roll:{stat:"E",pivot:75,
   win:{fx:{P:-15,N:-18,E:-6,B:16,mom:-20,foe:{why:"what you did, and that you fought it",poisons:"committee"},flag:"SCANDAL"},say:"The process finds insufficient evidence. Everyone knows what insufficient means. You keep the office and lose the building; nobody sits with you at lunch for two years, and then some do, and they are not the people you would have chosen."},
   lose:{fx:{mod:"resignOffice",P:-35,N:-30,E:-20,B:20,mom:-40,foe:{why:"what you did",poisons:"committee"},flag:"SCANDAL"},say:"The process finds. The word “consensual” is quoted, in your own voice, in a document that will outlive you. You are asked to leave the building by a person you hired."}}}]},

/* ---------- the referee's memory ---------- */
{id:"R1",ti:"It Doesn't Cite You",b:[1,4],ex:{base:.9,highR:.5},once:1,
 sc:"You are refereeing a good paper — a genuinely good paper — on your problem. It does not cite you. Not the 2033 one, not the 2036 one, not the survey. You are anonymous. The author will never know what you asked for, only that a referee asked.",
 ch:[
 {t:"Recommend acceptance. Say nothing about it.",fx:{R:2,E:-3,flag:"NO_SELF_CITE"},say:"It appears. It does not cite you. Two years later it is the standard reference and yours is the one it replaced, and nobody knows that the person who waved it through was the person it replaced."},
 {t:"Ask them to “engage with the relevant literature.” List it.",fx:{cites:18,E:3,flag:"ASKED_SELF_CITE"},say:"They add three citations and a paragraph. The paragraph is grudging in a way only you can see. It appears. The three citations are real. You have done the thing everyone does and nobody admits, and you did it in a font that cannot be traced to you. For now."},
 {t:"Recommend rejection. The contribution is “unclear.”",fx:{E:5,R:-1,foe:{why:"a referee report they will one day trace",poisons:"referee"},flag:"KILLED_RIVAL"},say:"It is rejected. It appears elsewhere, a year later, a tier down, and does not cite you there either. The author is thirty-one and patient, and has, it will turn out, a very good memory for prose style."}]},

{id:"E3",ti:"The Signature",b:[3,4],ex:{base:1.3},ga:{flags:["COEDITOR","ASKED_SELF_CITE"]},once:1,
 sc:"A submission at the Review, and the author's name is one you know: the good paper, the one that did not cite you, the one where you asked. You are co-editor now. Your letter will carry your name. The paper, again, is good. It cites you this time — the three papers, exactly, in the same grudging paragraph.",
 ch:[
 {t:"Handle it. Accept it. Sign it.",fx:{N:3,E:-4,K:2,flag:"SIGNED_IT"},say:"Your name on the acceptance. The author reads the letter twice, does the arithmetic on the grudging paragraph and the anonymous report of four years ago, and understands. She never says so. She cites you, correctly and forever, in a tone only the two of you can hear."},
 {t:"Recuse. Pass it to a colleague.",fx:{K:3,N:1},say:"The colleague accepts it. The author never knows how close she came to your signature. You never know whether she had already guessed."}]},

{id:"E4",ti:"A Very Good Memory",b:[3,4],ex:{base:1.3},ga:{flags:["COEDITOR","KILLED_RIVAL"]},once:1,
 sc:"A submission at the Review. The author is the person whose paper you killed as a referee nine years ago. The paper is excellent. She has, in the cover letter, cited you warmly. She has also, you notice, used the phrase “unclear contribution” in her own abstract, in quotation marks, about the prior literature.",
 ch:[
 {t:"Accept it. Sign it. Say nothing.",fx:{K:3,N:2,E:-5},say:"She reads the letter. She has a very good memory for prose style, and yours has not changed. She says nothing. She is on the committee in 2049."},
 {t:"Recuse.",fx:{K:2},say:"A colleague handles it. It is accepted. You have avoided a signature and not a memory."}]},

/* ---------- the office: HR, HR, HR, and money ---------- */
{id:"Q1",ti:"The Provost's Report",b:[3,4],ex:{base:1.2,office:1.5},ga:{office:4},once:1,
 sc:"{provost} — capable, loyal, the person who actually runs the place — is in a relationship with a direct report. Everyone knows. It has now been written down, by someone who would like a different provost.",
 ch:[
 {t:"Remove him. Today.",fx:{K:8,N:-8,B:8,flag:"REMOVED_PROVOST"},say:"He goes with a paragraph of thanks and a settlement. The board approves. The university is run, for a year, by nobody, and you discover exactly how much he was doing."},
 {t:"A written warning and a reporting change.",fx:{K:3,N:2,P:-3},say:"It is handled. It is on file. In eighteen months a journalist asks for the file, and the word “handled” looks very different in a headline."},
 {t:"Tell him to end it, and shred nothing.",fx:{K:5,N:4,E:2,foe:{why:"you let the provost keep his job",poisons:"search"}},say:"He ends it. The direct report leaves with a reference and a grievance. It surfaces, as these things do, at the exact moment you are being considered for something."}]},

{id:"Q2",ti:"The Coach",b:[3,4],ex:{base:1.1,office:1.5},ga:{office:4},once:1,
 sc:"The football coach earns nine times your salary, has just gone 11–1, and has, on Saturday night, done something in a bar that a phone recorded. The athletic director would like to know whether you have seen the video. The board chair has seen the video, and would like to know whether you have seen the season.",
 ch:[
 {t:"Suspend him.",fx:{K:6,P:4,N:-8,B:8,S:-5,flag:"SUSPENDED_COACH"},say:"Two boosters withdraw pledges totalling nine million. The student paper runs a photograph of you above the word “integrity.” The board chair does not speak to you at the next three dinners."},
 {t:"A fine and a statement.",fx:{K:2,N:3,P:-6},say:"He is fined a week's salary, which is more than you make in four months. The statement uses the word “disappointed.” The video is still available, and is watched, in the following year, by everyone who applies for a job at your university."},
 {t:"Ask the athletic director to handle it.",fx:{K:-3,N:2,P:-4,B:-2},say:"He handles it. Nothing happens. This is what handling means in that building, and everyone learns that you know it."}]},

{id:"Q3",ti:"The Star",b:[3,4],ex:{base:1,office:1.3},ga:{office:2},once:1,
 sc:"A famous economist is available. Harwich has annoyed her. She would come for $950k, a research centre, three hires of her choosing, and a parking space with her name on it. The dean of arts has calculated that this is the budget of the classics department, twice.",
 ch:[
 {t:"Hire her.",fx:{K:4,N:8,P:6,mom:6,S:-2,flag:"BET_STAR"},say:"The press release writes itself, and does. The classics department finds out from the press release."},
 {t:"Decline. The money is the money.",fx:{K:3,N:-3},say:"She goes to Calderon, where she is very happy and very cited, and the dean of arts sends you a bottle of wine with no note."}]},

{id:"Q4",ti:"The Star, Four Years On",b:[3,4],ex:{base:1.2},ga:{since:["BET_STAR",8]},once:1,
 sc:"Four years since the hire. The report is on your desk.",
 ch:[
 {t:"Read it.",roll:{stat:"coin",
   win:{fx:{K:6,N:8,P:8,mom:10,flag:"STAR_PAID"},say:"Two prizes, a centre with a waiting list, and eleven faculty who came because she did. The classics department is smaller and the university is larger, and a trustee says your name at a dinner as if it had been a good decision, which it was."},
   lose:{fx:{K:-5,N:-6,P:-8,S:-3,B:6},say:"She has gone back to Harwich, which un-annoyed itself. The centre has her name on it and no director. The three hires she chose are hers, not yours, and two of them are leaving. The classics department is still gone."}}}]},

{id:"Q5",ti:"The Fund",b:[3,4],ex:{base:1.1,office:1.5},ga:{office:4},once:1,
 sc:"{trustee}'s college roommate runs a fund. The fund has returned 24% a year for six years, which is not possible, and the trustee would like a modest allocation from the endowment, and the investment committee would like to know what you think, because they have already decided and want a name on the decision.",
 ch:[
 {t:"Allocate. A modest amount.",fx:{K:4,N:8,S:3,flag:"BET_FUND"},say:"Forty million. The trustee is delighted. The returns, for two years, are exactly as promised."},
 {t:"Refuse. Say why, in writing.",fx:{K:6,N:-9,E:3,foe:{why:"you refused their roommate's fund in writing",poisons:"search"}},say:"You use the phrase “not possible” in a memo. The trustee is not delighted. The fund returns 24% for two more years, during which the trustee mentions the memo at every meeting."}]},

{id:"Q6",ti:"Six a.m., Marked Urgent",b:[3,4],ex:{base:1.3},ga:{since:["BET_FUND",8]},once:1,
 sc:"An email from the investment committee, at 6 a.m., marked urgent.",
 ch:[
 {t:"Open it.",roll:{stat:"coin",
   win:{fx:{K:8,N:10,S:12,P:4,flag:"FUND_PAID"},say:"Twenty-six percent. The endowment is up ninety million and the trustee has named a scholarship after your judgment. It was not possible, and it happened, and you will spend the rest of your life knowing it was luck and being paid as if it were not."},
   lose:{fx:{K:-10,N:-14,P:-18,B:14,mom:-15,foe:{why:"the fund",poisons:"search"},flag:"FUND_FRAUD"},say:"It was not possible. The roommate is arrested in Connecticut. Forty million becomes four. Your name is on the decision, in your own handwriting, and a student journalist has a photograph of the page."}}}]},

{id:"Q7",ti:"The Gulf Campus",b:[3,4],ex:{base:1,office:1.5},ga:{office:4},once:1,
 sc:"A government you would not describe at a dinner party would like a campus. They will pay for everything: the buildings, the salaries, a great deal of the home campus's deficit. The academic freedom clause is two paragraphs long and has been described by your general counsel as “aspirational.”",
 ch:[
 {t:"Sign. The money is transformative.",fx:{K:6,N:6,S:6,P:-4,flag:"BET_GULF"},say:"The buildings go up in eighteen months, which is not possible here and is normal there. The deficit closes. A faculty senate resolution passes 61–58 against, and is noted."},
 {t:"Decline. Hold a town hall about why.",fx:{K:3,P:5,N:-5,S:-3},say:"The faculty are moved. The board is not. The deficit is what it was, and next year's cut has your name on it instead."}]},

{id:"Q8",ti:"A Call From the Campus",b:[3,4],ex:{base:1.3},ga:{since:["BET_GULF",8]},once:1,
 sc:"A phone call from the campus, at an hour that means it is not good news or is very good news.",
 ch:[
 {t:"Take it.",roll:{stat:"coin",
   win:{fx:{K:8,S:10,N:6,flag:"GULF_PAID"},say:"Enrollment is full. The buildings are beautiful. A minister has renewed for ten years and named a hall after the university, and everyone who opposed it is now on the steering committee, having noticed the travel budget."},
   lose:{fx:{K:-6,P:-16,N:-10,B:12,mom:-10,flag:"GULF_STORY"},say:"A lecturer has been detained. The aspirational clause is aspirational. The newspaper that broke the story has a photograph of you at the ribbon, holding scissors, and the scissors are gold, and the story runs for a month."}}}]},

{id:"Q9",ti:"The Anonymous Letter",b:[3,4],ex:{base:1,office:1.4},ga:{office:3},once:1,
 sc:"A letter, unsigned, alleging that a dean has been claiming travel for conferences she did not attend. It is specific: dates, cities, amounts. It is also, you can tell from the phrasing, from someone who wants her job.",
 ch:[
 {t:"Audit her. Quietly.",fx:{K:6,N:-3,B:4,flag:"AUDITED_DEAN"},say:"The audit finds nine hundred dollars over four years, which is a rounding error and also, in the auditor's phrase, a pattern. She repays it. She knows you audited her. The letter-writer gets nothing, and knows the letter worked anyway."},
 {t:"Show her the letter. Ask her.",fx:{K:3,N:5,E:2},say:"She reads it and names the writer in one guess. She is furious, and grateful, and accurate. The writer is moved sideways in the spring, for unrelated reasons that everyone understands."},
 {t:"File it. Letters without names go in the drawer.",fx:{K:-2,B:-2},say:"It goes in the drawer. The drawer, in eighteen months, is read by a journalist under a freedom-of-information request, and the phrase “the president was informed” appears in print."}]},

{id:"Q10",ti:"The Classics Department",b:[3,4],ex:{base:1,office:1.5},ga:{office:4},once:1,
 sc:"Classics has four professors, eleven majors, and a deficit the size of the provost's salary. The consultants have a slide. The slide has a red box around classics.",
 ch:[
 {t:"Close it.",fx:{K:8,S:4,P:-10,N:-8,B:8,foe:{why:"you closed classics",poisons:"search"},flag:"CLOSED_CLASSICS"},say:"The four professors are “transitioned.” An alumnus who read Homer there in 1971 writes to the newspaper, then to you, then to the board, and then, unexpectedly, gives Harwich twenty million dollars for a chair in Greek, with a press release that mentions your university by name."},
 {t:"Keep it. Cut the deficit elsewhere.",fx:{K:2,N:4,P:4,S:-4},say:"The deficit lands on the business school, which can afford it and does not forgive it. Eleven majors read Homer. The consultants' slide is used again in three years, by someone else."},
 {t:"Merge it into “Ancient Studies” with three other departments.",fx:{K:5,N:-3,P:-2},say:"Nobody is fired and everybody is diminished. The new department has a name nobody can say without a small pause, and a chair who is a historian, and four classicists who are, in the technical sense, still there."}]},

{id:"Q11",ti:"The Hood",b:[3,4],ex:{base:.9,office:1.4},ga:{office:4},once:1,
 sc:"A billionaire who has given nothing, yet, would like an honorary doctorate. His foundation has been in touch about “alignment.” His last public statement was about vaccines, and was not correct.",
 ch:[
 {t:"Give it.",fx:{S:5,N:6,K:3,P:-9,flag:"HOODED_HIM"},say:"The gift is announced at the ceremony: a hundred million for a school of public policy. Eleven faculty walk out. The photograph of the hood going over his head is used, for a decade, whenever anyone needs a picture of what a university will do for money."},
 {t:"Decline. Suggest a lecture instead.",fx:{K:4,P:4,N:-4,S:-2},say:"He does not give the lecture, or the hundred million. Calderon hoods him in the spring. Their school of public policy is very fine, and it is named after him, and you go to a conference in it in 2049 and admire the atrium."}]},

{id:"Q12",ti:"The Appeal",b:[3,4],ex:{base:1,office:1.4},ga:{office:3},once:1,
 sc:"An assistant professor denied tenure by a department that everyone knows was settling a score has appealed to you. Her file is better than three of the people who voted against her. Overturning a department has never been done here.",
 ch:[
 {t:"Overturn it.",fx:{K:8,N:-10,E:4,foe:{why:"you overturned their department's tenure vote",poisons:"vote"},flag:"OVERTURNED"},say:"She is tenured. The department stops speaking to the provost's office for a year, which is, on reflection, restful. She is the reason anyone says the department's name in a decade, and the department knows it, and does not forgive her for that either."},
 {t:"Uphold it. Departments decide.",fx:{K:3,N:3,E:-3},say:"She goes to Bellweather and is extremely good there. You have upheld a principle that everyone in the building knows was not the thing being decided."},
 {t:"Send it back for a new vote with two external members.",fx:{K:6,N:1,B:4},say:"The new vote is 7–5 for. Nobody is happy, which is how you know the process worked."}]},

{id:"Q13",ti:"The Resort",b:[3,4],ex:{base:.9,office:1.5},ga:{office:4},once:1,
 sc:"The board's annual retreat is at a resort {trusteeS} owns. The agenda has one real item, which is not on the agenda: whether you are the person to lead the capital campaign, which is to say, whether you are the person.",
 ch:[
 {t:"Give the speech. Ask for the campaign.",roll:{stat:"K",pivot:70,
   win:{fx:{K:8,N:10,S:15,mom:10,flag:"CAMPAIGN"},say:"You ask for a billion and say it without flinching. The board chair, afterwards, says “well, I suppose we'd better,” which is how a billion-dollar campaign begins."},
   lose:{fx:{K:-4,N:-8,E:-8,B:8,mom:-8},say:"You say a billion and there is a pause, and in the pause the board decides, without a vote, that the campaign will be led by the next president. You have about two years, and you learn it at a resort."}}},
 {t:"Listen. Let them come to it.",fx:{K:3,N:4,B:-2},say:"They come to it. It takes two more meetings. The campaign is smaller and it is yours."}]},

/* ---------- the publication process ---------- */
{id:"R2",ti:"Referee 2",b:[1,4],ex:{base:.9},ga:{queue:1},
 sc:"Referee 2 at {qjournal} has read “{qpaper}” and would like a different one. Not a revision: a different paper, with a different question, which they describe over four pages with a clarity that suggests they have been meaning to write it themselves.",
 ch:[
 {t:"Write Referee 2's paper.",fx:{B:8,R:-3,mod:"delay"},say:"It will take a year. The new paper will be fine. It will not be yours, and it will not be Referee 2's either, and it will be cited by neither of you."},
 {t:"Write a response explaining why not.",roll:{stat:"R",pivot:50,
   win:{fx:{R:4,E:4,mom:4,mod:"accept"},say:"The editor sides with you. Referee 2 is dropped from the second round. The paper goes through as it was, which is the most anyone can hope for from a process."},
   lose:{fx:{E:-6,B:4,mod:"reject",foe:{why:"your response letter to their report",poisons:"referee"}},say:"The editor sides with Referee 2, who is, it turns out, the editor's coauthor. Rejected; the paper is back in the drawer. Referee 2 will write the different paper next year."}}},
 {t:"Withdraw. Send it elsewhere.",fx:{E:-2,B:2,mod:"resubmit"},say:"It goes out again, one tier down. Elsewhere has its own Referee 2."}]},

{id:"R3",ti:"The Doable Request",b:[1,4],ex:{base:.9},ga:{queue:1},
 sc:"The request from {qjournal}, on “{qpaper}”, is reasonable. Add a section. Address the alternative explanation. Include the robustness table. Each item is doable, and you can see, with complete clarity, that doing all of them will make the paper longer, safer, and worse.",
 ch:[
 {t:"Do all of it.",fx:{B:5,R:-2,mom:2,mod:"accept"},say:"Fifty-one pages, up from twenty-eight. It goes through. The result will be in there, somewhere around page nineteen, and the people who find it will be the people who already knew."},
 {t:"Do the table. Argue the rest.",fx:{R:3,B:3,mod:"delay"},say:"Thirty-four pages. One more round. The referee will, grudgingly, accept that the alternative explanation is addressed in footnote 9, which it was in the first version."},
 {t:"Refuse everything. The paper is finished.",roll:{stat:"E",pivot:65,
   win:{fx:{R:5,E:6,mom:5,mod:"accept"},say:"The editor, unexpectedly, agrees: “the referees have not identified an error.” It goes through as is. This happens roughly once per career, and you have now used yours."},
   lose:{fx:{E:-8,mom:-4,mod:"reject"},say:"Rejected, with a line about “unwillingness to engage.” The paper is back in the drawer. You were right about the paper and wrong about the process, and only one of those is on your CV."}}}]},

{id:"R4",ti:"The Recent Literature",b:[1,4],ex:{base:.8},ga:{queue:1},
 sc:"The editor's letter on “{qpaper}”, in its last paragraph, notes that the paper “would benefit from engaging with the recent literature on the topic,” and lists four papers. All four are by the editor.",
 ch:[
 {t:"Cite all four.",fx:{N:3,E:-3,mod:"accept"},say:"It goes through. The paragraph you wrote about the editor's work is polite and untrue, and will be read by the editor's students as evidence of influence."},
 {t:"Cite the one that is actually relevant.",fx:{R:2,E:2,mod:"delay"},say:"One more round. The editor does not mention the other three. It will get there, eventually, with a slightly colder covering letter."}]},

{id:"R5",ti:"Round Three",b:[2,4],ex:{base:.8},ga:{queue:1},
 sc:"Third revision. “{qpaper}” has been under review at {qjournal} for three years, has been read by seven people, and is now longer than your dissertation. The new report asks for one more thing. It is small. It is always small.",
 ch:[
 {t:"Do it.",fx:{B:6,R:-1,mod:"accept"},say:"It goes through. You do not open the champagne. It will appear four years and two months after it was finished, and the field will have moved, and it will be cited as if it had appeared in the year it was written, which it did not."},
 {t:"Withdraw. Post it as a working paper. Forever.",fx:{E:3,mom:2,R:1,cites:30,mod:"reject",flag:"FOREVER_WP"},say:"It is cited more as a working paper than it would have been in print. It is not on your CV in the right column. Both of those facts are true, and the second is the one that counts."}]},

{id:"R6",ti:"Six Days",b:[2,4],ex:{base:.12,highMom:2.2},once:1,
 sc:"An email from the editor of the Quarterly, six days after submission. There are no reports attached. The email is one line.",
 auto:{good:1,fx:{mom:12,E:8,R:2,submit:{tier:"A+",lag:[1,1],jn:"the Quarterly"}},say:"Accepted. No revisions. This happens to perhaps thirty papers a decade, and it has happened to yours, and you will spend some years learning not to mention it."}},

{id:"R7",ti:"Monday",b:[1,4],ex:{base:.5,highMom:.5},
 sc:"A working paper appears on Monday, from a group at Thromber, with your question, your identification, and a bigger dataset. It is good. It is, in every way that matters to a journal, your paper, and it is not yours.",
 auto:{bad:1,fx:{wip:-40,B:6,E:-5,mom:-4},say:"Eight months of work become a footnote in someone else's paper — “see also the contemporaneous work of” — and the footnote is generous, and generous is worse."}},

/* ---------- things that simply happen ---------- */
{id:"X1",ti:"The Policy Fight",b:[3,4],ex:{base:.5,highP:1},ga:{R:40},once:1,
 sc:"A minister has cited your 2038 paper in a speech, incorrectly. The opposition has cited it back, correctly. The paper is now the most downloaded thing on the journal's site, and you have been asked, by four journalists in a morning, what you “actually found.”",
 auto:{good:1,fx:{cites:90,P:8,mom:6,N:3},say:"The citations are real and permanent and have nothing to do with the paper's quality, which is what citations are."}},

{id:"X2",ti:"Next Door",b:[2,4],ex:{base:.5},ga:{N:30},once:1,
 sc:"Your most frequent coauthor has had a different paper — not yours, one with someone else — retracted for fabricated data. The data were fabricated by the someone else. It does not matter.",
 auto:{bad:1,fx:{N:-6,mom:-5,B:4},say:"For a year every paper with his name on it is read twice, and half of them have yours on it too."}},

{id:"X3",ti:"Asbestos",b:[0,4],ex:{base:.4},once:1,
 sc:"The building is closed for a year. Your office, your books, and the whiteboard with the only correct version of the proof on it are behind a plastic sheet with a warning on it.",
 auto:{bad:1,fx:{B:6,R:-1},say:"You work from a table in the library, between undergraduates, and produce, for reasons you cannot explain, slightly better work."}},

{id:"X4",ti:"The Council Reorganises",b:[2,4],ex:{base:.7},ga:{flag:"FUNDED"},once:1,
 sc:"The research council has been merged with another research council. Your grant, which was in year two of four, now belongs to a programme that no longer exists and a programme officer who has retired.",
 auto:{bad:1,fx:{K:-3,B:5,R:-2},say:"Eleven months of emails restore the money. Nobody restores the eleven months."}},

{id:"X5",ti:"Week Four",b:[3,4],ex:{base:.5},ga:{N:35},once:1,
 sc:"A former student — not one you remember well — has made partner at a firm that advises governments, and has sent a note: she still uses the thing you said in week four about identification, and would you like to consult?",
 auto:{good:1,fx:{S:9,N:4},say:"You do not remember week four. You take the consultancy. It pays for the thing the university would not."}},

{id:"X6",ti:"The Dean Resigns",b:[3,4],ex:{base:.6,office:1},ga:{office:1},once:1,
 sc:"The dean has resigned, abruptly, for reasons described as personal and understood by everyone to be about the provost. There is, suddenly, a vacancy above you.",
 auto:{good:1,fx:{K:4,N:4,mom:3},say:"Your name is mentioned. You did nothing to cause this, which is the best position from which to be mentioned."}},

{id:"X7",ti:"Deferred",b:[2,4],ex:{base:.5},
 sc:"Your sabbatical has been deferred a year “for teaching needs,” which means someone else's sabbatical was not deferred.",
 auto:{bad:1,fx:{B:8,E:-3},say:"You teach the course. The year you had planned exists only as a document, and the document is very good."}},

{id:"X8",ti:"The Blue Cover",b:[3,4],ex:{base:.4,highMom:1},ga:{R:50},once:1,
 sc:"A textbook — the textbook, the one with the blue cover — has, in its ninth edition, a box with your name on it. The box is four sentences long and slightly wrong.",
 auto:{good:1,fx:{cites:70,P:5,mom:8,E:5},say:"Every undergraduate in the country now knows a slightly wrong version of what you did. It is, in citation terms, the best thing that has ever happened to you."}},

{id:"X9",ti:"The Flyout",b:[0,1],ex:{base:.6},once:1,
 sc:"The flyout at Pelham. The projector failed, then worked, then your third slide had the wrong figure, and a man in the front row asked whether you had “considered the obvious endogeneity,” and you had, and you said so in a voice you did not recognise.",
 auto:{bad:1,fx:{E:-6,N:-2,B:3},say:"They hire someone else. Nobody is unkind. Unkindness would at least have been a response."}},

/* ---------- the postdoc years ---------- */
{id:"D8",ti:"Frankfurt",b:[1,2],ex:{base:.8},once:1,
 sc:"A year at the central bank in Frankfurt. Real data, real money, an office with a view of the river, and a year in which you will write nothing that anyone in a department reads.",
 ch:[
 {t:"Go.",fx:{K:8,N:6,S:6,R:-3,B:-4,flag:"FRANKFURT"},say:"The data are extraordinary and the meetings are long. You come back with a paper that policy people love and referees describe as “descriptive,” and a Rolodex — they still say Rolodex there — that will matter in fifteen years."},
 {t:"Stay. The clock.",fx:{R:4,wip:15},say:"The river stays in Frankfurt. The paper you write instead is very clean."}]},

{id:"D9",ti:"The Slot",b:[1,2],ex:{base:.8},once:1,
 sc:"One presentation slot in the main session. It is yours. A friend from graduate school, whose market year this is, has a paper that would benefit from it more.",
 ch:[
 {t:"Give her the slot.",fx:{N:7,R:-1,E:-2,flag:"GAVE_SLOT"},say:"She gives the talk. She gets the job at Ostrander, in part because of it. Fifteen years later she is chairing a search, and you are on the list, and she says, out loud, “I owe this one a slot.”"},
 {t:"Keep it.",fx:{R:3,mom:3,N:-2},say:"You give the talk. It is good. She presents in the parallel session to nine people and gets the job anyway, and does not owe you anything, which is a different kind of relationship."}]},
/* ================================================================
   BATCH 4 — exits, Harwich, oysters, failures, HR, the genius,
   what everyone saw, and Lund
   ================================================================ */

/* ---------- the exit upward ---------- */
{id:"N14",ti:"Fait Accompli",b:[4,4],ex:{base:.3,lowMom:1.4,highK:.8},ga:{K:45,N:40},once:1,tr:"nobel",
 sc:"Pelham College would like you to apply for its presidency. The word “apply” is doing no work in that sentence: {firm}, has explained, over a lunch you did not pay for, that the committee has one name. The salary is a little over four times your current one. Your last paper was three years ago, and you know why.",
 ch:[
 {t:"Take it. The research was stalling anyway.",fx:{appoint:"PELHAM",S:210,K:10,N:8,P:6,B:12,mod:"nobelDead",flag:"EXIT_UPWARD"},say:"The inauguration is in October, which is the month the phone would have rung. It does not ring for presidents; everybody knows this, and you knew it when you said yes. The office has a fireplace. The salary is — you check, once, in the first week — real."},
 {t:"Decline. You are a researcher.",fx:{R:5,mom:6,E:6,N:-3,wip:20,flag:"DECLINED_PRESIDENCY"},say:"You say no to four times your salary in order to remain a person whose papers are not being read. The search firm is baffled. Somewhere, a colleague hears about it and revises an opinion of you upward, which is the only currency you were bidding in."}]},

/* ---------- the Harwich search, from outside ---------- */
{id:"G21",ti:"The External Member",b:[4,4],ex:{base:.6,highK:1,highN:.8},ga:{K:40,N:45},once:1,
 sc:"Harwich College is choosing its next president and would like you on the committee as an external member. Nineteen people, four of whom matter; you would be one of the four. The longlist is in the attachment. Two of the names on it are people who have, over the years, made a point of remembering you.",
 ch:[
 {t:"Serve. Make sure your enemies don't get it.",fx:{K:8,N:5,E:3,clearFoe:"search",flag:"BLOCKED_AT_HARWICH"},say:"You are scrupulously fair in every meeting and devastating in one of them, about one candidate, on the merits. The candidate is not appointed. Nobody in the room knows the history, and one person guesses, and says nothing, and is now someone who knows something about you."},
 {t:"Serve honestly. Recuse where you should.",fx:{K:6,N:8,flag:"SERVED_HARWICH"},say:"You recuse from two discussions and say so out loud, which the chair notes with something like surprise. The appointment is a good one. For the rest of your life you are “someone who was on the Harwich search,” which turns out to open doors you had not thought were doors."},
 {t:"Decline — and put your own name forward.",gate:{K:60},fn(){
   const p=sig((g.K-82)/12 + 0.9*(g.N-60)/30 + (g.won.PRESALT?0.9:0) - 0.5*foesOf("search") - (g.flags.LITIGIOUS?0.25:0));
   if(Math.random()<p){
    if(g.target){ g.won.PRES=1; g.office=4; g.uni="HARWICH"; g.S+=80; pendingNext=()=>end("PRES"); return "The committee, without you on it, chooses you. The search firm says this has never happened and that it will not be mentioning where the idea came from."; }
    g.office=4; g.uni="HARWICH"; g.won.PRESALT="HARWICH"; g.presSince=g.turn; g.S+=80; g.nobelDead=true;
    return "The committee, without you on it, chooses you. You are the president of Harwich College, which you did not vow, and the phone from Stockholm does not ring for presidents.";
   }
   g.N=clamp(g.N-12,0,100); g.E=clamp(g.E-10,0,100); g.B=clamp(g.B+8,0,100); addFoe({why:"you declined their committee to run against their candidate",poisons:"search"});
   return "They appoint a sitting president from a larger system. Your withdrawal from the committee is remembered by everyone on it as the moment they understood you, and the understanding is not flattering.";
 }}]},

/* ---------- oysters ---------- */
{id:"G22",ti:"Oysters",b:[3,4],ex:{base:.6,highN:.6},ga:{N:35},once:1,
 sc:"You gave the dinner for {laureate}. Oysters, in quantity, from a supplier a colleague recommended. By Tuesday morning, eleven people — {laureateS}, two deans, your most promising student and you — have the same story, and it is not a story about economics.",
 ch:[
 {t:"Email everyone. Apologise. Name the supplier.",fx:{N:2,E:-3,K:1},say:"The email is dignified and specific. The supplier is never used again by anyone in the city. {laureateS} replies, from a bed, with a single line: “worth it.” You will never know whether he meant the dinner."},
 {t:"Blame the caterer, publicly, at the next seminar.",fx:{N:-3,E:2,P:-2},say:"The caterer was a colleague's cousin. This was known to everyone but you. The seminar remembers the speech more than the oysters."},
 {t:"Send everyone a bottle and say nothing.",fx:{N:4,S:-2},say:"Eleven bottles. Nobody mentions Tuesday, ever, which in this profession is the highest form of forgiveness and the most expensive."}]},

/* ---------- the CV of failures ---------- */
{id:"G23",ti:"The Other CV",b:[3,4],ex:{base:.6,highP:.6},once:1,
 sc:"A scholar at Bellweather who collects CVs of failures — rejections, lost jobs, the grants that were not funded — has invited you to submit one. They are published, with names. Several people you admire have done it. Several people you do not admire have done it better.",
 ch:[
 {t:"Decline.",fx:{},say:"You have a CV. It is the other kind. Nothing happens, which is the point of the other kind."},
 {t:"File something dreadfully honest.",fx:{P:6,N:5,E:-6,flag:"HONEST_CV"},say:"You write: <em>“2031 — rejected by the Quarterly, the Review, the American and Metrica, in that order, for the same paper, which I still think is my best. 2036 — did not get the Harwich job; the person who did is now my dean. 2039 — told a graduate student her idea was derivative. It was not.”</em> It is read more than your last four papers, and by the graduate student."},
 {t:"File something funny.",fx:{P:8,E:4,N:2,flag:"FUNNY_CV"},say:"You write: <em>“Failed to become an economist's economist; settled for being an economist. Applied for eleven grants; funded for one; spent it on a conference in a city I can no longer name. Have been described in a referee report as ‘competent,’ which I have had framed.”</em> It is quoted at a dinner in your honour, years later, by someone who thinks you will enjoy it, and you do, mostly."}]},

/* ---------- HR ---------- */
{id:"Q14",ti:"Head of HR",b:[3,4],ex:{base:1,office:1.5},ga:{office:4},once:1,
 sc:"Your head of HR has resigned, for reasons everyone describes as personal and one person describes as the provost. The office is, for the first time in the university's history, yours to shape.",
 ch:[
 {t:"Turn HR into an enabling body. Say so in an all-staff email.",fx:{K:4,N:6,P:3,flag:"HR_ENABLING"},say:"The email is warm and uses the word “partner” four times. A consultant is hired. A poster is designed. For a year everyone is enabled."},
 {t:"Hire the hardest compliance lawyer on the market.",fx:{K:7,N:-6,B:-3,flag:"HR_HARD"},say:"She arrives, reads every policy, and rewrites the ones that would lose in court, which is all of them. The faculty describe her as “chilling.” The university's legal bills fall by half, and nobody thanks anyone for money not spent."},
 {t:"Let the provost sort it.",fx:{K:-2,B:-2},say:"The provost appoints his deputy's friend. It is fine. It is exactly as fine as it was before, and you have missed the one moment when it could have been something else."}]},

{id:"Q15",ti:"Enabled",b:[3,4],ex:{base:1.2},ga:{since:["HR_ENABLING",6]},once:1,
 sc:"Eighteen months of enabling. HR has approved every request. There are three lawsuits, a department with two chairs and no dean, and a leave policy that an auditor has described as “generous to the point of art.” The consultant has sent a second invoice.",
 auto:{bad:1,fx:{K:-6,N:-3,B:6,S:-3},say:"You hire the compliance lawyer after all. She reads the poster on her first day and asks, politely, whether it can be taken down."}},

/* ---------- the genius ---------- */
{id:"Q16",ti:"The Potential Laureate",b:[3,4],ex:{base:1,office:1.5},ga:{office:3},once:1,
 sc:"The economics department would like to hire X. Everyone who is asked describes X as a future Nobel winner, and several of them mean it. X will cost a chair, a centre, two junior lines, a spousal appointment, and a sum for “transition” that the dean of engineering has already heard about.",
 ch:[
 {t:"Go all out. Break the bank.",fx:{K:-4,N:8,P:6,mom:6,S:-4,flag:"BET_GENIUS"},say:"X arrives in September with an entourage and a view. The engineering dean does not attend the reception. The press release uses the word “transformational,” and for once it may be right, and for once that is the risk."},
 {t:"Support it, knowing the money will kill it.",fx:{K:5,N:4,E:2},say:"You say yes in every meeting and the number says no in the last one. The department blames the number. X goes to Thromber. You are remembered as supportive, which is what you were, in the way that costs nothing."},
 {t:"Decline. One person is not a strategy.",fx:{K:3,N:-7,E:-2},say:"The department does not forgive you. It is, in a decade, a good department that nobody outside it mentions, and you will not be able to say whether that is because of X or in spite of the money."}]},

{id:"Q17",ti:"The Call, Next Door",b:[3,4],ex:{base:1.3},ga:{since:["BET_GENIUS",8]},once:1,
 sc:"October. A phone rings in the building — not yours.",
 ch:[
 {t:"Go and find out.",roll:{stat:"coin",
   win:{fx:{P:10,N:8,K:6,mom:10,S:6,flag:"GENIUS_PAID"},say:"X has won it. The press release you wrote four years ago is quoted back to you by three newspapers. The engineering dean sends a note that says only “fine.” The bank you broke is, it turns out, the kind that pays out."},
   lose:{fx:{K:-3,P:-6,N:-4,B:6,flag:"GENIUS_LISTED"},say:"The phone was a journalist. A spreadsheet is circulating, with names, and X is on it four times, and the four are dated, and two of them are dated since September."}}}]},

{id:"Q18",ti:"The Star's Past",b:[3,4],ex:{base:1.4},ga:{flag:"GENIUS_LISTED"},once:1,
 sc:"The spreadsheet is now a newspaper. X has issued a statement through a lawyer. The department is divided in a way that will outlast everyone in it. The board would like to know, by Friday, what you are going to do about the person you paid a centre and two lines for.",
 ch:[
 {t:"Suspend X pending investigation.",fx:{K:6,P:-4,N:-6,B:8,flag:"SUSPENDED_STAR"},say:"The investigation takes a year and finds enough. X leaves for a think tank with the settlement and the view. The centre keeps the name for eighteen months, until someone notices, and then it does not."},
 {t:"Stand by X. Due process.",fx:{K:-8,P:-16,N:-10,B:10,foe:{why:"you stood by X",poisons:"search"},flag:"STOOD_BY"},say:"You say “due process” eleven times in a week. The process, when it is due, finds against X, and the eleven times are quoted in the same article, and your name is in the headline and X's is in the second paragraph."},
 {t:"Ask X to resign, quietly, with the money.",fx:{K:3,P:-8,N:-4,E:-4},say:"X resigns for “family reasons” with a payment nobody discloses, and reappears at Calderon in the spring. The spreadsheet's authors add a column. The column is headed “where they went,” and your university's name is in it."}]},

/* ---------- what everyone saw ---------- */
{id:"G24",ti:"The Spreadsheet",b:[3,4],ex:{base:.7},ga:{N:30},once:1,
 sc:"A spreadsheet is circulating. It has names, and it has yours — not as a subject, as a witness. A colleague you hired, and defended at tenure, is on it three times. You have known him for fifteen years and have, you realise, never once been surprised by anything he did.",
 ch:[
 {t:"Go to HR yourself. Today.",fx:{K:4,N:-6,E:-3,foe:{why:"you went to HR about them",poisons:"vote"},flag:"WENT_TO_HR"},say:"The process starts. He is told, within the hour, who started it. The department splits along a line you did not know was there, and you are on the smaller side of it, and the smaller side is right."},
 {t:"Talk to him first.",roll:{stat:"coin",
   win:{fx:{N:2,K:-2,E:2},say:"He listens. He is ashamed, or performs it well enough that you cannot tell, and he stops, or is careful, and the spreadsheet does not gain a fourth entry. You will never know what you prevented, or whether you prevented anything."},
   lose:{fx:{N:-2,E:-2,flag:"WARNED_HIM"},say:"He listens. He thanks you. He deletes things. When the investigation comes, it comes with an email, and the email is yours, and it says “heads up,” and those are the two words the report quotes."}}},
 {t:"Say nothing. It's a spreadsheet.",fx:{E:-4,B:3,flag:"SAW_LIST"},say:"It is a spreadsheet, and then it is a newspaper, and then it is a hearing, and at the hearing someone asks who knew, and the answer includes a witness column, and the witness column includes you."}]},

{id:"G25",ti:"Heads Up",b:[3,4],ex:{base:1.3},ga:{since:["WARNED_HIM",6]},once:1,
 sc:"The investigation has your email. Two words.",
 auto:{bad:1,fx:{K:-8,N:-10,P:-8,E:-6,B:6},say:"You are not the subject of the report. You are on page four, in a paragraph that begins “it is regrettable that,” and page four is the page that gets photographed."}},

{id:"G26",ti:"The Laureate's Hand",b:[3,4],ex:{base:.7},ga:{N:35},once:1,
 sc:"You are hosting. {laureate} — charming, seventy-three, on your committee — puts his hand on the back of your graduate student, low, and leaves it there while he talks. She looks at you. Across a table, with eleven people watching, she looks at you.",
 ch:[
 {t:"Say something. Now. At the table.",fx:{N:-6,E:2,K:2,foe:{why:"you corrected them at your own dinner",poisons:"committee"},flag:"SPOKE_UP"},say:"You say his name, once, in a tone. He removes the hand and is gracious for the rest of the evening in a way that costs you a committee. The student says nothing at the time and, years later, at her own dinner, tells the story with your name in it."},
 {t:"Take her aside afterwards. Apologise for him.",fx:{N:2,E:-3,flag:"APOLOGISED_FOR_HIM"},say:"You apologise for a thing you did not do, on behalf of a man who will not. She is gracious about it, which is worse. You have learned that “afterwards” is the word the profession runs on."},
 {t:"Look away. He's seventy-three.",fx:{E:-5,B:3,flag:"WATCHED"},say:"You look at the wine. The dinner continues. She leaves early, and finishes her PhD, and does not stay in the field, and there is no single reason for that, and there is this."}]},

{id:"G27",ti:"The Essay",b:[3,4],ex:{base:.8,highP:.8},ga:{since:["WATCHED",8]},once:1,
 sc:"Your former student has written an essay. It is about a dinner. It does not name the laureate, who is dead. It does not name you. It describes the host, who “looked at the wine,” and the description is very good.",
 auto:{bad:1,fx:{P:-8,N:-6,E:-8,B:4},say:"Everyone who was at the dinner reads it. Several of them forward it to you, with no comment, which is a comment."}},

{id:"C7",ti:"The Most Cited Member",b:[3,4],ex:{base:1,office:1.4},ga:{office:1},once:1,
 sc:"A formal complaint has been made against {mostcited}, the department's most cited member: three students, one pattern, six years. He brings in a third of the department's grant income and two-thirds of its reputation. You are chair. The complaint is on your desk and so, an hour later, is he.",
 ch:[
 {t:"Start the process. Recuse yourself from it.",fx:{K:6,N:-8,B:6,foe:{why:"you started the process against them",poisons:"vote"},flag:"PROCESSED_STAR"},say:"The process runs for a year. He is found to have done what three students said he did. He leaves for Calderon with a chair and his grants, and the department is smaller and, in a way nobody will put on a slide, cleaner."},
 {t:"Protect him. The department needs him.",fx:{K:-4,N:4,E:-3,flag:"PROTECTED_STAR"},say:"You have a quiet word. He is careful for a while. The grants continue. The three students are given, variously, a different supervisor, a reference, and a reason to leave academia, and each of them remembers exactly who was chair."},
 {t:"Send it up. The dean's problem.",fx:{K:2,N:-2,B:-2},say:"The dean handles it, which means the dean's office handles it, which means it is handled in the way that office handles things. You have kept your hands clean by not using them."}]},

{id:"C8",ti:"What the Chair Knew",b:[3,4],ex:{base:1.3,highP:1},ga:{since:["PROTECTED_STAR",6]},once:1,
 sc:"It comes out. It always comes out; the only variable is the year. The report, when it is published, has a section on the department's leadership at the time, and a sentence that begins “the then-chair was informed.”",
 auto:{bad:1,fx:{K:-10,N:-12,P:-10,E:-8,B:8,mod:"resignOffice"},say:"You are not the subject. You are the sentence. You resign whatever you currently hold, for reasons described as personal, and the description is accepted by everyone who has read the report."}},

/* ---------- Lund ---------- */
{id:"N15",ti:"Lund",b:[3,4],ex:{base:.7,highMom:1.2},ga:{R:50,N:40},once:1,tr:"nobel",
 sc:"You have been invited to organise a workshop in Lund, on a theme of your choosing, with a budget that suggests someone in Sweden likes you. Lund is forty minutes from Copenhagen and, by a train you have already looked up, a little over four hours from Stockholm.",
 ch:[
 {t:"Pick the hottest theme in the field. It isn't yours.",fx:{N:9,mom:6,R:-2,P:3,flag:"LUND_HOT"},say:"Everybody comes. The workshop is superb and nobody at it is working on your problem. Two people from Stockholm sit at the back on the second day and take notes on the hottest theme in the field, which is not yours, and you organised it for them."},
 {t:"Pick your theme.",roll:{stat:"R",pivot:62,
   win:{fx:{mom:16,N:5,R:3,E:5,flag:"LUND_MINE"},say:"Fourteen people, all of whom matter, in a room with good coffee, talking about your problem for two days. Two people from Stockholm sit at the back on the second day. They do not take notes. They do not need to."},
   lose:{fx:{E:-5,N:-3,mom:-3},say:"Eleven people, two of whom are your students. The two from Stockholm come on the first day and leave after lunch, and you watch the train timetable on your phone in a way you will not admit to."}}}]},
/* ================================================================
   BATCH 5 — what the papers do once they exist; citations;
   and the thin stages filled
   ================================================================ */

/* ---------- theory ---------- */
{id:"F1",ti:"The Assumption",b:[3,4],ex:{base:.7,highMom:.8},ga:{field:"theory"},once:1,
 sc:"Your assumption has a name now. It is your name. Somebody used it in a seminar at Calderon as if it were a standard thing — “under the usual conditions, and assuming” you — and nobody laughed, and that is how you know.",
 auto:{good:1,fx:{mom:8,E:6,N:3,cites:30},say:"It is used, for the rest of your life, by people who have never read the paper it came from, which is the definition of having made it."}},
{id:"F2",ti:"The Counterexample",b:[2,4],ex:{base:.8},ga:{field:"theory"},once:1,
 sc:"A second-year at Bellweather has a counterexample to Corollary 3. It is correct. Corollary 3 is not the main result, but it is the one everyone quotes, because it is the one that fits on a slide.",
 ch:[
 {t:"Post a correction. Thank the student by name.",fx:{R:2,N:4,E:-4,flag:"THANKED_STUDENT"},say:"The corollary is withdrawn. The theorem stands. The student is thanked in print, which at Bellweather in second year is a thing that gets you a job, and it does, and she tells people why."},
 {t:"Add a condition. Call it a “clarification.”",fx:{E:2,R:-1,foe:{why:"their counterexample was a clarification",poisons:"referee"}},say:"Corollary 3 now has a footnote and the footnote has a condition and the condition is exactly the student's counterexample with the sign flipped. She notices. She is patient."}]},

/* ---------- micro ---------- */
{id:"F3",ti:"The Merger Case",b:[3,4],ex:{base:.7,highP:.5},ga:{field:"micro"},once:1,
 sc:"Your paper is Exhibit 14 in a merger case. Both sides have read it. One side would like you to explain, for a fee that is not a rounding error, why the paper says what they say it says. It does, mostly.",
 ch:[
 {t:"Testify. For them.",fx:{S:22,P:6,N:2,R:-2,E:3,flag:"EXPERT_WITNESS"},say:"Four days in a room with lawyers, being paid to be certain. The merger goes through. Your paper is now “the paper the merger was built on,” and the other side's expert, who was right about paragraph 9, referees for the Review."},
 {t:"Decline. The paper says what it says.",fx:{R:2,E:-2,N:1},say:"A colleague at Ostrander testifies instead, for the fee, and says what you would have said, and the merger goes through, and you have kept a thing nobody was measuring."}]},
{id:"F4",ti:"Section 4",b:[2,4],ex:{base:.6},ga:{field:"micro"},once:1,
 sc:"A letter from a general counsel. The firm in Section 4 — described, you now recall, as “a dominant incumbent with a demonstrated capacity for retaliation” — has read Section 4.",
 ch:[
 {t:"Reply through the university's lawyers.",fx:{K:4,B:4,P:2},say:"Eleven months of letters. Nothing is retracted. You learn that “demonstrated” is a word lawyers price differently from economists, and you never use it in print again."},
 {t:"Reply yourself. Cite the footnote.",roll:{stat:"E",pivot:55,
   win:{fx:{E:5,P:4,mom:3},say:"The footnote holds. The general counsel, unexpectedly, is an economist by training and concedes the point in a second letter that you keep. Section 4 is quoted, for a decade, by everyone who sues them."},
   lose:{fx:{B:8,K:-2,E:-4,S:-6},say:"The university's lawyers find out you replied yourself in the same week they receive the second letter, which is longer. There is a meeting. You are asked, gently, not to do that again."}}}]},

/* ---------- macro ---------- */
{id:"F5",ti:"The Central Bank Adopts It",b:[3,4],ex:{base:.7,highP:.6},ga:{field:"macro"},once:1,
 sc:"A central bank has put your model in its forecasting suite. There is a press release with your name in it. There is a lunch. There is, at the lunch, a deputy governor who asks what the model does in a recession, and you have to think about it.",
 ch:[
 {t:"Take the lunch and the credit.",fx:{P:8,N:6,mom:6,S:4,E:5,flag:"ADOPTED_MODEL"},say:"For two years you are the person whose model the bank uses. The phrase appears in your introductions. You do not look too closely at what the model does in a recession, and neither, it will turn out, do they."},
 {t:"Tell the deputy governor what it does in a recession.",fx:{N:4,K:3,P:2,E:-3},say:"You say: it misses it. The deputy governor nods and adopts it anyway, with a footnote, and when the recession comes the footnote is the reason your name is not in the newspaper."}]},
{id:"F6",ti:"The Recession",b:[3,4],ex:{base:1.2},ga:{since:["ADOPTED_MODEL",6]},once:1,
 sc:"The recession has come, and the model did what you did not look at. A newspaper has found the press release with your name in it.",
 auto:{bad:1,fx:{P:-10,N:-5,E:-8,mom:-8},say:"The bank quietly retires the model. Your name stays in the press release, which is still online, and will be, and is the second search result."}},

/* ---------- metrics ---------- */
{id:"F7",ti:"The Package",b:[2,4],ex:{base:.8},ga:{field:"metrics"},once:1,
 sc:"Someone has found a bug in the R package that implements your estimator. It has been downloaded eleven thousand times. Four hundred papers have used it. The bug flips the sign of the standard error in a case that is, unfortunately, the common case.",
 ch:[
 {t:"Fix it. Post it. Email the four hundred.",fx:{K:4,N:6,R:2,E:-4,B:8,flag:"FIXED_PACKAGE"},say:"Four hundred emails, most of them ignored, eleven of them furious, three of them grateful. Two papers are corrected. You are, for a year, the person who broke everyone's standard errors, and then, slowly, the person who told them."},
 {t:"Fix it quietly. Version 2.1.",fx:{E:2,B:2,flag:"QUIET_PACKAGE"},say:"The changelog says “minor improvements to numerical stability.” Nobody re-runs anything. The four hundred papers stand, wrong in a way that only you and one person at Thromber can see, and the person at Thromber is writing it up."}]},
{id:"F8",ti:"The Instrument",b:[2,4],ex:{base:.7},ga:{field:"metrics"},once:1,
 sc:"A replication says your instrument was weak. It was. The first-stage F was 8.7 and you reported it in a footnote in a font that could be described as discreet.",
 ch:[
 {t:"Concede. Re-run with the new method. Same result, wider bands.",fx:{R:3,N:3,E:-4,flag:"CONCEDED_F"},say:"The result survives with an interval you can drive a bus through. The replication team cite your response as “exemplary,” which is what you say about people who lost gracefully."},
 {t:"Argue that 8.7 was fine in 2033.",fx:{E:4,N:-4,R:-2,foe:{why:"you argued 8.7 was fine",poisons:"referee"}},say:"It was fine in 2033. It is not 2033. The replication team's reply has a figure with your footnote in it, enlarged, and the figure is on a slide in every econometrics course in the country by spring."}]},

/* ---------- finance ---------- */
{id:"F9",ti:"The Strategy",b:[3,4],ex:{base:.7,highP:.5},ga:{field:"finance"},once:1,
 sc:"A hedge fund has been trading your anomaly. It made money for three years, which is two years longer than you predicted and one year less than they hoped. The anomaly is now gone, and the fund would like to know why, and would like to pay you to say.",
 ch:[
 {t:"Consult. Explain that publishing it killed it.",fx:{S:18,N:4,P:3,E:3,flag:"CONSULTED_FUND"},say:"You are paid a great deal to explain your own paper's abstract to people who read it three years ago. They nod. They hire your student. The anomaly does not come back."},
 {t:"Decline. Write the follow-up paper instead.",fx:{R:4,mom:4,submit:{bias:.5,lag:[4,6],f:"finance"}},say:"“The Disappearance of an Anomaly After Publication” goes out. It is, you notice, the same paper as the consultancy, in a different font, for a different fee."}]},
{id:"F10",ti:"Flashing Red",b:[3,4],ex:{base:.6},ga:{field:"finance"},once:1,
 sc:"Your systemic-risk measure has been flashing red for four months. Nobody at the regulator returns the email. A journalist has noticed the measure, and the flashing, and your name on both.",
 ch:[
 {t:"Go public. Op-ed, this week.",roll:{stat:"coin",
   win:{fx:{P:14,N:6,mom:10,E:8,flag:"CALLED_IT"},say:"Something breaks in the spring. You called it. For eighteen months you are on every panel, and the regulator, who did not return the email, introduces you as “a friend of the institution.”"},
   lose:{fx:{P:-6,E:-8,N:-4,foe:{why:"you cried wolf in the newspaper",poisons:"committee"}},say:"Nothing breaks. The measure stops flashing in June. The op-ed is still online, and is quoted, gently, at every conference for a decade by a man who has never been wrong in print because he has never been in print."}}},
 {t:"Send the email again. Copy nobody.",fx:{K:2,B:2},say:"They reply in the autumn. Something breaks in the spring. Nobody remembers the email, including, when it matters, you."}]},

/* ---------- labour ---------- */
{id:"F11",ti:"The Minimum Wage Fight",b:[2,4],ex:{base:.7,highP:.6},ga:{field:"labour"},once:1,
 sc:"A minimum wage bill. Both sides have cited your paper in testimony, accurately, for opposite conclusions, which says something about the paper or about testimony. Both sides would like you to appear.",
 ch:[
 {t:"Appear for the side you actually agree with.",fx:{P:8,N:4,E:3,R:-1,foe:{why:"you testified against their bill",poisons:"committee"}},say:"The bill passes, or fails; the paper is cited in the record either way. Half the profession now knows what you think, which you had spent a career keeping in a footnote."},
 {t:"Appear for neither. Write a note explaining what the paper says.",fx:{R:3,N:2,K:2,E:-2},say:"The note is precise and read by nine people, two of them staffers who quote the wrong half. You have been useful in exactly the way that leaves no mark."},
 {t:"Appear for both. Same slides.",fx:{P:6,N:-3,E:5,flag:"BOTH_SIDES"},say:"You give the same testimony twice, to two committees, to opposite applause. It is the most honest thing you have done and it looks, in the newspaper, like the least."}]},
{id:"F12",ti:"Monopsony, Locally",b:[3,4],ex:{base:.6,office:.5},ga:{field:"labour"},once:1,
 sc:"The postdoc union has cited your monopsony paper in its pay claim. The university's HR has cited it back, from the other end. You are, you realise, on both sides of a negotiation you did not know was happening about a paper you had forgotten writing.",
 ch:[
 {t:"Side with the union. Publicly.",fx:{N:-4,P:5,E:2,K:-3,flag:"SIDED_UNION"},say:"The postdocs win nine percent. HR does not forgive you. The next time you need a line, the line is slow, for reasons nobody can identify."},
 {t:"Say the paper is about the private sector.",fx:{K:3,N:2,E:-3},say:"It is about the private sector. Everyone knows what you did. The postdocs win six percent and do not thank you, correctly."}]},

/* ---------- development ---------- */
{id:"F13",ti:"The Village",b:[3,4],ex:{base:.7},ga:{field:"development"},once:1,
 sc:"You have gone back. Ten years after the trial, the village in Table 3 has a road, a phone mast, and a school with your intervention's name on a sign that nobody can now explain. The treatment effect, on inspection, has become a place.",
 ch:[
 {t:"Write the ten-year follow-up.",fx:{R:5,N:4,mom:5,submit:{lag:[5,7],f:"development"},flag:"FOLLOWED_UP"},say:"The effect has faded to something that is not quite nothing, and that is what goes out. It will be cited less than the original, which is the fate of every honest sequel."},
 {t:"Don't write it up. Let the effect stand.",fx:{E:-3,B:-3},say:"The original paper keeps its number. The village keeps its sign. You keep a photograph of the sign that you do not show at seminars."}]},
{id:"F14",ti:"At Scale",b:[3,4],ex:{base:.7},ga:{field:"development"},once:1,
 sc:"An NGO has scaled your intervention to four countries, with none of the conditions under which it worked, and a logo. They would like you on the board. The board meets in Geneva.",
 ch:[
 {t:"Join the board. Try to fix it from inside.",fx:{N:8,K:4,P:4,B:6,R:-2,flag:"ON_THE_BOARD"},say:"Geneva is lovely. The intervention does not work at scale and the evaluation, which you designed, says so in a report that is discussed for forty minutes and then filed. You stay on the board. The lunches are very good."},
 {t:"Decline. Write the letter saying why.",fx:{R:3,N:-3,E:-1},say:"The letter is correct and the NGO scales it anyway, to six countries, and the logo is on a bus."}]},

/* ---------- political ---------- */
{id:"F15",ti:"The Populist",b:[3,4],ex:{base:.7,highP:.8},ga:{field:"political"},once:1,
 sc:"A populist has quoted your paper approvingly, at a rally, to eleven thousand people. The quotation is accurate. This is the problem.",
 ch:[
 {t:"Disown it. Publicly. This week.",fx:{P:6,N:3,E:-3,R:-1},say:"The op-ed explains what the paper actually implies. The populist quotes the op-ed at the next rally, selectively. You have entered a conversation that has no exit and one participant with a microphone."},
 {t:"Say nothing. The paper says what it says.",fx:{P:-3,E:-4,B:2,flag:"QUOTED_SILENT"},say:"Colleagues ask, at conferences, whether you have “seen.” You have seen. The paper is cited nineteen times that year, eleven of them by people you would not have at dinner."}]},
{id:"F16",ti:"The Campaign",b:[3,4],ex:{base:.6,highN:.5},ga:{field:"political"},once:1,
 sc:"A referendum campaign would like you as an adviser. Unpaid, unglamorous, and on the side you would have chosen anyway. It will take a term and it will be remembered, by half the country, as a side.",
 ch:[
 {t:"Advise them.",roll:{stat:"coin",
   win:{fx:{P:10,N:8,K:5,mom:6,flag:"ADVISED_WIN"},say:"They win by four points. You are described, in one newspaper, as “the brains,” which is inaccurate and framed. For a decade, a certain kind of dinner invitation arrives, and a different kind stops."},
   lose:{fx:{P:4,N:-6,E:-6,B:6,flag:"ADVISED_LOSS"},say:"They lose by eleven. The post-mortem names the economists. You are in it, in a list, alphabetically, which is the only mercy the alphabet has ever shown you."}}},
 {t:"Decline. Stay above it.",fx:{R:2,E:-1},say:"You stay above it. Above it is where nobody can see you, which is the point and the cost."}]},

/* ---------- behavioural ---------- */
{id:"F17",ti:"The Nudge Unit",b:[3,4],ex:{base:.7},ga:{field:"behavioural"},once:1,
 sc:"The government's nudge unit would like to use your effect on eleven million people. The effect was found on 312 undergraduates in a room with bad lighting. They have read the paper. They have not read the appendix.",
 ch:[
 {t:"Let them. It probably scales.",fx:{P:8,N:6,S:6,mom:5,E:4,flag:"NUDGED_NATION"},say:"It does not scale. The effect on eleven million people is indistinguishable from zero and the evaluation says so, and the nudge unit's press office does not, and your name is in the second paragraph of both documents."},
 {t:"Tell them about the appendix.",fx:{K:3,N:2,R:2,E:-2},say:"They read the appendix, and pilot it on forty thousand people first, and it does not scale, and the pilot saves them a headline, and they send you a mug."}]},
{id:"F18",ti:"Forty Studies",b:[3,4],ex:{base:.7},ga:{field:"behavioural"},once:1,
 sc:"A meta-analysis of forty studies of your effect has appeared. The pooled estimate is a small number with a confidence interval that includes zero, a negative number, and, in a footnote, your original.",
 auto:{bad:1,fx:{R:-3,mom:-6,E:-6,cites:25},say:"The meta-analysis is cited more than your paper, and cites your paper, so your count goes up. This is the profession's idea of a consolation."}},

/* ---------- history ---------- */
{id:"F19",ti:"The Historian",b:[2,4],ex:{base:.7},ga:{field:"history"},once:1,
 sc:"An actual historian, {historian}, has reviewed your paper in an actual history journal. The review is four thousand words long, uses the word “economistic” twice, and contains, in paragraph six, a fact about the archive you did not know and which changes Table 2.",
 ch:[
 {t:"Write to the historian. Ask about the archive.",fx:{N:5,R:3,K:2,E:-3,submit:{tier:"B",lag:[6,8],f:"history",jn:"the Economic History Quarterly"},flag:"WROTE_TO_HISTORIAN"},say:"She replies at length, and generously, and you go to the archive together. The paper you write with her goes out to her journal, and will be the best thing either of you has done, and will be cited by nobody in either field."},
 {t:"Reply in your own journal. Explain what a regression is.",fx:{E:4,R:-1,N:-3,P:2,foe:{why:"you explained regression to them in print",poisons:"referee"}},say:"The reply is crisp and correct and reads, in the history journal's next issue, as exactly what she said you were."}]},
{id:"F20",ti:"The Archive",b:[3,4],ex:{base:.6},ga:{field:"history"},once:1,
 sc:"A document has turned up. It is from 1383, it is in a hand you can just read, and it contradicts the third row of your table in a way that cannot be a transcription error because you have now transcribed it four times.",
 auto:{bad:1,fx:{R:-2,E:-3,B:3},say:"You post a correction. The paper is cited exactly as before, by exactly the same people, none of whom read the third row, which is how you know they never read the table."}},

/* ---------- citations ---------- */
{id:"K1",ti:"Twenty",b:[2,4],ex:{base:.8},ga:{h:20},once:1,
 sc:"Your h-index is twenty. This means nothing and everyone knows what it means.",
